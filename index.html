        ctx.fill();
        ctx.restore();
      }

      function drawPieUnifiedHull(ctx, marks, alpha, options = {}) {
        const hullAlpha = options.pieUnifiedAlpha ?? 0;
        if (marks.length < 12 || hullAlpha <= 0 || alpha <= 0) return;
        const markAt = (t) => marks[Math.max(0, Math.min(marks.length - 1, Math.round(t * (marks.length - 1))))];
        const entry = markAt(options.pieHullEntry ?? 0.16);
        const runMid = markAt(options.pieHullRun ?? 0.32);
        const fold = markAt(options.pieHullFold ?? 0.43);
        const body = markAt(options.pieHullBody ?? 0.62);
        const tail = markAt(options.pieHullTail ?? 0.98);
        const runTangent = normalize(fold.x - entry.x, fold.y - entry.y, entry.dirX, entry.dirY);
        const pieTangent = normalize(tail.x - fold.x, tail.y - fold.y, tail.dirX, tail.dirY);
        const runPerp = { x: -runTangent.y, y: runTangent.x };
        const piePerp = { x: -pieTangent.y, y: pieTangent.x };
        const turnPerp = normalize(
          lerp(runPerp.x, piePerp.x, options.pieHullTurnBlend ?? 0.58),
          lerp(runPerp.y, piePerp.y, options.pieHullTurnBlend ?? 0.58),
          piePerp.x,
          piePerp.y,
        );
        const turnTangent = normalize(
          lerp(runTangent.x, pieTangent.x, options.pieHullTurnBlend ?? 0.58),
          lerp(runTangent.y, pieTangent.y, options.pieHullTurnBlend ?? 0.58),
          pieTangent.x,
          pieTangent.y,
        );
        const half = Math.max(fold.half, options.pieHullMinHalf ?? 8.2) * (options.pieHullScale ?? 1);
        const entryTip = {
          x: entry.x - runTangent.x * half * 1.02 - runPerp.x * half * 0.08,
          y: entry.y - runTangent.y * half * 1.02 - runPerp.y * half * 0.08,
        };
        const upperRun = {
          x: runMid.x - runPerp.x * half * 0.58,
          y: runMid.y - runPerp.y * half * 0.58,
        };
        const foldTop = {
          x: fold.x + runTangent.x * half * 0.12 - runPerp.x * half * 0.68,
          y: fold.y + runTangent.y * half * 0.12 - runPerp.y * half * 0.68,
        };
        const turnShoulder = {
          x: fold.x + turnTangent.x * half * (options.pieHullShoulderAlong ?? 0.24) - turnPerp.x * half * (options.pieHullShoulderOuter ?? 0.92),
          y: fold.y + turnTangent.y * half * (options.pieHullShoulderAlong ?? 0.24) - turnPerp.y * half * (options.pieHullShoulderOuter ?? 0.92),
        };
        const outerPie = {
          x: body.x + piePerp.x * half * 0.78 - pieTangent.x * half * 0.08,
          y: body.y + piePerp.y * half * 0.78 - pieTangent.y * half * 0.08,
        };
        const tailTip = {
          x: tail.x + pieTangent.x * half * 0.48 + piePerp.x * half * 0.04,
          y: tail.y + pieTangent.y * half * 0.48 + piePerp.y * half * 0.04,
        };
        const innerPie = {
          x: body.x - piePerp.x * half * 0.4 + pieTangent.x * half * 0.08,
          y: body.y - piePerp.y * half * 0.4 + pieTangent.y * half * 0.08,
        };
        const foldInner = {
          x: fold.x + turnPerp.x * half * (options.pieHullInnerHold ?? 0.7) - turnTangent.x * half * 0.04,
          y: fold.y + turnPerp.y * half * (options.pieHullInnerHold ?? 0.7) - turnTangent.y * half * 0.04,
        };
        const lowerRun = {
          x: runMid.x + runPerp.x * half * 0.42 - runTangent.x * half * 0.1,
          y: runMid.y + runPerp.y * half * 0.42 - runTangent.y * half * 0.1,
        };
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * hullAlpha;
        ctx.beginPath();
        ctx.moveTo(entryTip.x, entryTip.y);
        ctx.bezierCurveTo(
          entry.x - runPerp.x * half * 0.38,
          entry.y - runPerp.y * half * 0.38,
          upperRun.x,
          upperRun.y,
          foldTop.x,
          foldTop.y,
        );
        ctx.bezierCurveTo(
          fold.x - turnPerp.x * half * 0.78 + turnTangent.x * half * 0.1,
          fold.y - turnPerp.y * half * 0.78 + turnTangent.y * half * 0.1,
          turnShoulder.x,
          turnShoulder.y,
          turnShoulder.x,
          turnShoulder.y,
        );
        ctx.bezierCurveTo(
          fold.x + piePerp.x * half * 0.82,
          fold.y + piePerp.y * half * 0.82,
          outerPie.x,
          outerPie.y,
          tailTip.x,
          tailTip.y,
        );
        ctx.bezierCurveTo(
          body.x - piePerp.x * half * 0.1,
          body.y - piePerp.y * half * 0.1,
          innerPie.x,
          innerPie.y,
          foldInner.x,
          foldInner.y,
        );
        ctx.bezierCurveTo(
          lowerRun.x,
          lowerRun.y,
          entry.x - runTangent.x * half * 0.32 + runPerp.x * half * 0.1,
          entry.y - runTangent.y * half * 0.32 + runPerp.y * half * 0.1,
          entryTip.x,
          entryTip.y,
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawNaiUnifiedHull(ctx, marks, alpha, options = {}) {
        const hullAlpha = options.naiUnifiedAlpha ?? 0;
        if (marks.length < 12 || hullAlpha <= 0 || alpha <= 0) return;
        const markAt = (t) => marks[Math.max(0, Math.min(marks.length - 1, Math.round(t * (marks.length - 1))))];
        const start = options.naiHullEntry ?? 0.08;
        const endT = options.naiHullEnd ?? 0.98;
        const span = Math.max(0.001, endT - start);
        const scale = options.naiHullScale ?? 1;
        const samples = Math.max(10, options.naiHullSamples ?? 22);
        const upper = [];
        const lower = [];
        for (let i = 0; i < samples; i += 1) {
          const localT = i / (samples - 1);
          const t = start + span * localT;
          const mark = markAt(t);
          const prev = markAt(Math.max(start, t - 0.025));
          const next = markAt(Math.min(endT, t + 0.025));
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perp = { x: -tangent.y, y: tangent.x };
          const pressure = mark.pressure ?? mark.model?.pressure ?? 0;
          const fan = mark.fan ?? mark.model?.fan ?? 0;
          const root = mark.model?.rootLoad ?? 0;
          const pointed = mark.pointed ?? mark.model?.pointed ?? 0;
          const slip = mark.model?.slip ?? 0;
          const stateSpread = clamp(
            0.16 + smoothstep(0.16, 0.66, pressure) * 0.58 + fan * 0.34 + root * 0.24 - pointed * 0.12,
            0,
            1.35,
          );
          const pathSpread = smoothstep(0.08, 0.58, localT);
          const spread = Math.max(pathSpread * 0.72, stateSpread);
          const footStart = options.footStart ?? 0.56;
          const footPeak = options.footPeak ?? 0.78;
          const foot = smoothstep(footStart, footPeak, localT) * (1 - smoothstep(0.88, 1, localT));
          const releaseStart = options.naiReleaseStart ?? 0.78;
          const releaseEnd = options.naiReleaseEnd ?? 1;
          const liftByPath = smoothstep(releaseStart, releaseEnd, localT);
          const liftByState = smoothstep(0.4, 0.96, pointed) * smoothstep(0.28, 0.9, slip);
          const lift = clamp(liftByPath * 0.72 + liftByState * 0.42, 0, 1);
          const tailMin = options.naiHullTailMinHalf ?? 2.2;
          const bodyMin = options.naiHullMinHalf ?? 8;
          const dynamicMin = lerp(bodyMin, tailMin, lift);
          const base = Math.max(mark.half * (1 - lift * 0.38), dynamicMin) * scale;
          const entryPinch = 1 - smoothstep(0, 0.16, localT);
          const upperHalf = base * (0.1 + 0.3 * spread + 0.08 * foot) * (1 - 0.76 * lift) * (1 - 0.44 * entryPinch);
          const lowerHalf = base * (0.1 + 0.68 * spread + 0.58 * foot) * (1 - 0.86 * lift) * (1 - 0.26 * entryPinch);
          const forward = base * (0.04 * spread + 0.08 * foot - 0.06 * lift);
          const centerX = mark.x + tangent.x * forward + perp.x * base * 0.04 * spread;
          const centerY = mark.y + tangent.y * forward + perp.y * base * 0.04 * spread;
          const lowerDrag = base * (options.naiFootBackDrag ?? 0.08) * foot * (1 - lift * 0.5);
          upper.push({ x: centerX - perp.x * upperHalf, y: centerY - perp.y * upperHalf });
          lower.push({ x: centerX - tangent.x * lowerDrag + perp.x * lowerHalf, y: centerY - tangent.y * lowerDrag + perp.y * lowerHalf });
        }
        const first = markAt(start);
        const second = markAt(Math.min(endT, start + 0.04));
        const last = markAt(endT);
        const beforeLast = markAt(Math.max(start, endT - 0.05));
        const entryTangent = normalize(second.x - first.x, second.y - first.y, first.dirX, first.dirY);
        const rawTailTangent = normalize(last.x - beforeLast.x, last.y - beforeLast.y, last.dirX, last.dirY);
        const preferredTail = normalize(options.naiTailDirX ?? 1, options.naiTailDirY ?? -0.08, rawTailTangent.x, rawTailTangent.y);
        const tailDirMix = clamp(options.naiTailDirMix ?? 0, 0, 1);
        const tailTangent = normalize(
          lerp(rawTailTangent.x, preferredTail.x, tailDirMix),
          lerp(rawTailTangent.y, preferredTail.y, tailDirMix),
          rawTailTangent.x,
          rawTailTangent.y,
        );
        const entryBase = Math.max(first.half, options.naiHullMinHalf ?? 8) * scale;
        const tailBase = Math.max(last.half, options.naiHullTailMinHalf ?? 3.2) * scale;
        const startTip = {
          x: first.x - entryTangent.x * entryBase * (options.naiHullStartReach ?? 0.18),
          y: first.y - entryTangent.y * entryBase * (options.naiHullStartReach ?? 0.18),
        };
        const tailTip = {
          x: last.x + tailTangent.x * tailBase * (options.naiHullTailReach ?? 0.5),
          y: last.y + tailTangent.y * tailBase * (options.naiHullTailReach ?? 0.5),
        };
        const curveThrough = (points) => {
          if (!points.length) return;
          if (points.length === 1) {
            ctx.lineTo(points[0].x, points[0].y);
            return;
          }
          ctx.lineTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length - 1; i += 1) {
            const current = points[i];
            const next = points[i + 1];
            const midX = (current.x + next.x) * 0.5;
            const midY = (current.y + next.y) * 0.5;
            ctx.quadraticCurveTo(current.x, current.y, midX, midY);
          }
          const lastPoint = points[points.length - 1];
          ctx.quadraticCurveTo(lastPoint.x, lastPoint.y, lastPoint.x, lastPoint.y);
        };
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * hullAlpha;
        ctx.beginPath();
        ctx.moveTo(startTip.x, startTip.y);
        curveThrough(upper);
        ctx.lineTo(tailTip.x, tailTip.y);
        curveThrough(lower.slice().reverse());
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawNaiLayeredContact(ctx, marks, alpha, options = {}) {
        const layerAlpha = options.naiLayeredAlpha ?? 0;
        if (marks.length < 12 || layerAlpha <= 0 || alpha <= 0) return;
        const start = options.naiLayeredStart ?? 0.02;
        const end = options.naiLayeredEnd ?? 0.995;
        const releaseStart = options.naiReleaseStart ?? 0.82;
        const releaseEnd = options.naiReleaseEnd ?? 1;
        const footStart = options.footStart ?? 0.58;
        const footPeak = options.footPeak ?? 0.8;
        const scale = options.naiLayeredScale ?? 1;
        const upper = [];
        const lower = [];
        const spine = [];
        const markAt = (t) => marks[Math.max(0, Math.min(marks.length - 1, Math.round(t * (marks.length - 1))))];
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          if (t < start || t > end) continue;
          const prev = marks[Math.max(0, i - 2)];
          const next = marks[Math.min(marks.length - 1, i + 2)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const pressure = mark.pressure ?? mark.model?.pressure ?? 0;
          const fan = mark.fan ?? mark.model?.fan ?? 0;
          const root = mark.model?.rootLoad ?? 0;
          const pointed = mark.pointed ?? mark.model?.pointed ?? 0;
          const slip = mark.model?.slip ?? 0;
          const liftPath = smoothstep(releaseStart, releaseEnd, t);
          const liftState = smoothstep(0.42, 0.98, pointed) * smoothstep(0.34, 0.92, slip);
          const lift = clamp(liftPath * 0.78 + liftState * 0.38, 0, 1);
          const entry = smoothstep(start, Math.min(0.2, start + 0.18), t);
          const belly = clamp(smoothstep(0.16, 0.64, pressure) * 0.58 + fan * 0.48 + root * 0.18, 0, 1.35);
          const foot = smoothstep(footStart, footPeak, t) * (1 - smoothstep(0.86, 1, t));
          const rootDrag = clamp(root * 0.48 + foot * 0.82, 0, 1.1);
          const base = Math.max(mark.half, lerp(options.naiLayeredMinHalf ?? 5.8, options.naiLayeredTailMinHalf ?? 1.2, lift)) * scale;
          const upperHalf = base * entry * (0.08 + belly * 0.26 + foot * 0.04) * (1 - lift * 0.82);
          const tailGather = smoothstep(options.naiLayeredGatherStart ?? 0.68, options.naiLayeredGatherEnd ?? 0.96, t);
          const footLowerGain = options.naiLayeredFootLower ?? 0.9;
          const lowerHalf = base * entry * (0.1 + belly * 0.68 + foot * footLowerGain + root * 0.22) * (1 - lift * 0.78) * (1 - tailGather * 0.82);
          const bellyForward = base * (0.04 + belly * 0.05 - lift * 0.07);
          const bellyBack = base * (options.naiLayeredBackDrag ?? 0.24) * rootDrag * (1 - lift * 0.48) * (1 - tailGather * 0.72);
          const centerX = mark.x + tangent.x * bellyForward + perpX * base * (options.naiLayeredLowerBias ?? 0.04) * belly;
          const centerY = mark.y + tangent.y * bellyForward + perpY * base * (options.naiLayeredLowerBias ?? 0.04) * belly;
          upper.push({
            x: centerX - perpX * upperHalf + tangent.x * base * 0.02 * foot,
            y: centerY - perpY * upperHalf + tangent.y * base * 0.02 * foot,
          });
          lower.push({
            x: centerX - tangent.x * bellyBack + perpX * lowerHalf,
            y: centerY - tangent.y * bellyBack + perpY * lowerHalf,
          });
          spine.push({ x: centerX, y: centerY, half: base, t, tangent });
        }
        if (upper.length < 3 || lower.length < 3) return;

        const curveThrough = (points) => {
          if (!points.length) return;
          ctx.lineTo(points[0].x, points[0].y);
          for (let i = 1; i < points.length - 1; i += 1) {
            const current = points[i];
            const next = points[i + 1];
            ctx.quadraticCurveTo(current.x, current.y, (current.x + next.x) * 0.5, (current.y + next.y) * 0.5);
          }
          const lastPoint = points[points.length - 1];
          ctx.quadraticCurveTo(lastPoint.x, lastPoint.y, lastPoint.x, lastPoint.y);
        };

        const first = markAt(start);
        const second = markAt(Math.min(end, start + 0.04));
        const entryTangent = normalize(second.x - first.x, second.y - first.y, first.dirX, first.dirY);
        const entryBase = Math.max(first.half, options.naiLayeredMinHalf ?? 5.8) * scale;
        const startTip = {
          x: first.x - entryTangent.x * entryBase * (options.naiLayeredStartReach ?? 0.08),
          y: first.y - entryTangent.y * entryBase * (options.naiLayeredStartReach ?? 0.08),
        };
        const last = markAt(end);
        const beforeLast = markAt(Math.max(start, end - 0.05));
        const rawTail = normalize(last.x - beforeLast.x, last.y - beforeLast.y, last.dirX, last.dirY);
        const preferredTail = normalize(options.naiTailDirX ?? 1, options.naiTailDirY ?? -0.1, rawTail.x, rawTail.y);
        const tailMix = clamp(options.naiTailDirMix ?? 0.75, 0, 1);
        const tailDir = normalize(
          lerp(rawTail.x, preferredTail.x, tailMix),
          lerp(rawTail.y, preferredTail.y, tailMix),
          rawTail.x,
          rawTail.y,
        );
        const tailBase = Math.max(last.half, options.naiLayeredTailMinHalf ?? 1.2) * scale;
        const tailTip = {
          x: last.x + tailDir.x * tailBase * (options.naiLayeredTailReach ?? 0.82),
          y: last.y + tailDir.y * tailBase * (options.naiLayeredTailReach ?? 0.82),
        };

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * layerAlpha;
        ctx.beginPath();
        ctx.moveTo(startTip.x, startTip.y);
        curveThrough(upper);
        ctx.lineTo(tailTip.x, tailTip.y);
        curveThrough(lower.slice().reverse());
        ctx.closePath();
        ctx.fill();

        const midBridgeAlpha = options.naiMidBridgeAlpha ?? 0;
        if (midBridgeAlpha > 0) {
          const bridgeStart = options.naiMidBridgeStart ?? 0.36;
          const bridgeEnd = options.naiMidBridgeEnd ?? 0.86;
          const bridgeWidth = options.naiMidBridgeWidth ?? 0.34;
          const bridgeUpper = options.naiMidBridgeUpper ?? 0.24;
          const bridgeLower = options.naiMidBridgeLower ?? 0.62;
          const bridgeMinHalf = options.naiMidBridgeMinHalf ?? 0;
          const bridgeForward = options.naiMidBridgeForward ?? 0.08;
          const bridgeBack = options.naiMidBridgeBack ?? 0.12;
          const bridgePasses = Math.max(1, Math.round(options.naiMidBridgePasses ?? 1));
          const bridgeSpine = spine.filter((point) => point.t >= bridgeStart && point.t <= bridgeEnd);
          if (bridgeSpine.length > 3) {
            const bridgeUpperEdge = [];
            const bridgeLowerEdge = [];
            for (const point of bridgeSpine) {
              const local = clamp((point.t - bridgeStart) / Math.max(0.001, bridgeEnd - bridgeStart), 0, 1);
              const profile = Math.sin(Math.PI * local);
              const release = smoothstep(0.72, 1, point.t);
              const tangent = point.tangent;
              const perpX = -tangent.y;
              const perpY = tangent.x;
              const width = Math.max(bridgeMinHalf, point.half * bridgeWidth * (0.35 + profile * 0.9)) * (1 - release * 0.42);
              const forward = point.half * bridgeForward * profile * (1 - release * 0.5);
              const back = point.half * bridgeBack * smoothstep(0.48, 0.82, point.t) * (1 - release * 0.36);
              bridgeUpperEdge.push({
                x: point.x + tangent.x * forward - perpX * width * bridgeUpper,
                y: point.y + tangent.y * forward - perpY * width * bridgeUpper,
              });
              bridgeLowerEdge.push({
                x: point.x - tangent.x * back + perpX * width * bridgeLower,
                y: point.y - tangent.y * back + perpY * width * bridgeLower,
              });
            }
            ctx.globalAlpha = clamp(alpha * midBridgeAlpha, 0, 1);
            for (let pass = 0; pass < bridgePasses; pass += 1) {
              ctx.beginPath();
              ctx.moveTo(bridgeUpperEdge[0].x, bridgeUpperEdge[0].y);
              curveThrough(bridgeUpperEdge);
              curveThrough(bridgeLowerEdge.slice().reverse());
              ctx.closePath();
              ctx.fill();
            }
          }
        }

        const tipAlpha = options.naiLayeredTipAlpha ?? 0;
        if (tipAlpha > 0) {
          const release = markAt(options.naiLayeredTipStart ?? 0.78);
          const endMark = markAt(end);
          const spread = Math.max(release.half, tailBase) * (options.naiLayeredTipScale ?? 0.28);
          const perpX = -tailDir.y;
          const perpY = tailDir.x;
          const tip = new Path2D();
          tip.moveTo(release.x - perpX * spread * 0.42, release.y - perpY * spread * 0.42);
          tip.bezierCurveTo(
            endMark.x - perpX * spread * 0.2,
            endMark.y - perpY * spread * 0.2,
            tailTip.x - tailDir.x * spread * 0.22,
            tailTip.y - tailDir.y * spread * 0.22,
            tailTip.x,
            tailTip.y,
          );
          tip.bezierCurveTo(
            tailTip.x - tailDir.x * spread * 0.18 + perpX * spread * 0.08,
            tailTip.y - tailDir.y * spread * 0.18 + perpY * spread * 0.08,
            endMark.x + perpX * spread * 0.22,
            endMark.y + perpY * spread * 0.22,
            release.x + perpX * spread * 0.34,
            release.y + perpY * spread * 0.34,
          );
          tip.closePath();
          ctx.globalAlpha = alpha * tipAlpha;
          ctx.fill(tip);
        }
        ctx.restore();
      }

      function collectDemoMarks(samples) {
        resetModelState();
        brush.drawing = true;
        brush.pointerId = "demo";
        const marks = [];
        for (const sample of samples) {
          const target = targetShape(sample, brush.last);
          settleBrush(target);
          const center = contactCenter(sample.x, sample.y, brush);
          const pressure = clamp(brush.pressure || 0, 0, 1);
          const pointed = clamp(brush.pointed || 0, 0, 1);
          const fan = clamp(brush.fan || 0, 0, 1);
          const half = Math.max(0.4, bridgeInkWidth(brush) * 0.5 * lerp(1, 1.18, fan));
          marks.push({
            x: center.x,
            y: center.y,
            half,
            dirX: brush.dirX,
            dirY: brush.dirY,
            model: {
              dirX: brush.dirX,
              dirY: brush.dirY,
              width: brush.width,
              length: brush.length,
              wedge: brush.wedge,
              pointed: brush.pointed,
              belly: brush.belly,
              fan: brush.fan,
              rootLoad: brush.rootLoad,
              slip: brush.slip,
              heelOffset: brush.heelOffset,
              bendX: brush.bendX,
              bendY: brush.bendY,
              bendAmount: brush.bendAmount,
              pressure: brush.pressure,
              speed: brush.speed,
              capBias: brush.capBias,
              cornerBias: brush.cornerBias,
            },
            pressure,
            pointed,
            fan,
            alpha: clamp(settings.density * (2.4 + pressure * 3.1), 0.28, 1) * lerp(1, 0.72, pointed),
          });
          brush.last = sample;
          brush.sampleCount += 1;
        }
        brush.drawing = false;
        brush.pointerId = null;
        brush.last = null;
        brush.inkPoint = null;
        return marks;
      }

      function drawDemoSweepNaiStroke(samples) {
        const marks = collectDemoMarks(samples);
        if (marks.length < 4) return;
        const avgAlpha = marks.reduce((sum, mark) => sum + mark.alpha, 0) / Math.max(1, marks.length);
        const opt = samples.sweepNai || {};
        ink.save();
        ink.fillStyle = "#111411";
        ink.globalCompositeOperation = "source-over";
        if (opt.useNaiSweptBody) {
          drawNaiSweptBody(ink, marks, avgAlpha * (opt.wetAlpha ?? 0.72), opt);
          drawNaiPlanarPressFace(ink, marks, avgAlpha, opt);
          drawDropletFootprintFace(ink, marks, avgAlpha, opt);
          drawNaiPressBelly(ink, marks, avgAlpha, opt);
          drawNaiLowerPad(ink, marks, avgAlpha, opt);
        } else {
          drawSweepWetSurface(ink, marks, avgAlpha * (opt.wetAlpha ?? 0.72), opt);
        }
        drawEnvelopePath(ink, marks, 0.52, avgAlpha * (opt.coreAlpha ?? 0.18), {
          taper: true,
          start: 0.2,
          end: 0.8,
          sideBias: 0.08,
          terminalPad: opt.coreTerminalPad ?? true,
        });
        drawEnvelopeSegments(ink, marks, 0.34, opt.naiSegmentAlpha ?? 0.1, {
          taper: true,
          start: 0.44,
          end: 0.68,
          sideBias: 0.04,
          terminalPad: opt.segmentTerminalPad ?? true,
        });
        drawNaiUnifiedHull(ink, marks, avgAlpha, opt);
        drawNaiLayeredContact(ink, marks, avgAlpha, opt);
        const entryPadAlpha = opt.naiEntryPadAlpha ?? 0;
        if (entryPadAlpha > 0 && marks.length > 8) {
          const entryIndex = Math.min(marks.length - 2, Math.max(0, Math.floor(marks.length * (opt.naiEntryPadStart ?? 0.04))));
          const pressIndex = Math.min(marks.length - 1, Math.max(entryIndex + 1, Math.floor(marks.length * (opt.naiEntryPadPress ?? 0.18))));
          const entry = marks[entryIndex];
          const press = marks[pressIndex];
          const tangent = normalize(press.x - entry.x, press.y - entry.y, entry.dirX, entry.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const spread = Math.max(entry.half, press.half, opt.naiEntryPadMinHalf ?? 6) * (opt.naiEntryPadScale ?? 1);
          const upper = opt.naiEntryPadUpper ?? 0.42;
          const lower = opt.naiEntryPadLower ?? 0.82;
          const tip = {
            x: entry.x - tangent.x * spread * (opt.naiEntryPadReach ?? 0.68) - perpX * spread * 0.06,
            y: entry.y - tangent.y * spread * (opt.naiEntryPadReach ?? 0.68) - perpY * spread * 0.06,
          };
          const entryUpper = {
            x: entry.x + tangent.x * spread * 0.12 - perpX * spread * upper,
            y: entry.y + tangent.y * spread * 0.12 - perpY * spread * upper,
          };
          const pressUpper = {
            x: press.x + tangent.x * spread * 0.16 - perpX * spread * upper * 0.72,
            y: press.y + tangent.y * spread * 0.16 - perpY * spread * upper * 0.72,
          };
          const pressLower = {
            x: press.x + tangent.x * spread * 0.08 + perpX * spread * lower,
            y: press.y + tangent.y * spread * 0.08 + perpY * spread * lower,
          };
          const entryLower = {
            x: entry.x - tangent.x * spread * 0.06 + perpX * spread * lower * 0.58,
            y: entry.y - tangent.y * spread * 0.06 + perpY * spread * lower * 0.58,
          };
          const entryPad = new Path2D();
          entryPad.moveTo(tip.x, tip.y);
          entryPad.bezierCurveTo(
            entry.x - tangent.x * spread * 0.2 - perpX * spread * upper * 0.4,
            entry.y - tangent.y * spread * 0.2 - perpY * spread * upper * 0.4,
            entryUpper.x,
            entryUpper.y,
            entryUpper.x,
            entryUpper.y,
          );
          entryPad.bezierCurveTo(
            press.x - perpX * spread * upper,
            press.y - perpY * spread * upper,
            pressUpper.x,
            pressUpper.y,
            pressUpper.x,
            pressUpper.y,
          );
          entryPad.bezierCurveTo(
            press.x + tangent.x * spread * 0.22 + perpX * spread * lower * 0.52,
            press.y + tangent.y * spread * 0.22 + perpY * spread * lower * 0.52,
            pressLower.x,
            pressLower.y,
            pressLower.x,
            pressLower.y,
          );
          entryPad.bezierCurveTo(
            entry.x + perpX * spread * lower * 0.7,
            entry.y + perpY * spread * lower * 0.7,
            entryLower.x,
            entryLower.y,
            tip.x,
            tip.y,
          );
          entryPad.closePath();
          ink.globalAlpha = avgAlpha * entryPadAlpha;
          ink.fill(entryPad);
        }
        const footStart = marks[Math.floor(marks.length * (opt.footStart ?? 0.68))];
        const footPeak = marks[Math.floor(marks.length * (opt.footPeak ?? 0.86))];
        const end = marks[marks.length - 1];
        if (footStart && footPeak && end) {
          const tangent = normalize(end.x - footStart.x, end.y - footStart.y, 1, 0.28);
          const preferredTail = normalize(opt.tailDirX ?? 1, opt.tailDirY ?? -0.08, tangent.x, tangent.y);
          const tailMix = clamp(opt.tailDirMix ?? 0, 0, 1);
          const tailTangent = normalize(
            lerp(tangent.x, preferredTail.x, tailMix),
            lerp(tangent.y, preferredTail.y, tailMix),
            tangent.x,
            tangent.y,
          );
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const spread = Math.max(footPeak.half, end.half) * (opt.footScale ?? 1.18);
          const footLower = opt.footLower ?? 1;
          const footUpper = opt.footUpper ?? 1;
          const tailNarrow = opt.tailNarrow ?? 0.72;
          const footTipReach = opt.footTipReach ?? 0.48;
          const footUpperReach = opt.footUpperReach ?? 0.26;
          const footLowerReach = opt.footLowerReach ?? 0.48;
          const foot = new Path2D();
          foot.moveTo(footStart.x - perpX * spread * 0.24 * footUpper, footStart.y - perpY * spread * 0.24 * footUpper);
          foot.bezierCurveTo(
            footPeak.x - perpX * spread * 0.62 * footUpper,
            footPeak.y - perpY * spread * 0.62 * footUpper,
            end.x - perpX * spread * 0.38 * footUpper + tangent.x * spread * footUpperReach,
            end.y - perpY * spread * 0.38 * footUpper + tangent.y * spread * footUpperReach,
            end.x + tangent.x * spread * footTipReach,
            end.y + tangent.y * spread * footTipReach,
          );
          foot.bezierCurveTo(
            end.x + perpX * spread * footLowerReach * footLower,
            end.y + perpY * spread * footLowerReach * footLower,
            footPeak.x + perpX * spread * 0.78 * footLower,
            footPeak.y + perpY * spread * 0.78 * footLower,
            footStart.x + perpX * spread * 0.32 * footLower,
            footStart.y + perpY * spread * 0.32 * footLower,
          );
          foot.quadraticCurveTo(
            footStart.x - tangent.x * spread * 0.18,
            footStart.y - tangent.y * spread * 0.18,
            footStart.x - perpX * spread * 0.24 * footUpper,
            footStart.y - perpY * spread * 0.24 * footUpper,
          );
          foot.closePath();
          ink.globalAlpha = avgAlpha * (opt.footAlpha ?? 0.18);
          ink.fill(foot);
          const chisel = new Path2D();
          chisel.moveTo(
            end.x + tangent.x * spread * 0.12 - perpX * spread * 0.22 * footUpper,
            end.y + tangent.y * spread * 0.12 - perpY * spread * 0.22 * footUpper,
          );
          chisel.lineTo(
            end.x + tangent.x * spread * 0.68 - perpX * spread * 0.03 * footUpper,
            end.y + tangent.y * spread * 0.68 - perpY * spread * 0.03 * footUpper,
          );
          chisel.lineTo(
            end.x + tangent.x * spread * 0.38 + perpX * spread * 0.26 * footLower,
            end.y + tangent.y * spread * 0.38 + perpY * spread * 0.26 * footLower,
          );
          chisel.lineTo(
            end.x - tangent.x * spread * 0.04 + perpX * spread * 0.28 * footLower,
            end.y - tangent.y * spread * 0.04 + perpY * spread * 0.28 * footLower,
          );
          chisel.closePath();
          ink.globalAlpha = avgAlpha * (opt.chiselAlpha ?? 0);
          ink.fill(chisel);
          const liftTail = new Path2D();
          const tailReach = opt.tailReach ?? 1.28;
          const tailSide = opt.tailSide ?? 0.18;
          const tailTip = {
            x: end.x + tailTangent.x * spread * tailReach - perpX * spread * tailSide,
            y: end.y + tailTangent.y * spread * tailReach - perpY * spread * tailSide,
          };
          liftTail.moveTo(footPeak.x - perpX * spread * 0.22, footPeak.y - perpY * spread * 0.22);
          liftTail.bezierCurveTo(
            end.x - perpX * spread * 0.18,
            end.y - perpY * spread * 0.18,
            end.x + tailTangent.x * spread * 0.58 - perpX * spread * 0.16,
            end.y + tailTangent.y * spread * 0.58 - perpY * spread * 0.16,
            tailTip.x,
            tailTip.y,
          );
          liftTail.bezierCurveTo(
            end.x + tailTangent.x * spread * 0.3 + perpX * spread * 0.04 * tailNarrow,
            end.y + tailTangent.y * spread * 0.3 + perpY * spread * 0.04 * tailNarrow,
            footPeak.x + perpX * spread * 0.28 * tailNarrow,
            footPeak.y + perpY * spread * 0.28 * tailNarrow,
            footPeak.x - perpX * spread * 0.22,
            footPeak.y - perpY * spread * 0.22,
          );
          liftTail.closePath();
          ink.globalAlpha = avgAlpha * (opt.tailAlpha ?? 0.1);
          ink.fill(liftTail);
          drawDemoBristleCluster(ink, marks, {
            startT: opt.bristleStart ?? 0.58,
            endT: opt.bristleEnd ?? 0.98,
            count: opt.bristleCount ?? 6,
            side: 1,
            alpha: avgAlpha * (opt.bristleAlpha ?? 0),
            lowerBias: opt.bristleLowerBias ?? 0.56,
            widthScale: opt.bristleWidth ?? 0.11,
          });
          drawDemoEdgeFibers(ink, [footStart, footPeak, end], {
            count: opt.edgeFiberCount ?? 14,
            length: spread * (opt.edgeFiberLength ?? 0.3),
            spread: spread * (opt.edgeFiberSpread ?? 0.34),
            alpha: avgAlpha * (opt.edgeFiberAlpha ?? 0.14),
            side: 1,
            width: opt.edgeFiberWidth ?? 0.9,
            profile: (t) => lerp(0.28, 1.25, smoothstep(0.2, 0.82, t)),
          });
        }
        if (end) {
          if ((opt.sweepTerminalPadAlpha ?? 0) > 0) drawSweepTerminalPad(ink, marks, avgAlpha * opt.sweepTerminalPadAlpha);
          const capModel = {
            ...end.model,
            width: end.model.width * (opt.endCapWidth ?? 0.42),
            length: end.model.length * (opt.endCapLength ?? 0.34),
            pointed: Math.min(end.model.pointed, opt.endCapPointed ?? 0.36),
            fan: opt.endCapFan ?? 0.04,
            capBias: opt.endCapBias ?? 0.62,
          };
          ink.globalAlpha = avgAlpha * (opt.endCapAlpha ?? 0.18);
          ink.fill(contactPath(end.x, end.y, coreModel(capModel), opt.endCapScale ?? 0.38));
        }
        ink.restore();
      }

      function drawDemoShuGouBristleStroke(samples) {

          const tangent = normalize(end.x - bottom.x, end.y - bottom.y, -1, 0.3);

          const spread = Math.max(bottom.half, hookPeak.half) * 0.54;
          const hookFace = new Path2D();
          hookFace.moveTo(bottom.x - perpX * spread * 0.34, bottom.y - perpY * spread * 0.34);
          hookFace.bezierCurveTo(
            hookPeak.x - perpX * spread * 0.46,
            hookPeak.y - perpY * spread * 0.46,
            end.x - perpX * spread * 0.18 + tangent.x * spread * 0.1,
            end.y - perpY * spread * 0.18 + tangent.y * spread * 0.1,
            end.x + tangent.x * spread * 0.26,
            end.y + tangent.y * spread * 0.26,
          );
          hookFace.bezierCurveTo(
            end.x + perpX * spread * 0.18,
            end.y + perpY * spread * 0.18,
            hookPeak.x + perpX * spread * 0.52,
            hookPeak.y + perpY * spread * 0.52,
            bottom.x + perpX * spread * 0.28,
            bottom.y + perpY * spread * 0.28,
          );
          hookFace.quadraticCurveTo(
            bottom.x - tangent.x * spread * 0.18,
            bottom.y - tangent.y * spread * 0.18,
            bottom.x - perpX * spread * 0.34,

      function drawDemoSweepPieStroke(samples) {
        const marks = collectDemoMarks(samples);
        if (marks.length < 4) return;
        const avgAlpha = marks.reduce((sum, mark) => sum + mark.alpha, 0) / Math.max(1, marks.length);
        const opt = samples.sweepPie || {};
        ink.save();
        ink.fillStyle = "#111411";
        ink.globalCompositeOperation = "source-over";
        drawPiePressBelly(ink, marks, avgAlpha, opt);
        drawDropletFootprintFace(ink, marks, avgAlpha, opt);
        drawPieAfterTurnBody(ink, marks, avgAlpha, opt);
        drawPieTurnCompression(ink, marks, avgAlpha, opt);
        drawPieFoldPressFace(ink, marks, avgAlpha, opt);
        const mainStartIndex = Math.min(
          marks.length - 2,
          Math.max(0, Math.floor(marks.length * (opt.pieEnvelopeStartT ?? 0))),
        );
        const envelopeMarks = marks.slice(mainStartIndex);
        const lower = [];
        const upper = [];
        const startCut = 0.04;
        const endCut = 0.98;
        for (let i = 0; i < envelopeMarks.length; i += 1) {
          const mark = envelopeMarks[i];
          const t = envelopeMarks.length === 1 ? 1 : i / (envelopeMarks.length - 1);
          if (t < startCut || t > endCut) continue;
          const prev = envelopeMarks[Math.max(0, i - 1)];
          const next = envelopeMarks[Math.min(envelopeMarks.length - 1, i + 1)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const peak = opt.bellyPeak ?? 0.42;
          const rise = smoothstep(0.04, peak, t);
          const fall = 1 - smoothstep(peak, 1, t);
          const belly = Math.max(0, Math.min(rise, fall)) * (opt.bellyScale ?? 1);
          const tail = smoothstep(opt.tailStart ?? 0.68, 1, t);
          const leadLift = smoothstep(0.0, opt.leadLiftEnd ?? 0.16, t);
          const base = mark.half * (opt.widthScale ?? 1.28) * lerp(0.52, 1.18, belly) * lerp(1, opt.tailLift ?? 0.18, tail);
          const lowerHalf = base * lerp(0.7, 1.34, belly) * leadLift;
          const upperHalf = base * lerp(0.56, 0.86, belly) * lerp(1, 0.5, tail) * leadLift;
          lower.push({ x: mark.x + perpX * lowerHalf, y: mark.y + perpY * lowerHalf });
          upper.push({ x: mark.x - perpX * upperHalf, y: mark.y - perpY * upperHalf });
        }
        if (lower.length > 3 && upper.length > 3) {
          ink.globalAlpha = avgAlpha * (opt.surfaceAlpha ?? 0.32);
          ink.beginPath();
          ink.moveTo(upper[0].x, upper[0].y);
          for (let i = 1; i < upper.length; i += 1) {
            const prev = upper[i - 1];
            const cur = upper[i];
            ink.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
          }
          ink.lineTo(upper[upper.length - 1].x, upper[upper.length - 1].y);
          for (let i = lower.length - 1; i > 0; i -= 1) {
            const prev = lower[i];
            const cur = lower[i - 1];
            ink.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
          }
          ink.lineTo(lower[0].x, lower[0].y);
          ink.closePath();
          ink.fill();
        }
        drawEnvelopePath(ink, envelopeMarks, opt.widthScale ?? 1.28, avgAlpha * (opt.wetAlpha ?? 0.82), {
          taper: true,
          start: opt.start ?? 0.56,
          end: opt.end ?? 0.16,
          sideBias: opt.sideBias ?? -0.08,
        });
        drawEnvelopePath(ink, envelopeMarks, opt.coreScale ?? 0.7, avgAlpha * (opt.coreAlpha ?? 0.22), {
          taper: true,

        drawEnvelopeSegments(ink, envelopeMarks, 0.34, opt.textureAlpha ?? 0.12, {
          taper: true,
          start: 0.72,
          end: 0.2,
          sideBias: (opt.sideBias ?? -0.08) * 0.3,
        });
        drawPieEntryRunFace(ink, marks, avgAlpha, opt);
        if ((opt.pieEntryFaceAlpha ?? 0) > 0) {
          const baseIndex = Math.min(marks.length - 2, Math.max(0, Math.floor(marks.length * (opt.pieEntryFaceT ?? 0.09))));
          const base = marks[baseIndex];
          const next = marks[Math.min(marks.length - 1, baseIndex + 8)];
          const tangent = normalize(
            opt.pieEntryAxisX ?? (next.x - base.x),
            opt.pieEntryAxisY ?? (next.y - base.y),
            base.dirX,
            base.dirY,
          );
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const spread = Math.max(base.half, opt.pieEntryFaceMinHalf ?? 0) * (opt.pieEntryFaceScale ?? 1.08);
          const tip = {
            x: base.x - tangent.x * spread * (opt.pieEntryFaceReach ?? 0.68) + perpX * spread * (opt.pieEntryFaceSide ?? 0.08),
            y: base.y - tangent.y * spread * (opt.pieEntryFaceReach ?? 0.68) + perpY * spread * (opt.pieEntryFaceSide ?? 0.08),
          };
          const upper = {
            x: base.x + tangent.x * spread * 0.08 - perpX * spread * (opt.pieEntryFaceUpper ?? 0.58),
            y: base.y + tangent.y * spread * 0.08 - perpY * spread * (opt.pieEntryFaceUpper ?? 0.58),
          };
          const shoulder = {
            x: next.x + tangent.x * spread * 0.24 - perpX * spread * 0.38,
            y: next.y + tangent.y * spread * 0.24 - perpY * spread * 0.38,
          };
          const belly = {
            x: next.x + tangent.x * spread * 0.12 + perpX * spread * (opt.pieEntryFaceLower ?? 0.86),
            y: next.y + tangent.y * spread * 0.12 + perpY * spread * (opt.pieEntryFaceLower ?? 0.86),
          };
          const heel = {
            x: base.x - tangent.x * spread * 0.18 + perpX * spread * 0.48,
            y: base.y - tangent.y * spread * 0.18 + perpY * spread * 0.48,
          };
          const entryFace = new Path2D();
          entryFace.moveTo(tip.x, tip.y);
          entryFace.bezierCurveTo(
            base.x - tangent.x * spread * 0.22 - perpX * spread * 0.14,
            base.y - tangent.y * spread * 0.22 - perpY * spread * 0.14,
            upper.x,
            upper.y,
            upper.x,
            upper.y,
          );
          entryFace.bezierCurveTo(
            base.x + tangent.x * spread * 0.34 - perpX * spread * 0.48,
            base.y + tangent.y * spread * 0.34 - perpY * spread * 0.48,
            shoulder.x,
            shoulder.y,
            shoulder.x,
            shoulder.y,
          );
          entryFace.bezierCurveTo(
            next.x + perpX * spread * 0.52,
            next.y + perpY * spread * 0.52,
            belly.x,
            belly.y,
            belly.x,
            belly.y,
          );
          entryFace.bezierCurveTo(
            base.x + perpX * spread * 0.62,
            base.y + perpY * spread * 0.62,
            heel.x,
            heel.y,
            tip.x,
            tip.y,
          );
          entryFace.closePath();
          ink.globalAlpha = avgAlpha * opt.pieEntryFaceAlpha;
          ink.fill(entryFace);
        }
        if ((opt.pieEntryStampAlpha ?? 0) > 0) {
          const baseIndex = Math.min(marks.length - 2, Math.max(0, Math.floor(marks.length * (opt.pieEntryStampT ?? 0.1))));
          const base = marks[baseIndex];
          const tangent = normalize(opt.pieEntryAxisX ?? base.dirX, opt.pieEntryAxisY ?? base.dirY, base.dirX, base.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const spread = (opt.pieEntryStampHalf ?? opt.pieEntryFaceMinHalf ?? base.half) * (opt.pieEntryStampScale ?? 1);
          const stamp = new Path2D();
          stamp.moveTo(
            base.x - tangent.x * spread * 0.92 + perpX * spread * 0.12,
            base.y - tangent.y * spread * 0.92 + perpY * spread * 0.12,
          );
          stamp.bezierCurveTo(
            base.x - tangent.x * spread * 0.34 - perpX * spread * 0.36,
            base.y - tangent.y * spread * 0.34 - perpY * spread * 0.36,
            base.x + tangent.x * spread * 0.34 - perpX * spread * 0.72,
            base.y + tangent.y * spread * 0.34 - perpY * spread * 0.72,
            base.x + tangent.x * spread * 0.86 - perpX * spread * 0.34,
            base.y + tangent.y * spread * 0.86 - perpY * spread * 0.34,
          );
          stamp.bezierCurveTo(
            base.x + tangent.x * spread * 0.62 + perpX * spread * 0.64,
            base.y + tangent.y * spread * 0.62 + perpY * spread * 0.64,
            base.x - tangent.x * spread * 0.18 + perpX * spread * 0.62,
            base.y - tangent.y * spread * 0.18 + perpY * spread * 0.62,
            base.x - tangent.x * spread * 0.92 + perpX * spread * 0.12,
            base.y - tangent.y * spread * 0.92 + perpY * spread * 0.12,
          );
          stamp.closePath();
          ink.globalAlpha = opt.pieEntryStampAlpha;
          ink.fill(stamp);
        }
        if ((opt.pieStartTuckAlpha ?? 0) > 0) {
          const first = marks[0];
          const next = marks[Math.min(marks.length - 1, 7)];
          const tangent = normalize(next.x - first.x, next.y - first.y, first.dirX, first.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const spread = first.half * (opt.pieStartTuckScale ?? 1.1);
          const reverse = opt.pieStartTuckReach ?? 0.52;
          const side = opt.pieStartTuckSide ?? -0.12;
          const tip = {
            x: first.x - tangent.x * spread * reverse + perpX * spread * side,
            y: first.y - tangent.y * spread * reverse + perpY * spread * side,
          };
          const upperCorner = {
            x: first.x + tangent.x * spread * 0.54 - perpX * spread * 0.5,
            y: first.y + tangent.y * spread * 0.54 - perpY * spread * 0.5,
          };
          const lowerCorner = {
            x: first.x + tangent.x * spread * 0.62 + perpX * spread * 0.42,
            y: first.y + tangent.y * spread * 0.62 + perpY * spread * 0.42,
          };
          const tuck = new Path2D();
          tuck.moveTo(tip.x, tip.y);
          tuck.lineTo(upperCorner.x, upperCorner.y);
          tuck.bezierCurveTo(
            first.x + tangent.x * spread * 0.74 - perpX * spread * 0.18,
            first.y + tangent.y * spread * 0.74 - perpY * spread * 0.18,
            first.x + tangent.x * spread * 0.76 + perpX * spread * 0.18,
            first.y + tangent.y * spread * 0.76 + perpY * spread * 0.18,
            lowerCorner.x,
            lowerCorner.y,
          );
          tuck.lineTo(tip.x, tip.y);
          tuck.closePath();
          ink.globalAlpha = avgAlpha * opt.pieStartTuckAlpha;
          ink.fill(tuck);
        }
        drawPieUnifiedHull(ink, marks, avgAlpha, opt);
        drawDemoBristleCluster(ink, envelopeMarks, {
          startT: opt.pieBristleStart ?? 0.08,
          endT: opt.pieBristleEnd ?? 0.92,
          count: opt.pieBristleCount ?? 5,
          side: opt.pieBristleSide ?? -1,
          alpha: avgAlpha * (opt.pieBristleAlpha ?? 0),
          lowerBias: opt.pieBristleBias ?? 0.42,
          widthScale: opt.pieBristleWidth ?? 0.045,
        });
        const start = marks[Math.min(2, marks.length - 1)];
        if (start) {
          const startModel = {
            ...start.model,
            width: start.model.width * (opt.startPadWidth ?? 1.12),
            length: start.model.length * 0.62,
            pointed: Math.min(start.model.pointed, 0.18),
            fan: Math.max(start.model.fan, 0.18),
            belly: Math.max(start.model.belly, 0.2),
            capBias: 0.28,
          };
          ink.globalAlpha = avgAlpha * (opt.startPadAlpha ?? 0.18);
          ink.fill(contactPath(start.x, start.y, mantleModel(startModel), 0.72));
          ink.globalAlpha = avgAlpha * (opt.startPadAlpha ?? 0.18) * 0.72;
          ink.fill(contactPath(start.x, start.y, coreModel(startModel), 0.52));
        }
        const end = marks[marks.length - 1];
        if (end) {
          const capModel = {
            ...end.model,
            width: end.model.width * 0.34,
            length: end.model.length * 0.22,
            pointed: 0.82,
            fan: 0,
            capBias: 0.72,
          };
          ink.globalAlpha = avgAlpha * (opt.pieTailCapAlpha ?? 0.08);
          ink.fill(contactPath(end.x, end.y, coreModel(capModel), 0.28));
        }
        ink.restore();
      }

      function drawEnvelopeSegments(ctx, marks, halfScale, alphaScale, options = {}) {
        if (marks.length < 2 || alphaScale <= 0) return;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        for (let i = 1; i < marks.length; i += 1) {
          const from = marks[i - 1];
          const to = marks[i];
          const t0 = (i - 1) / (marks.length - 1);
          const t1 = i / (marks.length - 1);
          const tangent = normalize(to.x - from.x, to.y - from.y, to.dirX, to.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const load = lerp(from.pressure, to.pressure, 0.5);
          const midT = (t0 + t1) * 0.5;
          const spread = lerp(0.92, 1.12, load) * lerp(0.96, 1.08, smoothstep(0.32, 0.74, midT));
          const h0 = from.half * halfScale * spread * (options.taper ? envelopeTaper(t0, options) : 1);
          const h1 = to.half * halfScale * spread * (options.taper ? envelopeTaper(t1, options) : 1);
          const sideBias = clamp(options.sideBias || 0, -0.42, 0.42);
          const terminal = options.terminalPad ? smoothstep(0.78, 1, midT) : 0;
          const terminalSpread = lerp(1, 1.22, terminal);
          const h0Left = h0 * (1 + sideBias) * terminalSpread;
          const h1Left = h1 * (1 + sideBias) * terminalSpread;
          const h0Right = h0 * (1 - sideBias * 0.72) * lerp(1, 1.16, terminal);
          const h1Right = h1 * (1 - sideBias * 0.72) * lerp(1, 1.16, terminal);
          const density = lerp(from.alpha, to.alpha, 0.5) * alphaScale * lerp(0.68, 1.08, load);
          const tailLift = options.terminalPad ? lerp(1, 0.84, smoothstep(0.86, 1, midT)) : lerp(1, 0.58, smoothstep(0.84, 1, midT));
          ctx.globalAlpha = density * tailLift;
          ctx.beginPath();
          ctx.moveTo(from.x + perpX * h0Left, from.y + perpY * h0Left);
          ctx.quadraticCurveTo(
            (from.x + to.x) * 0.5 + perpX * (h0Left + h1Left) * 0.18,
            (from.y + to.y) * 0.5 + perpY * (h0Left + h1Left) * 0.18,
            to.x + perpX * h1Left,
            to.y + perpY * h1Left,
          );
          ctx.lineTo(to.x - perpX * h1Right, to.y - perpY * h1Right);
          ctx.quadraticCurveTo(
            (from.x + to.x) * 0.5 - perpX * (h0Right + h1Right) * 0.12,
            (from.y + to.y) * 0.5 - perpY * (h0Right + h1Right) * 0.12,
            from.x - perpX * h0Right,
            from.y - perpY * h0Right,
          );
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawSweepTerminalPad(ctx, marks, alpha) {
        if (marks.length < 4 || alpha <= 0) return;
        const end = marks[marks.length - 1];
        const near = marks[Math.max(0, marks.length - 5)];
        const tangent = normalize(end.x - near.x, end.y - near.y, end.dirX, end.dirY);
        const perpX = -tangent.y;
        const perpY = tangent.x;
        const load = clamp(end.pressure || 0, 0, 1);
        const half = Math.max(end.half * lerp(0.92, 1.28, load), end.model.width * 0.34);
        const lead = end.model.width * lerp(0.12, 0.28, load);
        const back = end.model.width * lerp(0.52, 0.82, load);
        const leftHalf = half * 1.08;
        const rightHalf = half * 0.82;
        const path = new Path2D();
        path.moveTo(end.x + tangent.x * lead + perpX * leftHalf, end.y + tangent.y * lead + perpY * leftHalf);
        path.quadraticCurveTo(
          end.x - tangent.x * back * 0.12 + perpX * leftHalf * 1.08,
          end.y - tangent.y * back * 0.12 + perpY * leftHalf * 1.08,
          end.x - tangent.x * back + perpX * leftHalf * 0.78,
          end.y - tangent.y * back + perpY * leftHalf * 0.78,
        );
        path.lineTo(end.x - tangent.x * back - perpX * rightHalf * 0.76, end.y - tangent.y * back - perpY * rightHalf * 0.76);
        path.quadraticCurveTo(
          end.x - tangent.x * back * 0.08 - perpX * rightHalf * 1.04,
          end.y - tangent.y * back * 0.08 - perpY * rightHalf * 1.04,
          end.x + tangent.x * lead - perpX * rightHalf,
          end.y + tangent.y * lead - perpY * rightHalf,
        );
        path.closePath();
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * 0.12;
        ctx.fill(path);
        ctx.globalAlpha = alpha * 0.18;
        ctx.fill(contactPath(end.x - tangent.x * back * 0.18, end.y - tangent.y * back * 0.18, {
          ...end.model,
          dirX: tangent.x,
          dirY: tangent.y,
          width: end.model.width * 0.58,
          length: end.model.length * 0.42,
          pointed: 0.08,
          fan: 0.18,
          belly: Math.max(0.18, end.model.belly * 0.6),
          capBias: 0.24,
        }, 0.74));
        ctx.restore();
      }

      function drawDemoEdgeFibers(ctx, points, options = {}) {
        if (!points || points.length < 2) return;
        const count = options.count ?? 8;
        const length = options.length ?? 6;
        const spread = options.spread ?? 2;
        const alpha = options.alpha ?? 0.08;
        const side = options.side ?? 1;
        ctx.save();
        ctx.strokeStyle = "#111411";
        ctx.lineCap = options.lineCap ?? "butt";
        ctx.lineWidth = options.width ?? 0.7;
        ctx.globalCompositeOperation = "source-over";
        for (let i = 0; i < count; i += 1) {
          const t = count === 1 ? 0.5 : (i + 0.5) / count;
          const scaled = t * (points.length - 1);
          const idx = Math.min(points.length - 2, Math.floor(scaled));
          const localT = scaled - idx;
          const a = points[idx];
          const b = points[idx + 1];
          const x = lerp(a.x, b.x, localT);
          const y = lerp(a.y, b.y, localT);
          const tangent = normalize(b.x - a.x, b.y - a.y, options.fallbackX ?? 1, options.fallbackY ?? 0);
          const perpX = -tangent.y * side;
          const perpY = tangent.x * side;
          const n = Math.sin((x + 13.7) * 9.123 + (y - 4.1) * 5.917 + i * 2.31) * 43758.5453;
          const noise = n - Math.floor(n);
          const profile = options.profile ? clamp(options.profile(t), 0, 1.6) : 1;
          if (profile <= 0.01) continue;
          const along = (noise - 0.5) * spread;
          const len = length * profile * (0.55 + noise * 0.75);
          const startX = x + tangent.x * along;
          const startY = y + tangent.y * along;
          ctx.globalAlpha = alpha * profile * (0.45 + noise * 0.8);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.quadraticCurveTo(
            startX + perpX * len * 0.48 + tangent.x * along * 0.16,
            startY + perpY * len * 0.48 + tangent.y * along * 0.16,
            startX + perpX * len,
            startY + perpY * len,
          );
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawDemoBristleCluster(ctx, marks, options = {}) {
        if (!marks || marks.length < 4) return;
        const startT = clamp(options.startT ?? 0.58, 0, 0.98);
        const endT = clamp(options.endT ?? 0.98, startT + 0.01, 1);
        const startIndex = Math.max(0, Math.floor((marks.length - 1) * startT));
        const endIndex = Math.min(marks.length - 1, Math.ceil((marks.length - 1) * endT));
        if (endIndex - startIndex < 2) return;
        const count = options.count ?? 6;
        const side = options.side ?? 1;
        const alpha = options.alpha ?? 0.08;
        const lowerBias = options.lowerBias ?? 0.52;
        const widthScale = options.widthScale ?? 0.12;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        for (let b = 0; b < count; b += 1) {
          const u = count === 1 ? 0.5 : b / (count - 1);
          const band = [];
          const other = [];
          const sideOffset = lerp(0.1, lowerBias, u);
          const wobbleSeed = (b + 1) * 11.73;
          for (let i = startIndex; i <= endIndex; i += 1) {
            const mark = marks[i];
            const t = (i - startIndex) / Math.max(1, endIndex - startIndex);
            const prev = marks[Math.max(0, i - 1)];
            const next = marks[Math.min(marks.length - 1, i + 1)];
            const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
            const perpX = -tangent.y * side;
            const perpY = tangent.x * side;
            const taper = smoothstep(0, 0.18, t) * (1 - smoothstep(0.86, 1, t));
            const noise = Math.sin((mark.x + wobbleSeed) * 0.071 + (mark.y - wobbleSeed) * 0.043) * 0.5 + 0.5;
            const offset = mark.half * (sideOffset + (noise - 0.5) * 0.08);
            const half = Math.max(0.5, mark.half * widthScale * lerp(0.65, 1.15, noise) * lerp(0.7, 1, taper));
            const cx = mark.x + perpX * offset + tangent.x * mark.half * (noise - 0.5) * 0.08;
            const cy = mark.y + perpY * offset + tangent.y * mark.half * (noise - 0.5) * 0.08;
            band.push({ x: cx + perpX * half, y: cy + perpY * half });
            other.push({ x: cx - perpX * half, y: cy - perpY * half });
          }
          if (band.length < 2) continue;
          ctx.globalAlpha = alpha * lerp(0.72, 1.15, u);
          ctx.beginPath();
          ctx.moveTo(band[0].x, band[0].y);
          for (let i = 1; i < band.length; i += 1) {
            const prev = band[i - 1];
            const cur = band[i];
            ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
          }
          ctx.lineTo(band[band.length - 1].x, band[band.length - 1].y);
          for (let i = other.length - 1; i > 0; i -= 1) {
            const prev = other[i];
            const cur = other[i - 1];
            ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
          }
          ctx.lineTo(other[0].x, other[0].y);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawDemoEnvelopeStroke(samples) {
        resetModelState();
        brush.drawing = true;
        brush.pointerId = "demo";
        const marks = [];
        for (const sample of samples) {
          const target = targetShape(sample, brush.last);
          settleBrush(target);
          const center = contactCenter(sample.x, sample.y, brush);
          const pressure = clamp(brush.pressure || 0, 0, 1);
          const pointed = clamp(brush.pointed || 0, 0, 1);
          const fan = clamp(brush.fan || 0, 0, 1);
          const half = Math.max(0.4, bridgeInkWidth(brush) * 0.5 * lerp(1, 1.18, fan));
          marks.push({
            x: center.x,
            y: center.y,
            half,
            dirX: brush.dirX,
            dirY: brush.dirY,
            model: {
              dirX: brush.dirX,
              dirY: brush.dirY,
              width: brush.width,
              length: brush.length,
              wedge: brush.wedge,
              pointed: brush.pointed,
              belly: brush.belly,
              fan: brush.fan,
              rootLoad: brush.rootLoad,
              slip: brush.slip,
              heelOffset: brush.heelOffset,
              bendX: brush.bendX,
              bendY: brush.bendY,
              bendAmount: brush.bendAmount,
              pressure: brush.pressure,
              speed: brush.speed,
              capBias: brush.capBias,
              cornerBias: brush.cornerBias,
            },
            pressure,
            pointed,
            fan,
            alpha: clamp(settings.density * (2.4 + pressure * 3.1), 0.28, 1) * lerp(1, 0.72, pointed),
          });
          brush.last = sample;
          brush.sampleCount += 1;
        }

        const avgAlpha = marks.reduce((sum, mark) => sum + mark.alpha, 0) / Math.max(1, marks.length);
        ink.save();
        ink.fillStyle = "#111411";
        ink.globalCompositeOperation = "source-over";
        const strokeDx = marks[marks.length - 1].x - marks[0].x;
        const strokeDy = marks[marks.length - 1].y - marks[0].y;
        const pressSideBias = strokeDx > 0 && strokeDy > 0 ? 0.24 : 0;
        const shortEnvelope = marks.length <= 18 && !pressSideBias;
        const tailEnd = pressSideBias ? 0.92 : shortEnvelope ? 0.94 : 0.62;
        const terminalPad = pressSideBias > 0;
        const sweepWidthBoost = terminalPad ? 1.04 : 1;
        if (terminalPad) {
          drawSweepWetSurface(ink, marks, avgAlpha);
          drawEnvelopePath(ink, marks, 0.76 * sweepWidthBoost, avgAlpha * 0.34, { taper: true, start: 0.24, end: 0.94, sideBias: pressSideBias * 0.78, terminalPad });
          drawEnvelopeSegments(ink, marks, 0.46 * sweepWidthBoost, 0.12, { taper: true, start: 0.48, end: tailEnd, sideBias: pressSideBias * 0.22, terminalPad });
          drawEnvelopePath(ink, marks, 0.24 * sweepWidthBoost, avgAlpha * 0.16, { taper: true, start: 0.6, end: 0.94, sideBias: pressSideBias * 0.08, terminalPad });
	        } else {
	          drawEnvelopePath(ink, marks, 1.1 * sweepWidthBoost, avgAlpha * 0.56, { taper: true, start: 0.34, end: tailEnd * 0.9, sideBias: pressSideBias * 0.42, terminalPad });
	          drawEnvelopePath(ink, marks, 0.74 * sweepWidthBoost, avgAlpha * 0.28, { taper: true, start: 0.46, end: tailEnd, sideBias: pressSideBias * 0.28, terminalPad });
	          drawEnvelopeSegments(ink, marks, 0.66 * sweepWidthBoost, 0.16, { taper: true, start: 0.5, end: tailEnd, sideBias: pressSideBias * 0.32, terminalPad });
	          drawEnvelopeSegments(ink, marks, 0.38 * sweepWidthBoost, 0.3, { taper: true, start: 0.6, end: Math.min(0.98, tailEnd + 0.08), sideBias: pressSideBias * 0.18, terminalPad });
	        }
        const end = marks[marks.length - 1];
        if (end) {
          const sweepTail = pressSideBias > 0;
          if (sweepTail) drawSweepTerminalPad(ink, marks, avgAlpha);
          const capModel = {

      function drawDemoStroke(samples) {
        if (samples.sweepNai) {
          drawDemoSweepNaiStroke(samples);
          return;
        }
        if (samples.sweepPie) {
          drawDemoSweepPieStroke(samples);
          return;
        }
        if (samples.hengShuGou) {
          drawDemoHengShuGouStroke(samples.hengShuGou);
          return;
        }
        if (samples.topDot) {
          drawDemoTopDotStroke(samples.topDot);
          return;
        }
        if (samples.heng) {
          drawDemoHengStroke(samples.heng);
          return;
        }
        if (samples.tiao) {
          drawDemoTiaoStroke(samples.tiao);
          return;
        }
        if (samples.shuGou) {
          drawDemoShuGouBristleStroke(samples);
          return;
        }
        if (samples.pie) {
          drawDemoPieStroke(samples.pie);
          return;
        }
        if (samples.nai) {
          drawDemoNaiStroke(samples.nai);
          return;
        }
        if (samples.sideDot) {
          drawDemoSideDotStroke(samples.sideDot);
          return;
        }
        if (samples.length > 1 && samples.every((sample) => sample.continuousEnvelope)) {
          drawDemoEnvelopeStroke(samples);
          return;
        }
        resetModelState();
        brush.drawing = true;
        brush.pointerId = "demo";
        for (const sample of samples) processSample(sample);
        brush.drawing = false;
        brush.pointerId = null;
        brush.last = null;
        brush.inkPoint = null;
      }

      function softenDemoInk() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        const solid = document.createElement("canvas");
        solid.width = Math.round(rect.width * dpr);
        solid.height = Math.round(rect.height * dpr);
        const solidCtx = solid.getContext("2d");
        solidCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        solidCtx.drawImage(inkCanvas, 0, 0, rect.width, rect.height);

        const temp = document.createElement("canvas");
        temp.width = Math.round(rect.width * dpr);
        temp.height = Math.round(rect.height * dpr);
        const tempCtx = temp.getContext("2d");
        tempCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        tempCtx.filter = demoInkMode ? "blur(0.14px)" : "blur(0.26px)";
        tempCtx.drawImage(inkCanvas, 0, 0, rect.width, rect.height);
        if (!singleFaceInkMode) {
          ink.save();
          ink.globalAlpha = demoInkMode ? 0.06 : 0.38;
          ink.globalCompositeOperation = "source-atop";
          ink.drawImage(temp, 0, 0, temp.width / dpr, temp.height / dpr, 0, 0, rect.width, rect.height);
          ink.globalAlpha = demoInkMode ? 0.02 : 0.18;
          ink.globalCompositeOperation = "source-over";
          ink.drawImage(solid, 0, 0, solid.width / dpr, solid.height / dpr, 0, 0, rect.width, rect.height);
          ink.restore();
        }

        const image = ink.getImageData(0, 0, inkCanvas.width, inkCanvas.height);
        const data = image.data;
        const width = image.width;
        const height = image.height;
        const originalAlpha = demoInkMode ? new Uint8ClampedArray(width * height) : null;
        if (originalAlpha) {
          for (let i = 0, p = 0; i < data.length; i += 4, p += 1) originalAlpha[p] = data[i + 3];
        }
        const edgeNoise = (x, y) => {
          const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453;
          return n - Math.floor(n);
        };
        const paperFiber = (x, y) => {
          const strand = Math.sin((x * 0.42 + y * 0.08) * Math.PI) * 0.5 + 0.5;
          const grain = edgeNoise(x * 0.47 + 19, y * 0.31 - 7);
          return strand * 0.45 + grain * 0.55;
        };
        const longFiber = (x, y) => {
          const a = Math.sin((x * 0.055 + y * 0.19) + Math.sin(y * 0.035) * 1.6) * 0.5 + 0.5;
          const b = Math.sin((x * 0.11 - y * 0.027) + 1.7) * 0.5 + 0.5;
          return a * 0.72 + b * 0.28;
        };
        for (let i = 0; i < data.length; i += 4) {
          const alpha = data[i + 3];
          if (demoInkMode) {
            const p = i / 4;
            const x = p % width;
            const y = Math.floor(p / width);
            if (alpha < 18) {
              if (singleFaceInkMode) continue;
              if (originalAlpha && x > 0 && y > 0 && x < width - 1 && y < height - 1) {
                const neighbor = Math.max(originalAlpha[p - 1], originalAlpha[p + 1], originalAlpha[p - width], originalAlpha[p + width]);
                if (neighbor > 88) {
                  const fiber = paperFiber(x, y);
                  const seed = edgeNoise(x - 23, y + 11);
                  const fringe = smoothstep(136, 220, neighbor) * smoothstep(0.18, 0.62, 1 - fiber) * smoothstep(0.44, 0.9, seed);
	                  if (fringe > 0.38) {
	                    data[i] = 178;
	                    data[i + 1] = 58;
	                    data[i + 2] = 36;
		                  data[i + 3] = Math.round(2 + fringe * 13);
                  }
                }
              }

          const leftHalf = mark.left ?? mark.half ?? 5;
          const rightHalf = mark.right ?? mark.half ?? 5;
          left.push({ ...p(mark.x + perpX * leftHalf, mark.y + perpY * leftHalf), markIndex: i });
          right.push({ ...p(mark.x - perpX * rightHalf, mark.y - perpY * rightHalf), markIndex: i });
        }

        const path = new Path2D();
        const hard = new Set(options.hardIndices ?? []);
        const smooth = (points, reverse = false) => {
          const pts = reverse ? [...points].reverse() : points;
          if (!pts.length) return;
          if (!reverse) path.moveTo(pts[0].x, pts[0].y);
          for (let i = 1; i < pts.length; i += 1) {
            const prev = pts[i - 1];
            const cur = pts[i];
            if (hard.has(prev.markIndex) || hard.has(cur.markIndex)) {
              path.lineTo(prev.x, prev.y);
              path.lineTo(cur.x, cur.y);
            } else if (i < pts.length - 1) {
              path.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
            } else {
              path.quadraticCurveTo(prev.x, prev.y, cur.x, cur.y);
            }
          }
        };
        smooth(left, false);
        smooth(right, true);
        path.closePath();

        ink.save();
        ink.fillStyle = options.fillStyle ?? "#111411";
        ink.globalCompositeOperation = "source-over";
        ink.filter = demoInkMode ? `blur(${options.blur ?? 0.02}px)` : "none";
        ink.globalAlpha = options.alpha ?? 0.96;
        ink.fill(path);
        ink.filter = "none";
        ink.restore();
        return path;
      }

      function exportPng() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        const exportCanvas = document.createElement("canvas");
        exportCanvas.width = Math.round(rect.width * dpr);
        exportCanvas.height = Math.round(rect.height * dpr);
        const ctx = exportCanvas.getContext("2d");
        ctx.scale(dpr, dpr);
        ctx.fillStyle = "#f4efe3";
        ctx.fillRect(0, 0, rect.width, rect.height);
