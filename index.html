<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>笔墨 · 毛笔书写工作台</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <h1>笔墨 <span class="sub">BIMO · 毛笔物理书写工作台</span></h1>
    <button id="btnPanel" class="ghost" title="折叠 / 展开面板" aria-label="折叠或展开面板">☰</button>
  </header>

  <main>
    <div id="stage">
      <canvas id="paperCanvas"></canvas>
      <canvas id="inkCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="strokeInfo" class="hidden">
        <div id="strokeName"></div>
        <div id="strokeTech"></div>
      </div>
      <div id="penHud">待笔</div>
    </div>

    <aside id="panel">
      <section>
        <h2>演示 · 永字八法</h2>
        <button id="btnDemo" class="primary">▶ 书写「永」字</button>
        <div id="strokeChips"></div>
        <label>书写速度
          <input type="range" id="speed" min="0.3" max="2.5" step="0.1" value="1">
        </label>
      </section>

      <section>
        <h2>毛笔</h2>
        <label>笔锋大小
          <input type="range" id="brushSize" min="8" max="42" step="1" value="29">
        </label>
        <label>笔毫弹性（软 ↔ 硬）
          <input type="range" id="stiffness" min="0.1" max="0.9" step="0.05" value="0.45">
        </label>
        <label>含墨量
          <div class="inkRow">
            <div id="inkBar"><div id="inkFill"></div></div>
            <button id="btnDip">蘸墨</button>
          </div>
        </label>
        <label>墨色
          <select id="inkColor">
            <option value="red" selected>朱砂红</option>
            <option value="black">墨黑</option>
          </select>
        </label>
      </section>

      <section>
        <h2>纸张</h2>
        <label>吸墨 / 洇墨
          <input type="range" id="absorb" min="0" max="1" step="0.05" value="0.35">
        </label>
        <label class="checkRow">
          <input type="checkbox" id="showGrid" checked> 显示米字格
        </label>
        <button id="btnClear">清纸</button>
      </section>

      <section>
        <h2>手写</h2>
        <p class="hint">直接在纸上用 Apple Pencil 或鼠标书写（手指触摸不落墨）。Pencil 用真实压感与倾角；鼠标书写时压力由运笔快慢模拟——慢按则重，快提则轻。</p>
        <label class="checkRow">
          <input type="checkbox" id="poseLink" checked> 姿态直连（Pencil）
        </label>
        <label>中锋零点 alt₀ <span class="val" id="poseAlt0Val">55°</span>
          <input type="range" id="poseAlt0" min="30" max="85" step="1" value="55">
        </label>
        <label>倾角增益 <span class="val" id="poseGainVal">1.2</span>
          <input type="range" id="poseGain" min="0" max="3" step="0.1" value="1.2">
        </label>
        <label>鼠标基准压力
          <input type="range" id="basePressure" min="0.2" max="1" step="0.05" value="0.65">
        </label>
        <div class="btnRow">
          <button id="btnExportSamples">导出手写样本</button>
          <span id="exportStatus" class="status"></span>
        </div>
        <p class="hint links">
          <a href="/probe.html" target="_blank" rel="noopener">iPad 探针页 /probe.html</a> ·
          <a href="docs/ipad-setup.md" target="_blank" rel="noopener">iPad 设置说明 docs/ipad-setup.md</a>
        </p>
      </section>
    </aside>
  </main>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
