      function getLocalPoint(event) {
        const rect = overlayCanvas.getBoundingClientRect();
        return {
          x: finite(event.clientX, rect.left) - rect.left,
          y: finite(event.clientY, rect.top) - rect.top,
        };
      }

      function extractSample(event, fallbackPointerType = null) {
        const point = getLocalPoint(event);
        let pressure = finite(event.pressure, 0);
        const pointerType = event.pointerType || fallbackPointerType || brush.pointerType || "unknown";
        const isPen = pointerType === "pen";
        if (!isPen) pressure = settings.mousePressure;
        if (brush.drawing && pressure <= 0) pressure = isPen ? 0.03 : settings.mousePressure;

        const altitude =
          typeof event.altitudeAngle === "number" && Number.isFinite(event.altitudeAngle)
            ? event.altitudeAngle
            : null;
        const azimuth =
          typeof event.azimuthAngle === "number" && Number.isFinite(event.azimuthAngle)
            ? event.azimuthAngle
            : null;
        let tiltX = finite(event.tiltX, 0);
        let tiltY = finite(event.tiltY, 0);

        if (altitude !== null && azimuth !== null) {
          const tiltAmount = clamp(1 - altitude / (Math.PI / 2), 0, 1);
          tiltX = Math.sin(azimuth) * 90 * tiltAmount;
          tiltY = -Math.cos(azimuth) * 90 * tiltAmount;
        }

        return {
          x: point.x,
          y: point.y,
          t: finite(event.timeStamp, performance.now()),
          pressure: clamp(pressure, 0, 1),
          tiltX,
          tiltY,
          twist: finite(event.twist, 0),
          pointerType,
        };
      }

      function targetShape(sample, previous) {
        const dt = previous ? Math.max(1, sample.t - previous.t) : 16;
        const dx = previous ? sample.x - previous.x : 0;
        const dy = previous ? sample.y - previous.y : -0.01;
        const distance = hypot(dx, dy);
        const speed = clamp(distance / dt, 0, 4);
        const movement = distance > 0.24 ? normalize(dx, dy, -brush.dirX, -brush.dirY) : { x: -brush.dirX, y: -brush.dirY };
        const tipDirection = { x: -movement.x, y: -movement.y };
        const rawTiltMag = clamp(hypot(sample.tiltX, sample.tiltY) / 90, 0, 1);
        const tiltSign = settings.invertTilt ? -1 : 1;
        const rotation = (settings.tiltRotation * Math.PI) / 180;
        const rawTiltX = sample.tiltX * tiltSign;
        const rawTiltY = sample.tiltY * tiltSign;
        const tiltX = rawTiltX * Math.cos(rotation) - rawTiltY * Math.sin(rotation);
        const tiltY = rawTiltX * Math.sin(rotation) + rawTiltY * Math.cos(rotation);
        const rawTilt = normalize(tiltX, tiltY, tipDirection.x, tipDirection.y);
        const tiltConfidence = smoothstep(0.18, 0.72, rawTiltMag);
        const magResponse = lerp(0.3, 0.045, settings.tiltStability);
        brush.stableTiltMag = lerp(brush.stableTiltMag, rawTiltMag, magResponse);
        const tiltMag = brush.stableTiltMag;
        const obliqueSignal = smoothstep(0.52, 0.86, rawTiltMag);
        const obliqueResponse = obliqueSignal > brush.obliqueHold ? 0.12 : 0.3;
        brush.obliqueHold = lerp(brush.obliqueHold, obliqueSignal, obliqueResponse);

        if (tiltConfidence > 0.001) {
          if (!brush.stableTiltReady) {
            brush.stableTiltX = rawTilt.x;
            brush.stableTiltY = rawTilt.y;
            brush.stableTiltReady = true;
          } else {
            const response = lerp(0.34, 0.035, settings.tiltStability) * tiltConfidence;
            const stable = normalize(
              lerp(brush.stableTiltX, rawTilt.x, response),
              lerp(brush.stableTiltY, rawTilt.y, response),
              rawTilt.x,
              rawTilt.y,
            );
            brush.stableTiltX = stable.x;
            brush.stableTiltY = stable.y;
          }
        }

        const tilt = brush.stableTiltReady ? { x: brush.stableTiltX, y: brush.stableTiltY } : rawTilt;
        const p = Math.pow(clamp(sample.pressure, 0, 1), 0.72);
        const movementIntent = smoothstep(0.18, 0.95, speed);
        const pressureIntent = smoothstep(0.12, 0.44, p);
        const pressureDrop = previous ? Math.max(0, previous.pressure - sample.pressure) : 0;
        const liftIntent = smoothstep(0.015, 0.12, pressureDrop) * movementIntent;
        const pointed = clamp((sample.pointedBias || 0) + liftIntent + (1 - pressureIntent) * movementIntent * 0.72, 0, 1);
        const bellyDrive = pressureIntent * (1 - pointed * 0.72) * lerp(0.2, 0.5, movementIntent);
        const belly = clamp((sample.bellyBias || 0) + bellyDrive, 0, 1);
        const fanBias = clamp(sample.fanBias || 0, 0, 1);
        const fanDrive = pressureIntent * movementIntent * (1 - pointed * 0.62) * lerp(0.1, 0.3, smoothstep(0.24, 1.08, speed));
        const fan = clamp(fanBias + fanDrive + belly * 0.08 + brush.turnHold * 0.1, 0, 1);
        const shapeBias = clamp(sample.shapeBias || 0, 0, 1);
        const turnSignal = clamp(1 - (tipDirection.x * brush.dirX + tipDirection.y * brush.dirY), 0, 2) * 0.5;
        const targetTurnHold = smoothstep(0.18, 0.72, turnSignal) * movementIntent * pressureIntent;
        const turnResponse = targetTurnHold > brush.turnHold ? 0.18 : 0.42;
        brush.turnHold = lerp(brush.turnHold, targetTurnHold, turnResponse);
        const dragIntent = movementIntent * pressureIntent;
        const bendIntent = smoothstep(0.42, 1.35, speed) * pressureIntent;
        const obliqueGate = smoothstep(0.18, 0.62, brush.obliqueHold);
        const obliqueAmount = tiltMag * obliqueGate;
        const obliqueIntent = smoothstep(0.46, 0.9, tiltMag) * obliqueGate * settings.tiltInfluence;
        const targetShapeIntent = clamp(
          Math.max(shapeBias, obliqueIntent, brush.turnHold * 0.72, liftIntent * 0.86, bendIntent * lerp(0.16, 0.54, pointed)),
          0,
          1,
        );
        const intentResponse = targetShapeIntent < brush.shapeIntent ? 0.34 : 0.12;
        brush.shapeIntent = lerp(brush.shapeIntent, targetShapeIntent, intentResponse);
        const shapeIntent = brush.shapeIntent;
        const motionWeight = movementIntent;
        const memoryWeight = lerp(1.35, 0.18, movementIntent);
        const dragWeight = movementIntent * lerp(0.95, 1.55, pressureIntent);
        const tiltWeight = settings.tiltInfluence * smoothstep(0.46, 0.9, tiltMag) * obliqueGate * 0.9;
        const bristleTip = normalize(
          tipDirection.x * (1 - liftIntent) + movement.x * liftIntent,
          tipDirection.y * (1 - liftIntent) + movement.y * liftIntent,
          tipDirection.x,
          tipDirection.y,
        );
        const axisBias = clamp(sample.axisBias || 0, 0, 1);
        const axis =
          Number.isFinite(sample.axisX) && Number.isFinite(sample.axisY)
            ? normalize(sample.axisX, sample.axisY, bristleTip.x, bristleTip.y)
            : bristleTip;
        const direction = normalize(
          brush.dirX * memoryWeight + bristleTip.x * dragWeight * (1 - axisBias) + axis.x * dragWeight * axisBias + tilt.x * tiltWeight,
          brush.dirY * memoryWeight + bristleTip.y * dragWeight * (1 - axisBias) + axis.y * dragWeight * axisBias + tilt.y * tiltWeight,
          brush.dirX,
          brush.dirY,
        );

        const size = settings.size;
        const cornerSpread = brush.turnHold * settings.deform;
        const spread =
          size *
          (0.045 + p * 0.96) *
          (1 + belly * 0.16 + fan * 0.22 + obliqueAmount * 0.28 * settings.deform + cornerSpread * 0.2);
        const dragStretch = clamp(speed * 0.55, 0, 1.4) * movementIntent;
        const tiltStretch = obliqueAmount * 1.35;
        const length =
          size *
          (0.07 +
            p * 0.42 +
            pointed * 0.18 +
            settings.deform *
              shapeIntent *
              (tiltStretch * 0.58 + dragStretch * 0.52 + p * obliqueAmount * 0.34 + brush.turnHold * 0.22));
        const wedge = clamp(
          settings.deform *
            shapeIntent *
            (obliqueAmount * 0.68 + bendIntent * 0.24 + brush.turnHold * 0.36 + liftIntent * 0.22 + shapeBias * 0.62),
          0,
          1,
        );
        const heelOffset = clamp((pressureIntent * movementIntent * 0.12 + belly * 0.12 + fan * 0.1) * (1 - pointed * 0.72), 0, 0.24);
        const bendDir = normalize(-movement.x, -movement.y, -direction.x, -direction.y);
        const bendAmount = clamp(
          (pressureIntent * movementIntent * 0.32 + brush.turnHold * 0.18 + fan * 0.12) * (1 - pointed * 0.82),
          0,
          0.52,
        );
        const rootBias = clamp(sample.rootBias || 0, 0, 1);
        const rootDrive =
          pressureIntent *
          (1 - pointed * 0.8) *
          (0.18 + belly * 0.42 + fan * 0.28 + brush.turnHold * 0.32) *
          lerp(1, 0.62, smoothstep(1.08, 2.4, speed));
        const rootLoad = clamp(rootBias + rootDrive, 0, 1);
        const slipBias = clamp(sample.slipBias || 0, 0, 1);
        const slip = clamp(
          slipBias + movementIntent * lerp(0.28, 0.82, smoothstep(0.22, 1.35, speed)) + liftIntent * 0.32 - rootLoad * 0.18,
          0,
          1,
        );

        return {
          dirX: direction.x,
          dirY: direction.y,
          width: clamp(spread, 1.2, size * 1.75),
          length: clamp(Math.max(length, spread * lerp(0.92, 2.15, Math.max(wedge, pointed * 0.86))), 1.4, size * 2.55),
          wedge,
          pointed,
          belly,
          fan,
          heelOffset,
          bendX: bendDir.x,
          bendY: bendDir.y,
          bendAmount,
          rootLoad,
          slip,
          pressure: sample.pressure,
          speed,
          tiltX: sample.tiltX,
          tiltY: sample.tiltY,
          twist: sample.twist,
          inkScale: sample.inkScale ?? 1,
          bellyBias: sample.bellyBias ?? 0,
          fanBias,
          shapeBias,
          rootBias,
          slipBias,
          stampBias: sample.stampBias ?? 0,
          capBias: sample.capBias ?? 0,
          cornerBias: sample.cornerBias ?? 0,
          pointerType: sample.pointerType,
        };
      }

      function settleBrush(target) {
        const response = clamp(1 - settings.lag, 0.08, 0.76);
        const shapeResponse = target.wedge < 0.08 ? Math.max(response, 0.72) : response;
        const dir = normalize(
          lerp(brush.dirX, target.dirX, response * 0.72),
          lerp(brush.dirY, target.dirY, response * 0.72),
          target.dirX,
          target.dirY,
        );
        brush.dirX = dir.x;
        brush.dirY = dir.y;
        brush.width = lerp(brush.width, target.width, response);
        brush.length = lerp(brush.length, target.length, response);
        brush.wedge = lerp(brush.wedge, target.wedge, shapeResponse);
        brush.pointed = lerp(brush.pointed || 0, target.pointed || 0, shapeResponse);
        brush.belly = lerp(brush.belly || 0, target.belly || 0, response);
        brush.fan = lerp(brush.fan || 0, target.fan || 0, response);
        brush.heelOffset = lerp(brush.heelOffset || 0, target.heelOffset || 0, response);
        brush.bendX = lerp(brush.bendX || 0, target.bendX || 0, response);
        brush.bendY = lerp(brush.bendY || 0, target.bendY || 0, response);
        brush.bendAmount = lerp(brush.bendAmount || 0, target.bendAmount || 0, response);
        brush.rootLoad = lerp(brush.rootLoad || 0, target.rootLoad || 0, response);
        brush.slip = lerp(brush.slip || 0, target.slip || 0, response);
        brush.pressure = target.pressure;
        brush.speed = target.speed;
        brush.tiltX = target.tiltX;
        brush.tiltY = target.tiltY;
        brush.twist = target.twist;
        brush.inkScale = target.inkScale ?? 1;
        brush.stampBias = target.stampBias ?? 0;
        brush.capBias = target.capBias ?? 0;
        brush.cornerBias = target.cornerBias ?? 0;
        brush.pointerType = target.pointerType;
      }

      function contactPath(x, y, model, scale = 1, offset = 0) {
        const dirX = model.dirX;
        const dirY = model.dirY;
        const perpX = -dirY;
        const perpY = dirX;
        const width = model.width * scale;
        const length = model.length * scale;
        const wedge = Math.max(model.wedge, (model.cornerBias || 0) * 0.55);
        const pointed = clamp(model.pointed || 0, 0, 1);
        const fan = clamp(model.fan || 0, 0, 1);
        const rootLoad = clamp(model.rootLoad || 0, 0, 1);
        const slip = clamp(model.slip || 0, 0, 1);
        const bendAmount = clamp(model.bendAmount || 0, 0, 1);
        const bendX = (model.bendX || 0) * width * bendAmount;
        const bendY = (model.bendY || 0) * width * bendAmount;
        const cx = x + perpX * offset;
        const cy = y + perpY * offset;

        if (wedge < 0.16) {
          if (pointed > 0.18) {
            const path = new Path2D();
            const forward = length * lerp(0.48, 0.82, pointed);
            const back = length * lerp(0.44, 0.16, pointed) * lerp(1, 1.16, rootLoad);
            const belly = width * lerp(0.5, 0.68, fan) * lerp(1, 1.1, rootLoad);
            const tipW = width * lerp(0.3, 0.02, pointed) * lerp(1.04, 0.92, fan) * lerp(1, 0.82, slip);
            const tailW = width * lerp(0.38, 0.18, pointed) * lerp(1.04, 1.18, fan) * lerp(1, 1.28, rootLoad);
            const heelRound = width * lerp(0.1, 0.32, 1 - pointed) * lerp(1, 1.2, fan);
            const tip = { x: cx + dirX * forward, y: cy + dirY * forward };
            const tail = { x: cx - dirX * back + bendX * 0.42, y: cy - dirY * back + bendY * 0.42 };
            path.moveTo(tip.x + perpX * tipW, tip.y + perpY * tipW);
            path.bezierCurveTo(
              cx + dirX * forward * 0.22 + perpX * belly + bendX * 0.22,
              cy + dirY * forward * 0.22 + perpY * belly + bendY * 0.22,
              tail.x + perpX * tailW,
              tail.y + perpY * tailW,
              tail.x - dirX * heelRound,
              tail.y - dirY * heelRound,
            );
            path.bezierCurveTo(
              tail.x - perpX * tailW,
              tail.y - perpY * tailW,
              cx + dirX * forward * 0.22 - perpX * belly + bendX * 0.22,
              cy + dirY * forward * 0.22 - perpY * belly + bendY * 0.22,
              tip.x - perpX * tipW,
              tip.y - perpY * tipW,
            );
            path.quadraticCurveTo(tip.x + dirX * tipW * 0.2, tip.y + dirY * tipW * 0.2, tip.x + perpX * tipW, tip.y + perpY * tipW);
            path.closePath();
            return path;
          }
          const path = new Path2D();
          path.ellipse(cx, cy, width * 0.5, Math.max(width * 0.44, length * 0.5), Math.atan2(dirY, dirX), 0, Math.PI * 2);
          return path;
        }

        const forward = length * lerp(0.22, 0.42, wedge) * lerp(1, 0.88, rootLoad);
        const back = length - forward;
        const tipW = width * lerp(0.42, 0.08, wedge) * lerp(1.02, 0.92, fan) * lerp(1, 0.84, slip);
        const shoulderW = width * lerp(0.46, 0.64, wedge) * lerp(1, 1.12, fan) * lerp(1, 1.18, rootLoad);
        const baseW = width * lerp(0.5, 0.58, fan) * lerp(1, 1.24, rootLoad);
        const heelRound = width * lerp(0.12, 0.34, Math.max(fan, 1 - wedge)) * lerp(1, 1.18, rootLoad);
        const tip = { x: cx + dirX * forward, y: cy + dirY * forward };
        const base = { x: cx - dirX * back + bendX * 0.42, y: cy - dirY * back + bendY * 0.42 };
        const shoulder = { x: cx - dirX * back * 0.16 + bendX * 0.22, y: cy - dirY * back * 0.16 + bendY * 0.22 };
        const leftBase = { x: base.x + perpX * baseW, y: base.y + perpY * baseW };
        const rightBase = { x: base.x - perpX * baseW, y: base.y - perpY * baseW };
        const leftTip = { x: tip.x + perpX * tipW, y: tip.y + perpY * tipW };
        const rightTip = { x: tip.x - perpX * tipW, y: tip.y - perpY * tipW };
        const leftShoulder = { x: shoulder.x + perpX * shoulderW, y: shoulder.y + perpY * shoulderW };
        const rightShoulder = { x: shoulder.x - perpX * shoulderW, y: shoulder.y - perpY * shoulderW };

        const path = new Path2D();
        path.moveTo(leftTip.x, leftTip.y);
        path.bezierCurveTo(
          cx + dirX * forward * 0.34 + perpX * width * 0.2,
          cy + dirY * forward * 0.34 + perpY * width * 0.2,
          leftShoulder.x,
          leftShoulder.y,
          leftBase.x,
          leftBase.y,
        );
        path.bezierCurveTo(
          base.x - dirX * heelRound + perpX * baseW * 0.8,
          base.y - dirY * heelRound + perpY * baseW * 0.8,
          base.x - dirX * heelRound - perpX * baseW * 0.8,
          base.y - dirY * heelRound - perpY * baseW * 0.8,
          rightBase.x,
          rightBase.y,
        );
        path.bezierCurveTo(
          rightShoulder.x,
          rightShoulder.y,
          cx + dirX * forward * 0.34 - perpX * width * 0.2,
          cy + dirY * forward * 0.34 - perpY * width * 0.2,
          rightTip.x,
          rightTip.y,
        );
        path.quadraticCurveTo(tip.x + dirX * tipW * 0.2, tip.y + dirY * tipW * 0.2, leftTip.x, leftTip.y);
        path.closePath();
        return path;
      }

      function drawDryCuts(ctx, x, y, model) {
        if (!settings.dryCut || settings.dryness <= 0.01) return;
        const pointed = clamp(model.pointed || 0, 0, 1);
        const cutStrength = settings.dryness * (1 - pointed * 0.85) * clamp(model.speed * 0.5 + model.wedge * 0.8, 0, 1);
        if (cutStrength <= 0.01) return;
        const dirX = model.dirX;
        const dirY = model.dirY;
        const perpX = -dirY;
        const perpY = dirX;
        const cuts = 1 + Math.floor(cutStrength * 5);

        ctx.save();
        ctx.globalCompositeOperation = "destination-out";
        ctx.globalAlpha = clamp(0.08 + cutStrength * 0.22, 0, 0.34);
        ctx.lineCap = "round";
        for (let i = 0; i < cuts; i += 1) {
          const lane = (Math.random() - 0.5) * model.width * 0.62;
          const wobble = (Math.random() - 0.5) * model.width * 0.15;
          const startBack = model.length * (0.24 + Math.random() * 0.38);
          const endForward = model.length * (0.12 + Math.random() * 0.24);
          ctx.lineWidth = Math.max(0.7, model.width * (0.018 + Math.random() * 0.026));
          ctx.beginPath();
          ctx.moveTo(x - dirX * startBack + perpX * lane, y - dirY * startBack + perpY * lane);
          ctx.quadraticCurveTo(
            x + perpX * (lane + wobble),
            y + perpY * (lane + wobble),
            x + dirX * endForward + perpX * (lane * 0.44),
            y + dirY * endForward + perpY * (lane * 0.44),
          );
          ctx.stroke();
        }
        ctx.restore();
      }

      function bridgeInkWidth(model) {
        const pointed = clamp(model.pointed || 0, 0, 1);
        const fan = clamp(model.fan || 0, 0, 1);
        return Math.max(0.36, model.width * lerp(0.96, 0.34, pointed) * lerp(1, 1.18, fan));
      }

      function mantleModel(model) {
        const fan = clamp(model.fan || 0, 0, 1);
        const belly = clamp(model.belly || 0, 0, 1);
        const pointed = clamp(model.pointed || 0, 0, 1);
        return {
          ...model,
          width: model.width * lerp(1.04, 1.28, fan) * lerp(1, 1.12, belly),
          length: model.length * lerp(1.02, 1.16, belly) * lerp(1, 0.92, pointed),
          wedge: model.wedge * lerp(0.9, 0.62, fan),
          pointed: pointed * lerp(0.92, 0.72, fan),
        };
      }

      function coreModel(model) {
        const layers = bristleLayers(model);
        const pointed = clamp(model.pointed || 0, 0, 1);
        return {
          ...model,
          width: model.width * layers.coreRatio,
          length: model.length * lerp(0.9, 1.02, pointed),
          fan: 0,
          belly: clamp(model.belly || 0, 0, 1) * 0.45,
        };
      }

      function fract(value) {
        return value - Math.floor(value);
      }

      function bristleNoise(seed) {
        return fract(Math.sin(seed * 12.9898 + 78.233) * 43758.5453);
      }

      function bristleLayers(model) {
        const pointed = clamp(model.pointed || 0, 0, 1);
        const pressure = clamp(model.pressure || 0, 0, 1);
        const belly = clamp(model.belly || 0, 0, 1);
        const fan = clamp(model.fan || 0, 0, 1);
        const coreRatio = clamp(0.63 + pressure * 0.22 - pointed * 0.16 - belly * 0.1 - fan * 0.06 - settings.roughness * 0.04, 0.46, 0.9);
        const mantleRatio = 1 - coreRatio;
        return { coreRatio, mantleRatio, pointed, belly, fan };
      }

      function contactCenter(x, y, model) {
        const heel = clamp(model.heelOffset || 0, 0, 0.4);
        const back = model.length * heel;
        return { x: x - model.dirX * back, y: y - model.dirY * back };
      }

      function drawBellyWash(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf) {
        const belly = clamp(model.belly || 0, 0, 1);
        if (belly < 0.08) return;
        const pointed = clamp(model.pointed || 0, 0, 1);
        const fan = clamp(model.fan || 0, 0, 1);
        const rootLoad = clamp(model.rootLoad || 0, 0, 1);
        const spread = lerp(1.04, 1.34, belly) * lerp(1, 1.12, fan) * lerp(1, 0.78, pointed);
        const fromBellyHalf = fromHalf * spread;
        const toBellyHalf = toHalf * spread;
        const bow = model.width * belly * lerp(0.04, 0.16, clamp(model.pressure || 0, 0, 1));

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        const broadPress = rootLoad > 0.08 && model.pressure > 0.24 && pointed < 0.58;
        const washAlpha = broadPress
          ? alpha * lerp(0.08, 0.16, belly) * lerp(1, 0.72, pointed)
          : alpha * lerp(0.62, 0.96, belly) * lerp(1, 0.72, pointed);
        ctx.globalAlpha = washAlpha;
        ctx.beginPath();
        ctx.moveTo(from.x + perpX * fromBellyHalf, from.y + perpY * fromBellyHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 + perpX * (fromBellyHalf + toBellyHalf) * 0.18 + perpX * bow,
          (from.y + to.y) * 0.5 + perpY * (fromBellyHalf + toBellyHalf) * 0.18 + perpY * bow,
          to.x + perpX * toBellyHalf,
          to.y + perpY * toBellyHalf,
        );
        ctx.lineTo(to.x - perpX * toBellyHalf, to.y - perpY * toBellyHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 - perpX * (fromBellyHalf + toBellyHalf) * 0.18 - perpX * bow,
          (from.y + to.y) * 0.5 - perpY * (fromBellyHalf + toBellyHalf) * 0.18 - perpY * bow,
          from.x - perpX * fromBellyHalf,
          from.y - perpY * fromBellyHalf,
        );
        ctx.closePath();
        ctx.fill();
        if (!broadPress) {
          ctx.strokeStyle = "#111411";
          ctx.lineCap = pointed > 0.82 || model.capBias > 0.55 ? "butt" : "round";
          ctx.lineJoin = "round";
          ctx.globalAlpha = alpha * lerp(0.42, 0.82, belly) * lerp(1, 0.26, rootLoad) * lerp(1, 0.72, pointed);
          ctx.lineWidth = Math.max(0.8, Math.max(fromBellyHalf, toBellyHalf) * lerp(1.02, 1.42, belly) * lerp(1, 0.58, rootLoad));
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawMantleFibers(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf) {
        if (!demoInkMode && settings.roughness < 0.08) return;
        const layers = bristleLayers(model);
        const mantle = layers.mantleRatio;
        if (mantle < 0.08 || model.width < 4) return;
        const fan = clamp(model.fan || 0, 0, 1);
        const belly = clamp(model.belly || 0, 0, 1);
        const broadFiberDamping = model.rootLoad > 0.12 && model.pressure > 0.28 && layers.pointed < 0.45 ? 0.12 : 1;
        const demoFiberDamping = demoInkMode ? 0.12 : 1;
        let edgeVisibility = clamp(
          settings.roughness * 1.6 + fan * 0.1 + belly * 0.06 + (layers.pointed > 0.72 ? 0.08 : 0) + (model.capBias > 0.7 ? 0.05 : 0),
          0,
          0.22,
        ) * broadFiberDamping * demoFiberDamping;
        edgeVisibility *= smoothstep(11, 24, model.width) * lerp(1, 0.48, layers.pointed);
        if (edgeVisibility < 0.018) return;
        const pressure = clamp(model.pressure || 0, 0, 1);
        const fiberCount = Math.round(clamp(1 + fan * 2.6 + belly * 1.2 + model.width * 0.018, 1, 5));
        const seedBase = from.x * 0.17 + from.y * 0.31 + to.x * 0.13 + to.y * 0.19 + model.width;

        ctx.save();
        ctx.strokeStyle = "#111411";
        ctx.lineCap = layers.pointed > 0.82 || model.capBias > 0.7 ? "butt" : "round";
        ctx.lineJoin = "round";
        for (let side = -1; side <= 1; side += 2) {
          for (let i = 0; i < fiberCount; i += 1) {
            const laneT = fiberCount === 1 ? 0.5 : i / (fiberCount - 1);
            const noise = bristleNoise(seedBase + side * 19 + i * 7.3);
            const edgeT = clamp(laneT + (noise - 0.5) * 0.2, 0, 1);
            const mantleOffset = lerp(layers.coreRatio, 1.02, edgeT);
            const fromOffset = fromHalf * mantleOffset * side;
            const toOffset = toHalf * mantleOffset * side;
            const strandAlpha = alpha * edgeVisibility * lerp(0.018, 0.065, mantle) * lerp(0.72, 0.95, pressure) * lerp(1, 0.42, layers.pointed);
            const strandWidth = Math.max(0.14, model.width * lerp(0.003, 0.01, edgeT) * lerp(0.68, 0.98, pressure));
            const sideCurl = (noise - 0.5) * model.width * mantle * lerp(0.08, 0.22, fan);
            const startTrim = bristleNoise(seedBase + i * 11.7) * model.width * lerp(0.05, 0.12, fan);
            const endTrim = bristleNoise(seedBase + i * 5.1 + 3) * model.width * lerp(0.06, 0.18, fan);
            ctx.globalAlpha = strandAlpha;
            ctx.lineWidth = strandWidth;
            ctx.beginPath();
            ctx.moveTo(
              from.x + perpX * fromOffset + dir.x * startTrim,
              from.y + perpY * fromOffset + dir.y * startTrim,
            );
            ctx.quadraticCurveTo(
              (from.x + to.x) * 0.5 + perpX * ((fromOffset + toOffset) * 0.5 + sideCurl),
              (from.y + to.y) * 0.5 + perpY * ((fromOffset + toOffset) * 0.5 + sideCurl),
              to.x + perpX * toOffset - dir.x * endTrim,
              to.y + perpY * toOffset - dir.y * endTrim,
            );
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawCleanWetBridge(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf) {
        const pointed = clamp(model.pointed || 0, 0, 1);
        const rootLoad = clamp(model.rootLoad || 0, 0, 1);
        const belly = clamp(model.belly || 0, 0, 1);
        const inkScale = clamp(model.inkScale ?? 1, 0, 1);
        const fromCleanHalf = fromHalf * lerp(1, 0.88, pointed) * lerp(1, 1.04, rootLoad);
        const toCleanHalf = toHalf * lerp(1, 0.86, pointed) * lerp(1, 1.06, rootLoad);
        const bow = Math.max(fromCleanHalf, toCleanHalf) * lerp(0.008, 0.032, belly) * lerp(1, 0.35, pointed);
        const cleanAlpha = clamp(Math.max(alpha, 0.86 * inkScale), 0, 1);

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        if (livePenInkMode(model)) {
          ctx.globalAlpha = clamp(0.9 + model.pressure * 0.12, 0.88, 0.98) * inkScale;
          ctx.beginPath();
          ctx.moveTo(from.x + perpX * fromCleanHalf, from.y + perpY * fromCleanHalf);
          ctx.quadraticCurveTo(
            (from.x + to.x) * 0.5 + perpX * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
            (from.y + to.y) * 0.5 + perpY * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
            to.x + perpX * toCleanHalf,
            to.y + perpY * toCleanHalf,
          );
          ctx.lineTo(to.x - perpX * toCleanHalf, to.y - perpY * toCleanHalf);
          ctx.quadraticCurveTo(
            (from.x + to.x) * 0.5 - perpX * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
            (from.y + to.y) * 0.5 - perpY * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
            from.x - perpX * fromCleanHalf,
            from.y - perpY * fromCleanHalf,
          );
          ctx.closePath();
          ctx.fill();
          const seamCover = Math.min(1.4, hypot(to.x - from.x, to.y - from.y) * 0.45 + 0.4);
          ctx.globalAlpha = inkScale;
          ctx.strokeStyle = "#111411";
          ctx.lineCap = "butt";
          ctx.lineJoin = "round";
          ctx.lineWidth = Math.max(1.2, (fromCleanHalf + toCleanHalf) * lerp(1.02, 1.08, rootLoad));
          ctx.beginPath();
          ctx.moveTo(from.x - dir.x * seamCover, from.y - dir.y * seamCover);
          ctx.lineTo(to.x + dir.x * seamCover, to.y + dir.y * seamCover);
          ctx.stroke();
          ctx.restore();
          return;
        }
        ctx.globalAlpha = cleanAlpha;
        ctx.beginPath();
        ctx.moveTo(from.x + perpX * fromCleanHalf, from.y + perpY * fromCleanHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 + perpX * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
          (from.y + to.y) * 0.5 + perpY * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
          to.x + perpX * toCleanHalf,
          to.y + perpY * toCleanHalf,
        );
        ctx.lineTo(to.x - perpX * toCleanHalf, to.y - perpY * toCleanHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 - perpX * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
          (from.y + to.y) * 0.5 - perpY * ((fromCleanHalf + toCleanHalf) * 0.5 + bow),
          from.x - perpX * fromCleanHalf,
          from.y - perpY * fromCleanHalf,
        );
        ctx.closePath();
        ctx.fill();

        if (pointed < 0.72) {
          ctx.globalAlpha = cleanAlpha;
          ctx.strokeStyle = "#111411";
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = Math.max(0.8, Math.min(fromCleanHalf, toCleanHalf) * lerp(1.36, 1.72, rootLoad));
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawWetBridge(ctx, from, to, model) {
        if (!from) return;
        to = contactCenter(to.x, to.y, model);
        const distance = hypot(to.x - from.x, to.y - from.y);
        if (distance < 0.01) return;
        const pointed = clamp(model.pointed || 0, 0, 1);
        const capBias = clamp(model.capBias || 0, 0, 1);
        const cornerBias = clamp(model.cornerBias || 0, 0, 1);
        const rootLoad = clamp(model.rootLoad || 0, 0, 1);
        const slip = clamp(model.slip || 0, 0, 1);
        const broadPress = rootLoad > 0.08 && model.pressure > 0.24 && pointed < 0.58;
        const inkScale = clamp(model.inkScale ?? 1, 0, 1);
        if (inkScale <= 0.01) return;
        if ((from.inkScale ?? 1) <= 0.05 && inkScale > 0.05) return;
        const baseAlpha = clamp(settings.density * (2.2 + model.pressure * 3.2), 0.28, 1) * lerp(1, 0.72, pointed) * inkScale;
        const opaqueCore = smoothstep(0.22, 0.48, model.pressure) * (1 - pointed * 0.64);
        const alpha = broadPress ? lerp(lerp(baseAlpha, inkScale, opaqueCore), 0.92 * inkScale, smoothstep(0.2, 0.58, rootLoad + model.pressure * 0.42)) : lerp(baseAlpha, inkScale, opaqueCore);
        const rootDrag = rootLoad * lerp(0.08, 0.24, clamp(model.pressure || 0, 0, 1)) * lerp(1, 0.42, slip);
        to = {
          ...to,
          x: lerp(to.x, from.x, rootDrag),
          y: lerp(to.y, from.y, rootDrag),
        };
        const dir = normalize(to.x - from.x, to.y - from.y, model.dirX, model.dirY);
        const perpX = -dir.y;
        const perpY = dir.x;
        const fromHalf = Math.max(0.18, from.width * 0.5 * lerp(1, 1.08, rootLoad));
        const toHalf = Math.max(0.18, bridgeInkWidth(model) * 0.5 * lerp(1, 1.12, rootLoad));
        const layers = bristleLayers(model);
        const fromCoreHalf = fromHalf * layers.coreRatio;
        const toCoreHalf = toHalf * layers.coreRatio;
        const edgeBow =
          Math.max(fromHalf, toHalf) *
          (0.04 + clamp(model.belly || 0, 0, 1) * 0.12 + clamp(model.fan || 0, 0, 1) * 0.1 + clamp(model.cornerBias || 0, 0, 1) * 0.08) *
          lerp(1, 0.42, pointed);

        if (liveCleanInkMode(model)) {
          drawCleanWetBridge(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf);
          return;
        }

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * (broadPress ? 0.07 : 0.11);
        const softHalfScale = broadPress ? 1.22 : 1.14;
        const softBow = edgeBow * 1.18;
        ctx.beginPath();
        ctx.moveTo(from.x + perpX * fromHalf * softHalfScale, from.y + perpY * fromHalf * softHalfScale);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 + perpX * ((fromHalf + toHalf) * 0.5 * softHalfScale + softBow),
          (from.y + to.y) * 0.5 + perpY * ((fromHalf + toHalf) * 0.5 * softHalfScale + softBow),
          to.x + perpX * toHalf * softHalfScale,
          to.y + perpY * toHalf * softHalfScale,
        );
        ctx.lineTo(to.x - perpX * toHalf * softHalfScale, to.y - perpY * toHalf * softHalfScale);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 - perpX * ((fromHalf + toHalf) * 0.5 * softHalfScale + softBow),
          (from.y + to.y) * 0.5 - perpY * ((fromHalf + toHalf) * 0.5 * softHalfScale + softBow),
          from.x - perpX * fromHalf * softHalfScale,
          from.y - perpY * fromHalf * softHalfScale,
        );
        ctx.closePath();
        ctx.fill();

        drawBellyWash(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf);
        ctx.globalAlpha = alpha * (broadPress ? lerp(0.08, 0.18, clamp(model.fan || 0, 0, 1)) : lerp(0.2, 0.36, layers.mantleRatio));
        ctx.beginPath();
        ctx.moveTo(from.x + perpX * fromHalf, from.y + perpY * fromHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 + perpX * ((fromHalf + toHalf) * 0.5 + edgeBow),
          (from.y + to.y) * 0.5 + perpY * ((fromHalf + toHalf) * 0.5 + edgeBow),
          to.x + perpX * toHalf,
          to.y + perpY * toHalf,
        );
        ctx.lineTo(to.x - perpX * toHalf, to.y - perpY * toHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 - perpX * ((fromHalf + toHalf) * 0.5 + edgeBow),
          (from.y + to.y) * 0.5 - perpY * ((fromHalf + toHalf) * 0.5 + edgeBow),
          from.x - perpX * fromHalf,
          from.y - perpY * fromHalf,
        );
        ctx.closePath();
        ctx.fill();

        ctx.globalAlpha = broadPress ? Math.min(0.98, alpha) : alpha * 0.78;
        const coreBow = edgeBow * layers.coreRatio;
        ctx.beginPath();
        ctx.moveTo(from.x + perpX * fromCoreHalf, from.y + perpY * fromCoreHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 + perpX * ((fromCoreHalf + toCoreHalf) * 0.5 + coreBow),
          (from.y + to.y) * 0.5 + perpY * ((fromCoreHalf + toCoreHalf) * 0.5 + coreBow),
          to.x + perpX * toCoreHalf,
          to.y + perpY * toCoreHalf,
        );
        ctx.lineTo(to.x - perpX * toCoreHalf, to.y - perpY * toCoreHalf);
        ctx.quadraticCurveTo(
          (from.x + to.x) * 0.5 - perpX * ((fromCoreHalf + toCoreHalf) * 0.5 + coreBow),
          (from.y + to.y) * 0.5 - perpY * ((fromCoreHalf + toCoreHalf) * 0.5 + coreBow),
          from.x - perpX * fromCoreHalf,
          from.y - perpY * fromCoreHalf,
        );
        ctx.closePath();
        ctx.fill();

        if (broadPress) {
          ctx.globalAlpha = alpha * lerp(0.16, 0.28, rootLoad);
          ctx.strokeStyle = "#111411";
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.lineWidth = Math.max(0.8, Math.min(fromCoreHalf, toCoreHalf) * lerp(0.86, 1.18, rootLoad));
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }

        const centerStrokeAlpha = alpha * lerp(1, 0.18, rootLoad) * lerp(1, 0.44, clamp(model.belly || 0, 0, 1));
        if (!broadPress && centerStrokeAlpha > 0.025) {
          ctx.globalAlpha = centerStrokeAlpha;
          ctx.lineCap = pointed > 0.82 || capBias > 0.5 ? "butt" : "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = "#111411";
          ctx.lineWidth = Math.max(
            0.5,
            lerp(
              Math.max(fromCoreHalf, toCoreHalf) * 1.86,
              Math.min(fromCoreHalf, toCoreHalf) * 1.48,
              Math.max(pointed, capBias * 0.72, cornerBias * 0.55),
            ) * lerp(1, 0.5, rootLoad),
          );
          ctx.beginPath();
          ctx.moveTo(from.x, from.y);
          ctx.lineTo(to.x, to.y);
          ctx.stroke();
        }
        drawMantleFibers(ctx, from, to, model, alpha, dir, perpX, perpY, fromHalf, toHalf);

        if (capBias > 0.2) {
          ctx.globalAlpha = alpha * capBias;
          ctx.lineCap = "butt";
          const capDepth = Math.max(0.8, toHalf * lerp(0.26, 1.05, capBias));
          const capHalf = toHalf * lerp(0.88, 1.08, capBias);
          ctx.beginPath();
          ctx.moveTo(to.x + dir.x * capDepth + perpX * capHalf, to.y + dir.y * capDepth + perpY * capHalf);
          ctx.lineTo(to.x + dir.x * capDepth - perpX * capHalf, to.y + dir.y * capDepth - perpY * capHalf);
          ctx.lineTo(to.x - dir.x * capDepth * 0.22 - perpX * capHalf * 0.9, to.y - dir.y * capDepth * 0.22 - perpY * capHalf * 0.9);
          ctx.lineTo(to.x - dir.x * capDepth * 0.22 + perpX * capHalf * 0.9, to.y - dir.y * capDepth * 0.22 + perpY * capHalf * 0.9);
          ctx.closePath();
          ctx.fill();
          ctx.lineWidth = Math.max(0.6, toHalf * lerp(0.36, 0.9, capBias));
          ctx.beginPath();
          ctx.moveTo(to.x + perpX * toHalf * 0.96, to.y + perpY * toHalf * 0.96);
          ctx.lineTo(to.x - perpX * toHalf * 0.96, to.y - perpY * toHalf * 0.96);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawFootprint(ctx, x, y, model) {
        const heavyPress = smoothstep(0.52, 0.92, model.pressure);
        const pointed = clamp(model.pointed || 0, 0, 1);
        const belly = clamp(model.belly || 0, 0, 1);
        const stampScale = lerp(1, 0.78, heavyPress) * lerp(1, 0.52, pointed) * lerp(1, 1.24, belly);
        const splitChance =
          (1 - heavyPress) *
          (1 - pointed * 0.86) *
          settings.roughness *
          clamp(0.32 + model.wedge * model.pressure * 1.8, 0, 0.48);
        const split = Math.random() < splitChance && model.width > 10;
        const movingInk = smoothstep(0.18, 0.88, model.speed) * smoothstep(0.16, 0.54, model.pressure);
        const inkScale = clamp(model.inkScale ?? 1, 0, 1);
        const stampBias = clamp(model.stampBias || 0, 0, 1);
        const capBias = clamp(model.capBias || 0, 0, 1);
        const cornerBias = clamp(model.cornerBias || 0, 0, 1);
        let alpha =
          clamp(settings.density * (0.22 + model.pressure * 0.62), 0.015, 0.36) *
          lerp(1, 1.7, belly) *
          lerp(1, 0.12, pointed) *
          lerp(1, 0.08, movingInk) *
          lerp(1, 0.18, capBias) *
          lerp(1, 0.12, cornerBias) *
          lerp(1, 2.1, stampBias) *
          inkScale;
        if (stampBias > 0.01) alpha = Math.max(alpha, lerp(0.34, 0.78, stampBias) * inkScale);
        alpha = clamp(alpha, 0, 0.96);
        const dirX = model.dirX;
        const dirY = model.dirY;
        const center = contactCenter(x, y, model);
        const perpX = -dirY;
        const perpY = dirX;

        if (liveCleanInkMode(model)) {
          const cleanModel = {
            ...model,
            wedge: Math.min(model.wedge || 0, 0.12),
            fan: Math.min(model.fan || 0, 0.08),
            belly: Math.min(model.belly || 0, 0.18),
            bendAmount: Math.min(model.bendAmount || 0, 0.18),
          };
          ctx.save();
          ctx.fillStyle = "#111411";
          ctx.globalCompositeOperation = "source-over";
          ctx.globalAlpha = livePenInkMode(model) ? 1 : clamp(Math.max(alpha, 0.82 * inkScale), 0, 1);
          ctx.fill(contactPath(center.x, center.y, cleanModel, lerp(0.96, 0.86, pointed)));
          ctx.restore();
          return;
        }

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalAlpha = alpha;

        if (split) {
          const gap = model.width * stampScale * clamp(0.12 + settings.roughness * 0.15, 0.08, 0.3);
          const left = { ...model, width: model.width * 0.43, length: model.length * 0.96 };
          const right = { ...model, width: model.width * 0.38, length: model.length * 0.9 };
          ctx.fill(contactPath(center.x + perpX * gap, center.y + perpY * gap, left, stampScale));
          ctx.globalAlpha = alpha * 0.84;
          ctx.fill(contactPath(center.x - perpX * gap * 1.1, center.y - perpY * gap * 1.1, right, stampScale));
        } else {
          const mantle = mantleModel(model);
          const core = coreModel(model);
          ctx.globalAlpha = alpha * lerp(0.16, 0.34, clamp(model.belly || 0, 0, 1));
          ctx.fill(contactPath(center.x, center.y, mantle, stampScale));
          ctx.globalAlpha = alpha;
          ctx.fill(contactPath(center.x, center.y, core, stampScale));
        }

        if (settings.roughness >= 0.08 && model.width > 5) {
          const flecks = Math.floor(1 + settings.roughness * 5);
          ctx.strokeStyle = "#111411";
          ctx.lineCap = pointed > 0.5 ? "butt" : "round";
          for (let i = 0; i < flecks; i += 1) {
            const along = (Math.random() - 0.6) * model.length * 0.72;
            const side = (Math.random() - 0.5) * model.width * 0.85;
            const strand = Math.max(1.4, model.width * (0.05 + Math.random() * 0.1));
            ctx.globalAlpha = alpha * settings.roughness * (0.08 + Math.random() * 0.16);
            ctx.lineWidth = Math.max(0.35, model.width * (0.012 + Math.random() * 0.02));
            ctx.beginPath();
            ctx.moveTo(
              x + dirX * along + perpX * side,
              y + dirY * along + perpY * side,
            );
            ctx.lineTo(
              x + dirX * (along + strand) + perpX * (side * lerp(0.96, 0.62, pointed)),
              y + dirY * (along + strand) + perpY * (side * lerp(0.96, 0.62, pointed)),
            );
            ctx.stroke();
          }
        }

        drawDryCuts(ctx, x, y, model);
        ctx.restore();
      }

      function drawOverlay(x = null, y = null) {
        const rect = stage.getBoundingClientRect();
        overlay.clearRect(0, 0, rect.width, rect.height);
        if (!settings.showPatch || !brush.drawing || x === null || y === null) return;

        const model = {
          dirX: brush.dirX,
          dirY: brush.dirY,
          width: brush.width,
          length: brush.length,
          wedge: brush.wedge,
          pointed: brush.pointed,
          fan: brush.fan,
          heelOffset: brush.heelOffset,
          bendX: brush.bendX,
          bendY: brush.bendY,
          bendAmount: brush.bendAmount,
          rootLoad: brush.rootLoad,
          slip: brush.slip,
        };
        const center = contactCenter(x, y, model);
        const path = contactPath(center.x, center.y, model);
        overlay.save();
        overlay.fillStyle = "rgba(215, 119, 44, 0.22)";
        overlay.strokeStyle = "rgba(126, 61, 12, 0.72)";
        overlay.lineWidth = 1.5;
        overlay.fill(path);
        overlay.stroke(path);
        overlay.strokeStyle = "rgba(40, 32, 20, 0.5)";
        overlay.lineWidth = 1;
        overlay.beginPath();
        overlay.moveTo(x - brush.dirX * brush.length * 0.66, y - brush.dirY * brush.length * 0.66);
        overlay.lineTo(x + brush.dirX * brush.length * 0.46, y + brush.dirY * brush.length * 0.46);
        overlay.stroke();
        overlay.fillStyle = "rgba(30, 24, 16, 0.62)";
        overlay.beginPath();
        overlay.arc(x, y, 2.2, 0, Math.PI * 2);
        overlay.fill();
        overlay.restore();
      }

      function updateHud() {
        outputs.hudPressure.textContent = brush.pressure.toFixed(2);
        outputs.hudSpeed.textContent = Math.round(brush.speed * 1000).toString();
        outputs.hudWidth.textContent = `${Math.round(brush.width)}px`;
        outputs.hudLength.textContent = `${Math.round(brush.length)}px`;
        outputs.logPointer.textContent = brush.pointerType;
        outputs.logTilt.textContent = `${Math.round(brush.tiltX)} / ${Math.round(brush.tiltY)}`;
        outputs.logTwist.textContent = Math.round(brush.twist).toString();
        outputs.logSamples.textContent = brush.sampleCount.toString();
      }

      function smoothLivePenSample(sample) {
        if (sample.pointerType !== "pen" || !liveCleanInkMode(sample)) return sample;
        if (!brush.filteredSample) {
          brush.filteredSample = { ...sample };
          return sample;
        }

        const prev = brush.filteredSample;
        const distance = hypot(sample.x - prev.x, sample.y - prev.y);
        const positionResponse = clamp(distance / 7.5, 0.16, 0.74);
        const pressureResponse = distance > 1.2 ? 0.32 : 0.18;
        const tiltResponse = 0.08;
        const smoothed = {
          ...sample,
          x: lerp(prev.x, sample.x, positionResponse),
          y: lerp(prev.y, sample.y, positionResponse),
          pressure: lerp(prev.pressure, sample.pressure, pressureResponse),
          tiltX: lerp(prev.tiltX, sample.tiltX, tiltResponse),
          tiltY: lerp(prev.tiltY, sample.tiltY, tiltResponse),
        };
        brush.filteredSample = smoothed;
        return smoothed;
      }

      function processSample(sample) {
        sample = smoothLivePenSample(sample);
        if (!brush.last) {
          brush.last = sample;
          const target = targetShape(sample, null);
          brush.dirX = target.dirX;
          brush.dirY = target.dirY;
          brush.width = target.width;
          brush.length = target.length;
          brush.wedge = target.wedge;
          settleBrush(target);
          drawFootprint(ink, sample.x, sample.y, brush);
          {
            const center = contactCenter(sample.x, sample.y, brush);
            brush.inkPoint = { x: center.x, y: center.y, width: bridgeInkWidth(brush), inkScale: brush.inkScale };
          }
          brush.stampTravel = 0;
          drawOverlay(sample.x, sample.y);
          updateHud();
          return;
        }

        const previous = brush.last;
        const distance = hypot(sample.x - previous.x, sample.y - previous.y);
        const livePenSample = sample.pointerType === "pen" || previous.pointerType === "pen";
        if (
          livePenSample &&
          distance < 0.45 &&
          Math.abs(sample.pressure - previous.pressure) < 0.012 &&
          Math.abs(sample.tiltX - previous.tiltX) < 0.8 &&
          Math.abs(sample.tiltY - previous.tiltY) < 0.8
        ) {
          brush.last = sample;
          return;
        }
        const stampSpacing = livePenSample ? clamp(brush.width * 0.08, 1.8, 4.0) : clamp(brush.width * 0.03, 0.75, 1.45);
        const steps = Math.max(1, Math.ceil(distance / stampSpacing));

        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps;
          const point = {
            x: lerp(previous.x, sample.x, t),
            y: lerp(previous.y, sample.y, t),
            t: lerp(previous.t, sample.t, t),
            pressure: lerp(previous.pressure, sample.pressure, t),
            tiltX: lerp(previous.tiltX, sample.tiltX, t),
            tiltY: lerp(previous.tiltY, sample.tiltY, t),
            twist: lerp(previous.twist, sample.twist, t),
            axisX: sample.axisX ?? previous.axisX ?? null,
            axisY: sample.axisY ?? previous.axisY ?? null,
            axisBias: lerp(previous.axisBias || 0, sample.axisBias || 0, t),
            pointedBias: lerp(previous.pointedBias || 0, sample.pointedBias || 0, t),
            inkScale: lerp(previous.inkScale ?? 1, sample.inkScale ?? 1, t),
            bellyBias: lerp(previous.bellyBias || 0, sample.bellyBias || 0, t),
            fanBias: lerp(previous.fanBias || 0, sample.fanBias || 0, t),
            shapeBias: lerp(previous.shapeBias || 0, sample.shapeBias || 0, t),
            rootBias: lerp(previous.rootBias || 0, sample.rootBias || 0, t),
            slipBias: lerp(previous.slipBias || 0, sample.slipBias || 0, t),
            stampBias: lerp(previous.stampBias || 0, sample.stampBias || 0, t),
            capBias: lerp(previous.capBias || 0, sample.capBias || 0, t),
            cornerBias: lerp(previous.cornerBias || 0, sample.cornerBias || 0, t),
            pointerType: sample.pointerType,
          };
          const target = targetShape(point, brush.last);
          settleBrush(target);
          const stepDistance = brush.inkPoint ? hypot(point.x - brush.inkPoint.x, point.y - brush.inkPoint.y) : 0;
          const stationaryContact = brush.speed < 0.006 && stepDistance < Math.max(1.2, brush.width * 0.035);
          const pressureBloom =
            stationaryContact &&
            brush.inkScale > 0.35 &&
            (brush.last.inkScale ?? 1) > 0.35 &&
            Math.abs(point.pressure - brush.last.pressure) > 0.035;
          drawWetBridge(ink, brush.inkPoint, point, brush);
          brush.stampTravel += stepDistance;
          const footprintGap = clamp(brush.width * lerp(0.58, 0.96, brush.pointed), 12, 30);
          const stampFootprint =
            brush.stampBias > 0.18 &&
            stationaryContact &&
            brush.stampTravel >= Math.max(2.8, footprintGap * lerp(0.72, 0.32, brush.stampBias));
          const pausedForContact = stationaryContact && brush.stampTravel >= footprintGap;
          const needsFootprint =
            !liveCleanInkMode() &&
            (pressureBloom ||
              stampFootprint ||
              (pausedForContact &&
                brush.capBias < 0.55 &&
                ((settings.roughness > 0.1 && brush.turnHold > 0.78) || brush.pressure < 0.06 || brush.rootLoad > 0.46)));
          if (needsFootprint) {
            drawFootprint(ink, point.x, point.y, brush);
            brush.stampTravel = 0;
          }
          {
            const center = contactCenter(point.x, point.y, brush);
            brush.inkPoint = { x: center.x, y: center.y, width: bridgeInkWidth(brush), inkScale: brush.inkScale };
          }
          brush.last = point;
          brush.sampleCount += 1;
        }

        brush.last = sample;
        drawOverlay(sample.x, sample.y);
        updateHud();
      }

      function resetModelState() {
        brush.last = null;
        brush.filteredSample = null;
        brush.inkPoint = null;
        brush.dirX = 0;
        brush.dirY = -1;
        brush.width = 4;
        brush.length = 4;
        brush.wedge = 0;
        brush.pointed = 0;
        brush.speed = 0;
        brush.stableTiltX = 0;
        brush.stableTiltY = -1;
        brush.stableTiltMag = 0;
        brush.stableTiltReady = false;
        brush.obliqueHold = 0;
        brush.turnHold = 0;
        brush.shapeIntent = 0;
        brush.stampTravel = 0;
        brush.stampBias = 0;
        brush.inkScale = 1;
        brush.belly = 0;
        brush.fan = 0;
        brush.heelOffset = 0;
        brush.bendX = 0;
        brush.bendY = 0;
        brush.bendAmount = 0;
        brush.rootLoad = 0;
        brush.slip = 0;
        brush.capBias = 0;
        brush.cornerBias = 0;
      }

      function simulateModel(samples) {
        resetModelState();
        for (const sample of samples) {
          const target = targetShape(sample, brush.last);
          settleBrush(target);
          brush.last = sample;
        }
        return {
          dirX: brush.dirX,
          dirY: brush.dirY,
          width: brush.width,
          length: brush.length,
          wedge: brush.wedge,
          pointed: brush.pointed,
          belly: brush.belly,
          fan: brush.fan,
          heelOffset: brush.heelOffset,
          bendX: brush.bendX,
          bendY: brush.bendY,
          bendAmount: brush.bendAmount,
          rootLoad: brush.rootLoad,
          slip: brush.slip,
          pressure: brush.pressure,
          speed: brush.speed,
          stableTiltMag: brush.stableTiltMag,
          obliqueHold: brush.obliqueHold,
          turnHold: brush.turnHold,
          shapeIntent: brush.shapeIntent,
        };
      }

      function onPointerDown(event) {
        if (brush.drawing) return;
        event.preventDefault();
        overlayCanvas.setPointerCapture(event.pointerId);
        brush.drawing = true;
        brush.pointerId = event.pointerId;
        resetModelState();
        const sample = extractSample(event);
        processSample(sample);
      }

      function onPointerMove(event) {
        if (!brush.drawing || event.pointerId !== brush.pointerId) return;
        event.preventDefault();
        const events =
          typeof event.getCoalescedEvents === "function" && event.getCoalescedEvents().length
            ? event.getCoalescedEvents()
            : [event];
        for (const coalesced of events) processSample(extractSample(coalesced, event.pointerType));
      }

      function finishStroke(event) {
        if (!brush.drawing || event.pointerId !== brush.pointerId) return;
        brush.drawing = false;
        brush.pointerId = null;
        brush.last = null;
        const rect = stage.getBoundingClientRect();
        overlay.clearRect(0, 0, rect.width, rect.height);
        updateHud();
      }

      for (const input of Object.values(controls)) {
        input.addEventListener("input", syncSettings);
        input.addEventListener("change", syncSettings);
      }
      document.getElementById("clearButton").addEventListener("click", clearInk);
      document.getElementById("saveButton").addEventListener("click", exportPng);
      document.getElementById("demoButton").addEventListener("click", runYongDemo);
      document.getElementById("softPreset").addEventListener("click", () => applyPreset("soft"));
      document.getElementById("firmPreset").addEventListener("click", () => applyPreset("firm"));

      overlayCanvas.addEventListener("pointerdown", onPointerDown, { passive: false });
      overlayCanvas.addEventListener("pointermove", onPointerMove, { passive: false });
      overlayCanvas.addEventListener("pointerup", finishStroke, { passive: false });
      overlayCanvas.addEventListener("pointercancel", finishStroke, { passive: false });
      overlayCanvas.addEventListener("contextmenu", (event) => event.preventDefault());
      window.addEventListener("resize", resizeCanvases);
      window.addEventListener("orientationchange", () => window.setTimeout(resizeCanvases, 180));

      window.BiMoDebug = { simulate: simulateModel, runYongDemo, runDragDemo, runNaiStudyDemo, runLiveCleanDemo };

      syncSettings();
      resizeCanvases();
      updateHud();
      const demoParam = new URLSearchParams(window.location.search).get("demo");
      if (demoParam === "yong") {
        requestAnimationFrame(() => runYongDemo());
      } else if (demoParam === "drag") {
        requestAnimationFrame(() => runDragDemo());
      } else if (demoParam === "nai-study") {
        requestAnimationFrame(() => runNaiStudyDemo());
      } else if (demoParam === "live-clean") {
        requestAnimationFrame(() => runLiveCleanDemo());
      }
    </script>
  </body>
</html>
