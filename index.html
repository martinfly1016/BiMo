<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BiMo" />
    <title>BiMo - 毛笔接触面测试台</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #151715;
        --paper: #edf7f4;
        --paper-deep: #d8e7e0;
        --panel: #27231d;
        --panel-2: #343027;
        --line: rgba(255, 255, 255, 0.16);
        --text: #f7f2e8;
        --muted: #c9bfab;
        --accent: #d7963c;
        --accent-2: #f1bf62;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        touch-action: none;
        background: #171511;
        font-family:
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        height: 100dvh;
        min-height: 100vh;
        background: #171511;
      }

      .stage {
        position: relative;
        min-width: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.42), transparent 23%),
          linear-gradient(135deg, rgba(40, 98, 92, 0.08), rgba(255, 255, 255, 0.24)),
          repeating-linear-gradient(0deg, rgba(160, 56, 58, 0.22) 0 1.4px, transparent 1.4px 220px),
          repeating-linear-gradient(90deg, rgba(160, 56, 58, 0.2) 0 1.4px, transparent 1.4px 220px),
          repeating-linear-gradient(0deg, rgba(55, 112, 105, 0.06) 0 1px, transparent 1px 44px),
          repeating-linear-gradient(90deg, rgba(55, 112, 105, 0.05) 0 1px, transparent 1px 44px),
          var(--paper);
      }

      canvas {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #overlay {
        cursor: crosshair;
      }

      .topbar {
        position: absolute;
        top: max(14px, env(safe-area-inset-top));
        left: max(14px, env(safe-area-inset-left));
        right: 14px;
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        pointer-events: none;
      }

      .brand,
      .readout {
        border: 1px solid rgba(60, 47, 28, 0.16);
        background: rgba(246, 239, 223, 0.78);
        box-shadow: 0 12px 36px rgba(37, 28, 15, 0.12);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        color: #211b14;
      }

      .brand {
        padding: 10px 12px;
        max-width: 380px;
      }

      .brand h1 {
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
        font-weight: 720;
        letter-spacing: 0;
      }

      .brand p {
        margin: 4px 0 0;
        color: #5f5140;
        font-size: 12px;
        line-height: 1.35;
      }

      .readout {
        display: grid;
        grid-template-columns: repeat(2, minmax(78px, 1fr));
        gap: 1px;
        overflow: hidden;
        min-width: 236px;
        padding: 1px;
      }

      .metric {
        padding: 8px 9px;
        background: rgba(255, 252, 244, 0.58);
      }

      .metric span {
        display: block;
        color: #7c6d59;
        font-size: 10px;
        line-height: 1;
      }

      .metric strong {
        display: block;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
        font-size: 13px;
        line-height: 1;
      }

      .panel {
        position: relative;
        z-index: 5;
        display: flex;
        flex-direction: column;
        min-width: 0;
        height: 100%;
        padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
        border-left: 1px solid rgba(255, 255, 255, 0.1);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.05), transparent 32%),
          var(--panel);
        color: var(--text);
      }

      .panel header {
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .panel h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 740;
        letter-spacing: 0;
      }

      .panel .sub {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 14px 0;
      }

      .button {
        min-height: 42px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        background: var(--panel-2);
        color: var(--text);
        font-weight: 680;
        letter-spacing: 0;
      }

      .button.primary {
        border-color: rgba(241, 191, 98, 0.42);
        background: #7f5420;
        color: #fff8eb;
      }

      .button:active {
        transform: translateY(1px);
        filter: brightness(1.08);
      }

      .sections {
        overflow: auto;
        min-height: 0;
        padding-right: 2px;
        -webkit-overflow-scrolling: touch;
      }

      .section {
        padding: 14px 0;
        border-top: 1px solid var(--line);
      }

      .section:first-child {
        border-top: 0;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
        color: #fff9ed;
        font-size: 12px;
        font-weight: 760;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .control {
        display: grid;
        grid-template-columns: 94px minmax(0, 1fr) 40px;
        align-items: center;
        gap: 10px;
        min-height: 34px;
        color: var(--muted);
        font-size: 12px;
      }

      .control + .control {
        margin-top: 10px;
      }

      .control output {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        text-align: right;
      }

      input[type="range"] {
        width: 100%;
        accent-color: var(--accent-2);
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 36px;
        color: var(--muted);
        font-size: 12px;
      }

      .switch {
        position: relative;
        display: inline-block;
        width: 48px;
        height: 28px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
        inset: 0;
      }

      .slider {
        position: absolute;
        inset: 0;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: #1c1a16;
      }

      .slider::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #ddd2be;
        transition: transform 140ms ease;
      }

      .switch input:checked + .slider {
        background: #8e5f22;
      }

      .switch input:checked + .slider::after {
        transform: translateX(20px);
        background: #fff5df;
      }

      .mini-log {
        display: grid;
        gap: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .log-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        min-width: 0;
      }

      .log-row strong {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        font-weight: 650;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) 248px;
        }

        .panel {
          border-left: 0;
          border-top: 1px solid rgba(255, 255, 255, 0.12);
          padding: 12px max(14px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom))
            max(14px, env(safe-area-inset-left));
        }

        .panel header,
        .panel .sub,
        .readout {
          display: none;
        }

        .actions {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          padding: 0 0 10px;
        }

        .sections {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 0 16px;
        }

        .section {
          padding: 8px 0;
        }

        .brand {
          max-width: 320px;
        }
      }

      @media (max-width: 560px) {
        .app {
          grid-template-rows: minmax(0, 1fr) 310px;
        }

        .sections {
          grid-template-columns: 1fr;
        }

        .actions {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .brand p {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <main class="stage" id="stage">
        <canvas id="inkCanvas" aria-label="ink canvas"></canvas>
        <canvas id="overlayCanvas" aria-label="brush contact overlay"></canvas>
        <div class="topbar">
          <section class="brand">
            <h1>BiMo 毛笔接触面测试台</h1>
            <p>压力生成铺开面积，拖动和倾斜生成楔形接触面。</p>
          </section>
          <section class="readout" aria-live="polite">
            <div class="metric"><span>压力</span><strong id="hudPressure">0.00</strong></div>
            <div class="metric"><span>速度</span><strong id="hudSpeed">0</strong></div>
            <div class="metric"><span>宽度</span><strong id="hudWidth">0</strong></div>
            <div class="metric"><span>长度</span><strong id="hudLength">0</strong></div>
          </section>
        </div>
      </main>

      <aside class="panel">
        <header>
          <h2>BiMo Contact Patch v10.32</h2>
          <p class="sub">用 Apple Pencil 直接在纸面区域写。非 Pencil 输入会使用模拟压力。</p>
        </header>

        <div class="actions">
          <button class="button primary" id="clearButton" type="button">清空</button>
          <button class="button" id="saveButton" type="button">导出</button>
          <button class="button" id="demoButton" type="button">永字演示</button>
          <button class="button" id="softPreset" type="button">软毫</button>
          <button class="button" id="firmPreset" type="button">硬毫</button>
        </div>

        <div class="sections">
          <section class="section">
            <div class="section-title">显示</div>
            <label class="toggle-row">
              <span>实时接触面</span>
              <span class="switch">
                <input id="showPatch" type="checkbox" />
                <span class="slider"></span>
              </span>
            </label>
            <label class="toggle-row">
              <span>飞白切割</span>
              <span class="switch">
                <input id="dryCut" type="checkbox" />
                <span class="slider"></span>
              </span>
            </label>
          </section>

          <section class="section">
            <div class="section-title">笔头</div>
            <label class="control">
              <span>尺寸</span>
              <input id="size" type="range" min="18" max="82" step="1" value="42" />
              <output id="sizeOut">42</output>
            </label>
            <label class="control">
              <span>形变</span>
              <input id="deform" type="range" min="0" max="1.8" step="0.01" value="1.00" />
              <output id="deformOut">1.00</output>
            </label>
            <label class="control">
              <span>滞后</span>
              <input id="lag" type="range" min="0" max="0.92" step="0.01" value="0.42" />
              <output id="lagOut">0.42</output>
            </label>
          </section>

          <section class="section">
            <div class="section-title">墨迹</div>
            <label class="control">
              <span>浓度</span>
              <input id="density" type="range" min="0.06" max="0.5" step="0.01" value="0.20" />
              <output id="densityOut">0.20</output>
            </label>
            <label class="control">
              <span>边缘</span>
              <input id="roughness" type="range" min="0" max="0.9" step="0.01" value="0.04" />
              <output id="roughnessOut">0.04</output>
            </label>
            <label class="control">
              <span>飞白</span>
              <input id="dryness" type="range" min="0" max="0.85" step="0.01" value="0" />
              <output id="drynessOut">0</output>
            </label>
          </section>

          <section class="section">
            <div class="section-title">输入</div>
            <label class="toggle-row">
              <span>反转倾斜</span>
              <span class="switch">
                <input id="invertTilt" type="checkbox" checked />
                <span class="slider"></span>
              </span>
            </label>
            <label class="control">
              <span>倾斜旋转</span>
              <input id="tiltRotation" type="range" min="-180" max="180" step="90" value="-90" />
              <output id="tiltRotationOut">-90</output>
            </label>
            <label class="control">
              <span>倾斜稳定</span>
              <input id="tiltStability" type="range" min="0" max="0.95" step="0.01" value="0.82" />
              <output id="tiltStabilityOut">0.82</output>
            </label>
            <label class="control">
              <span>倾斜影响</span>
              <input id="tiltInfluence" type="range" min="0" max="1" step="0.01" value="0.42" />
              <output id="tiltInfluenceOut">0.42</output>
            </label>
            <label class="control">
              <span>鼠标压力</span>
              <input id="mousePressure" type="range" min="0.04" max="1" step="0.01" value="0.48" />
              <output id="mousePressureOut">0.48</output>
            </label>
            <div class="mini-log">
              <div class="log-row"><span>Pointer</span><strong id="logPointer">-</strong></div>
              <div class="log-row"><span>Tilt</span><strong id="logTilt">0 / 0</strong></div>
              <div class="log-row"><span>Twist</span><strong id="logTwist">0</strong></div>
              <div class="log-row"><span>Samples</span><strong id="logSamples">0</strong></div>
            </div>
          </section>
        </div>
      </aside>
    </div>

    <script>
      const stage = document.getElementById("stage");
      const inkCanvas = document.getElementById("inkCanvas");
      const overlayCanvas = document.getElementById("overlayCanvas");
      const ink = inkCanvas.getContext("2d", { alpha: true });
      const overlay = overlayCanvas.getContext("2d", { alpha: true });

      const controls = {
        showPatch: document.getElementById("showPatch"),
        dryCut: document.getElementById("dryCut"),
        invertTilt: document.getElementById("invertTilt"),
        tiltRotation: document.getElementById("tiltRotation"),
        tiltStability: document.getElementById("tiltStability"),
        tiltInfluence: document.getElementById("tiltInfluence"),
        size: document.getElementById("size"),
        deform: document.getElementById("deform"),
        lag: document.getElementById("lag"),
        density: document.getElementById("density"),
        roughness: document.getElementById("roughness"),
        dryness: document.getElementById("dryness"),
        mousePressure: document.getElementById("mousePressure"),
      };

      const outputs = {
        size: document.getElementById("sizeOut"),
        deform: document.getElementById("deformOut"),
        lag: document.getElementById("lagOut"),
        density: document.getElementById("densityOut"),
        roughness: document.getElementById("roughnessOut"),
        dryness: document.getElementById("drynessOut"),
        tiltRotation: document.getElementById("tiltRotationOut"),
        tiltStability: document.getElementById("tiltStabilityOut"),
        tiltInfluence: document.getElementById("tiltInfluenceOut"),
        mousePressure: document.getElementById("mousePressureOut"),
        hudPressure: document.getElementById("hudPressure"),
        hudSpeed: document.getElementById("hudSpeed"),
        hudWidth: document.getElementById("hudWidth"),
        hudLength: document.getElementById("hudLength"),
        logPointer: document.getElementById("logPointer"),
        logTilt: document.getElementById("logTilt"),
        logTwist: document.getElementById("logTwist"),
        logSamples: document.getElementById("logSamples"),
      };

      const settings = {
        showPatch: false,
        dryCut: false,
        invertTilt: true,
        tiltRotation: -90,
        tiltStability: 0.82,
        tiltInfluence: 0.42,
        size: 42,
        deform: 1,
        lag: 0.42,
        density: 0.2,
        roughness: 0.04,
        dryness: 0,
        mousePressure: 0.48,
      };

      const brush = {
        drawing: false,
        pointerId: null,
        last: null,
        filteredSample: null,
        inkPoint: null,
        sampleCount: 0,
        dirX: 0,
        dirY: -1,
        width: 4,
        length: 4,
        wedge: 0,
        pointed: 0,
        pressure: 0,
        speed: 0,
        tiltX: 0,
        tiltY: 0,
        stableTiltX: 0,
        stableTiltY: -1,
        stableTiltMag: 0,
        stableTiltReady: false,
        obliqueHold: 0,
        turnHold: 0,
        shapeIntent: 0,
        stampTravel: 0,
        stampBias: 0,
        inkScale: 1,
        belly: 0,
        fan: 0,
        heelOffset: 0,
        bendX: 0,
        bendY: 0,
        bendAmount: 0,
        rootLoad: 0,
        slip: 0,
        capBias: 0,
        cornerBias: 0,
        twist: 0,
        pointerType: "-",
      };

      let demoInkMode = false;
      let singleFaceInkMode = false;

      const finite = (value, fallback = 0) => (Number.isFinite(value) ? value : fallback);
      const clamp = (value, min, max) => Math.min(max, Math.max(min, finite(value, min)));
      const lerp = (a, b, t) => a + (b - a) * t;
      const hypot = Math.hypot;

      function normalize(x, y, fallbackX = 0, fallbackY = -1) {
        x = finite(x, fallbackX);
        y = finite(y, fallbackY);
        const length = hypot(x, y);
        if (!Number.isFinite(length) || length < 0.0001) return { x: fallbackX, y: fallbackY };
        return { x: x / length, y: y / length };
      }

      function smoothstep(edge0, edge1, value) {
        const t = clamp((value - edge0) / (edge1 - edge0), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function liveCleanInkMode(modelOrSample = null) {
        const isPen = modelOrSample?.pointerType === "pen" || brush.pointerType === "pen";
        return !demoInkMode && !singleFaceInkMode && !settings.dryCut && (isPen || settings.roughness < 0.2);
      }

      function livePenInkMode(modelOrSample = null) {
        return liveCleanInkMode(modelOrSample) && (modelOrSample?.pointerType === "pen" || brush.pointerType === "pen");
      }

      function syncSettings() {
        settings.showPatch = controls.showPatch.checked;
        settings.dryCut = controls.dryCut.checked;
        settings.invertTilt = controls.invertTilt.checked;
        for (const key of [
          "size",
          "deform",
          "lag",
          "density",
          "roughness",
          "dryness",
          "tiltRotation",
          "tiltStability",
          "tiltInfluence",
          "mousePressure",
        ]) {
          const parsed = Number(controls[key].value);
          settings[key] = Number.isFinite(parsed) ? parsed : settings[key];
          if (!Number.isFinite(parsed)) controls[key].value = String(settings[key]);
          const decimals = key === "size" || key === "tiltRotation" ? 0 : 2;
          outputs[key].textContent = settings[key].toFixed(decimals);
        }
      }

      function applyPreset(kind) {
        const preset =
          kind === "soft"
            ? { size: 52, deform: 1.42, lag: 0.56, density: 0.17, roughness: 0.3, dryness: 0.36 }
            : { size: 34, deform: 0.58, lag: 0.24, density: 0.23, roughness: 0.16, dryness: 0.16 };
        for (const [key, value] of Object.entries(preset)) controls[key].value = String(value);
        syncSettings();
      }

      function resizeCanvases() {
        const rect = stage.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
        for (const canvas of [inkCanvas, overlayCanvas]) {
          const oldWidth = canvas.width;
          const oldHeight = canvas.height;
          const old = oldWidth && oldHeight ? document.createElement("canvas") : null;
          if (old) {
            old.width = oldWidth;
            old.height = oldHeight;
            old.getContext("2d").drawImage(canvas, 0, 0);
          }
          canvas.width = Math.max(1, Math.round(rect.width * dpr));
          canvas.height = Math.max(1, Math.round(rect.height * dpr));
          const ctx = canvas.getContext("2d");
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          if (old && canvas === inkCanvas) {
            ctx.drawImage(old, 0, 0, oldWidth / dpr, oldHeight / dpr, 0, 0, rect.width, rect.height);
          }
        }
        drawOverlay();
      }

      function clearInk() {
        const rect = stage.getBoundingClientRect();
        ink.clearRect(0, 0, rect.width, rect.height);
        overlay.clearRect(0, 0, rect.width, rect.height);
      }

      function cubicPoint(a, b, c, d, t) {
        const mt = 1 - t;
        return mt * mt * mt * a + 3 * mt * mt * t * b + 3 * mt * t * t * c + t * t * t * d;
      }

      function pressureCurve(t, start, middle, end) {
        return t < 0.5 ? lerp(start, middle, smoothstep(0, 0.5, t)) : lerp(middle, end, smoothstep(0.5, 1, t));
      }

      function valueFromStops(t, stops) {
        if (!stops || !stops.length) return null;
        if (t <= stops[0][0]) return stops[0][1];
        for (let i = 1; i < stops.length; i += 1) {
          const [at, value] = stops[i];
          if (t <= at) {
            const [prevAt, prevValue] = stops[i - 1];
            return lerp(prevValue, value, smoothstep(prevAt, at, t));
          }
        }
        return stops[stops.length - 1][1];
      }

      function makeDemoStroke(points, options = {}) {
        const samples = [];
        const steps = options.steps || Math.max(18, Math.ceil(hypot(points[3].x - points[0].x, points[3].y - points[0].y) / 3.4));
        for (let i = 0; i <= steps; i += 1) {
          const t = i / steps;
          const stoppedPressure = valueFromStops(t, options.pressureStops);
          const pressure =
            stoppedPressure ??
            (options.pressure
              ? options.pressure(t)
              : pressureCurve(t, options.startPressure ?? 0.18, options.midPressure ?? 0.68, options.endPressure ?? 0.18));
          const stoppedPointed = valueFromStops(t, options.pointedStops);
          const stoppedInk = valueFromStops(t, options.inkStops);
          const stoppedCap = valueFromStops(t, options.capStops);
          const stoppedCorner = valueFromStops(t, options.cornerStops);
          const stoppedBelly = valueFromStops(t, options.bellyStops);

            [0.66, { pressure: 0.42, pointed: 0.18, belly: 0.24, fan: 0.16, root: 0.08, slip: 0.28, shape: 0.08, ink: 0.9 }],
            [1, { pressure: 0.08, pointed: 0.82, belly: 0.012, fan: 0, slip: 0.68, cap: 0.58, ink: 0.64 }],
          ],
          firmCenter: [
            [0, { pressure: 0.42, pointed: 0.04, belly: 0.24, fan: 0.16, root: 0.14, corner: 0.26 }],
            [0.22, { pressure: 0.5, pointed: 0.02, belly: 0.36, fan: 0.22, root: 0.2, slip: 0.06 }],
            [0.76, { pressure: 0.44, pointed: 0.04, belly: 0.28, fan: 0.16, root: 0.14, slip: 0.16 }],
            [1, { pressure: 0.48, pointed: 0.08, belly: 0.22, fan: 0.12, root: 0.1, corner: 0.48 }],
          ],
        };
        const phases = templates[kind] || templates.pressRun;
        const pressureScale = options.pressureScale ?? 1;
        const widthBias = options.widthBias ?? 0;
        const inkScale = options.inkScale ?? 1;
        return phases.map(([at, phase]) => [
          at,
          {
            ...phase,
            pressure: clamp((phase.pressure ?? 0.1) * pressureScale, 0.02, 1),
            belly: clamp((phase.belly ?? 0) + widthBias, 0, 1),
            fan: clamp((phase.fan ?? 0) + widthBias * 0.82, 0, 1),
            ink: clamp((phase.ink ?? 1) * inkScale, 0, 1),

        ]);

      function envelopeTaper(t, options = {}) {
        const start = options.start ?? 0.42;
        const end = options.end ?? 0.54;
        return lerp(start, 1, smoothstep(0, 0.22, t)) * lerp(1, end, smoothstep(0.78, 1, t));
      }

      function drawEnvelopePath(ctx, marks, halfScale, alpha, options = {}) {
        if (marks.length < 2 || alpha <= 0) return;
        const left = [];
        const right = [];
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          const prev = marks[Math.max(0, i - 1)];
          const next = marks[Math.min(marks.length - 1, i + 1)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const taper = options.taper ? envelopeTaper(t, options) : 1;
          const terminal = options.terminalPad ? smoothstep(0.78, 1, t) : 0;
          const half = mark.half * halfScale * taper * lerp(0.88, 1.12, mark.pressure) * lerp(1, 1.24, terminal);
          const sideBias = clamp(options.sideBias || 0, -0.42, 0.42);
          const leftHalf = half * (1 + sideBias);
          const rightHalf = half * (1 - sideBias * 0.72);
          left.push({ x: mark.x + perpX * leftHalf, y: mark.y + perpY * leftHalf });
          right.push({ x: mark.x - perpX * rightHalf, y: mark.y - perpY * rightHalf });
        }
        ctx.globalAlpha = alpha;
        ctx.beginPath();
        ctx.moveTo(left[0].x, left[0].y);
        for (let i = 1; i < left.length; i += 1) ctx.lineTo(left[i].x, left[i].y);
        for (let i = right.length - 1; i >= 0; i -= 1) ctx.lineTo(right[i].x, right[i].y);
        ctx.closePath();
        ctx.fill();
      }

      function drawSweepWetSurface(ctx, marks, alpha, options = {}) {
        if (marks.length < 4 || alpha <= 0) return;
        const lower = [];
        const upper = [];
        const lowerScale = options.lowerScale ?? 1;
        const upperScale = options.upperScale ?? 1;
        const bellyScale = options.bellyScale ?? 1;
        const liftEnd = options.liftEnd ?? 0.22;
        const bristleShape = options.bristleShape ?? 0;
        const bristleStart = options.bristleStart ?? 0.56;
        const bristleSpacing = options.bristleSpacing ?? 0.18;
        const pressStart = options.pressStart ?? 0.08;
        const pressPeak = options.pressPeak ?? 0.48;
        const bellyStart = options.bellyStart ?? 0.18;
        const bellyPeak = options.bellyPeak ?? 0.58;
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          if (t < 0.08 || t > 0.98) continue;
          const prev = marks[Math.max(0, i - 1)];
          const next = marks[Math.min(marks.length - 1, i + 1)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const press = smoothstep(pressStart, pressPeak, t) * lerp(1, 0.58, smoothstep(0.7, 1, t));
          const lift = lerp(1, liftEnd, smoothstep(0.72, 1, t));
          const belly = smoothstep(bellyStart, bellyPeak, t) * lerp(1, 0.62, smoothstep(0.72, 1, t)) * bellyScale;
          const base = mark.half * lerp(0.96, 1.24, mark.pressure) * lift;
          const lowerBristle = bristleShape
            ? smoothstep(bristleStart, 0.92, t) * (0.72 + 0.28 * Math.sin((t - bristleStart) * Math.PI / Math.max(0.08, 1 - bristleStart) * 3 + 0.6))
            : 0;
          const lowerHalf =
            base *
            lerp(0.62, 1.26, belly) *
            lerp(0.84, 1.06, press) *
            lowerScale *
            (1 + lowerBristle * bristleShape * bristleSpacing);
          const upperHalf = base * lerp(0.58, 0.86, press) * lerp(1, 0.58, smoothstep(0.72, 1, t)) * upperScale;
          lower.push({ x: mark.x + perpX * lowerHalf, y: mark.y + perpY * lowerHalf });
          upper.push({ x: mark.x - perpX * upperHalf, y: mark.y - perpY * upperHalf });
        }
        if (lower.length < 3 || upper.length < 3) return;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * (options.alphaScale ?? 0.62);
        ctx.beginPath();
        ctx.moveTo(lower[0].x, lower[0].y);
        for (let i = 1; i < lower.length; i += 1) {
          const prev = lower[i - 1];
          const cur = lower[i];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(lower[lower.length - 1].x, lower[lower.length - 1].y);
        for (let i = upper.length - 1; i > 0; i -= 1) {
          const prev = upper[i];
          const cur = upper[i - 1];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(upper[0].x, upper[0].y);
        ctx.closePath();
        ctx.fill();
        const bridgeAlpha = options.pieFoldBridgeAlpha ?? 0;
        if (bridgeAlpha > 0) {
          ctx.globalAlpha = alpha * bridgeAlpha;
          ctx.beginPath();
          ctx.moveTo(
            turn.x - postPerp.x * spread * 0.24 - preTangent.x * preReach * 0.18,
            turn.y - postPerp.y * spread * 0.24 - preTangent.y * preReach * 0.18,
          );
          ctx.bezierCurveTo(
            turn.x + postTangent.x * postReach * 0.18 - postPerp.x * spread * 0.24,
            turn.y + postTangent.y * postReach * 0.18 - postPerp.y * spread * 0.24,
            turn.x + postTangent.x * postReach * 0.58 + postPerp.x * spread * 0.12,
            turn.y + postTangent.y * postReach * 0.58 + postPerp.y * spread * 0.12,
            turn.x + postTangent.x * postReach * 0.74 + postPerp.x * spread * 0.1,
            turn.y + postTangent.y * postReach * 0.74 + postPerp.y * spread * 0.1,
          );
          ctx.bezierCurveTo(
            turn.x + postTangent.x * postReach * 0.5 + postPerp.x * spread * 0.34,
            turn.y + postTangent.y * postReach * 0.5 + postPerp.y * spread * 0.34,
            turn.x + postTangent.x * postReach * 0.1 + prePerp.x * spread * 0.2,
            turn.y + postTangent.y * postReach * 0.1 + prePerp.y * spread * 0.2,
            turn.x - postPerp.x * spread * 0.24 - preTangent.x * preReach * 0.18,
            turn.y - postPerp.y * spread * 0.24 - preTangent.y * preReach * 0.18,
          );
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawNaiSweptBody(ctx, marks, alpha, options = {}) {
        if (marks.length < 4 || alpha <= 0) return;
        const lower = [];
        const upper = [];
        const lowerScale = options.naiLowerScale ?? 1;
        const upperScale = options.naiUpperScale ?? 1;
        const start = options.naiStart ?? 0.04;
        const end = options.naiEnd ?? 0.985;
        const pressStart = options.naiPressStart ?? 0.12;
        const pressPeak = options.naiPressPeak ?? 0.68;
        const releaseStart = options.naiReleaseStart ?? 0.76;
        const releaseEnd = options.naiReleaseEnd ?? 0.98;
        const waist = options.naiWaist ?? 0.55;
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          if (t < start || t > end) continue;
          const prev = marks[Math.max(0, i - 1)];
          const next = marks[Math.min(marks.length - 1, i + 1)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const press = smoothstep(pressStart, pressPeak, t);
          const release = smoothstep(releaseStart, releaseEnd, t);
          const entry = smoothstep(start, Math.min(0.28, start + 0.22), t);
          const lowerBelly = Math.sin(Math.PI * clamp((t - 0.08) / 0.82, 0, 1));
          const taper = lerp(1, 0.12, release);
          const tailPinch = smoothstep(options.naiTailPinchStart ?? 1.1, options.naiTailPinchEnd ?? 1.2, t);
          const tailLowerTaper = lerp(1, options.naiTailLowerScale ?? 1, tailPinch);
          const tailUpperTaper = lerp(1, options.naiTailUpperScale ?? 1, tailPinch);
          const tailCenterPull = tailPinch * (options.naiTailCenterPull ?? 0);
          const base = mark.half * lerp(0.76, 1.18, mark.pressure);
          const lowerHalf =
            base *
            lowerScale *
            entry *
            taper *
            tailLowerTaper *
            (0.32 + press * 0.5 + lowerBelly * waist);
          const upperHalf =
            base *
            upperScale *
            entry *
            lerp(1, 0.2, release) *
            tailUpperTaper *
            (0.16 + press * 0.28);
          const spinePush = base * (options.naiSpinePush ?? 0.16) * smoothstep(0.42, 0.78, t) * (1 - release * 0.7);
          const center = { x: mark.x + tangent.x * spinePush, y: mark.y + tangent.y * spinePush };
          const lowerPoint = { x: center.x + perpX * lowerHalf, y: center.y + perpY * lowerHalf };
          lower.push({ x: lerp(lowerPoint.x, center.x, tailCenterPull), y: lerp(lowerPoint.y, center.y, tailCenterPull) });
          upper.push({ x: mark.x - tangent.x * spinePush * 0.18 - perpX * upperHalf, y: mark.y - tangent.y * spinePush * 0.18 - perpY * upperHalf });
        }
        if (lower.length < 3 || upper.length < 3) return;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * (options.naiAlphaScale ?? 0.74);
        ctx.beginPath();
        ctx.moveTo(upper[0].x, upper[0].y);
        for (let i = 1; i < upper.length; i += 1) {
          const prev = upper[i - 1];
          const cur = upper[i];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(upper[upper.length - 1].x, upper[upper.length - 1].y);
        for (let i = lower.length - 1; i > 0; i -= 1) {
          const prev = lower[i];
          const cur = lower[i - 1];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(lower[0].x, lower[0].y);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = alpha * (options.naiSpineAlpha ?? 0.2);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#111411";
        ctx.lineWidth = Math.max(0.8, marks[Math.floor(marks.length * 0.55)].half * (options.naiSpineWidth ?? 0.55));
        ctx.beginPath();
        const first = marks[Math.floor(marks.length * 0.08)];
        if (first) ctx.moveTo(first.x, first.y);
        for (let i = Math.floor(marks.length * 0.1); i < Math.floor(marks.length * 0.9); i += 1) {
          const mark = marks[i];
          ctx.lineTo(mark.x, mark.y);
        }
        ctx.stroke();
        ctx.restore();
      }

      function drawNaiLowerPad(ctx, marks, alpha, options = {}) {
        if (marks.length < 5 || alpha <= 0) return;
        const start = options.naiLowerPadStart ?? 0.28;
        const peak = options.naiLowerPadPeak ?? 0.66;
        const release = options.naiLowerPadRelease ?? 0.9;
        const end = options.naiLowerPadEnd ?? 0.985;
        const scale = options.naiLowerPadScale ?? 1.15;
        const upper = options.naiLowerPadUpper ?? 0.28;
        const drag = options.naiLowerPadDrag ?? 0.18;
        const lower = [];
        const inner = [];
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          if (t < start || t > end) continue;
          const prev = marks[Math.max(0, i - 1)];
          const next = marks[Math.min(marks.length - 1, i + 1)];
          const tangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          const pressIn = smoothstep(start, peak, t);
          const lift = smoothstep(release, end, t);
          const belly = Math.sin(Math.PI * clamp((t - start) / Math.max(0.001, end - start), 0, 1));
          const contact = pressIn * lerp(1, 0.18, lift);
          const rearFoot = smoothstep(0.48, 0.74, t) * (1 - smoothstep(0.82, end, t));
          const rootSpread = lerp(0.72, 1.18, mark.pressure) * (0.58 + belly * 0.42 + rearFoot * 0.62);
          const lowerRadius = mark.half * scale * contact * rootSpread;
          const upperRadius = mark.half * upper * contact * lerp(0.9, 0.35, lift);
          const forward = mark.half * drag * smoothstep(0.45, 0.82, t) * (1 - lift * 0.45);
          const heel = mark.half * (options.naiLowerPadHeel ?? 0.26) * rearFoot;
          lower.push({
            x: mark.x + tangent.x * (forward - heel) + perpX * lowerRadius,
            y: mark.y + tangent.y * (forward - heel) + perpY * lowerRadius,
          });
          inner.push({
            x: mark.x - tangent.x * forward * 0.08 - perpX * upperRadius,
            y: mark.y - tangent.y * forward * 0.08 - perpY * upperRadius,
          });
        }
        if (lower.length < 3 || inner.length < 3) return;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * (options.naiLowerPadAlpha ?? 0.2);
        ctx.beginPath();
        ctx.moveTo(inner[0].x, inner[0].y);
        for (let i = 1; i < inner.length; i += 1) {
          const prev = inner[i - 1];
          const cur = inner[i];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(inner[inner.length - 1].x, inner[inner.length - 1].y);
        for (let i = lower.length - 1; i > 0; i -= 1) {
          const prev = lower[i];
          const cur = lower[i - 1];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.lineTo(lower[0].x, lower[0].y);
        ctx.closePath();
        ctx.fill();
        ctx.globalAlpha = alpha * (options.naiLowerPadEdgeAlpha ?? 0.12);
        drawDemoEdgeFibers(ctx, lower, {
          count: options.naiLowerPadFiberCount ?? 10,
          length: marks[Math.floor(marks.length * 0.62)].half * (options.naiLowerPadFiberLength ?? 0.32),
          spread: marks[Math.floor(marks.length * 0.62)].half * (options.naiLowerPadFiberSpread ?? 0.2),
          alpha: alpha * (options.naiLowerPadEdgeAlpha ?? 0.12),
          side: 1,
          width: options.naiLowerPadFiberWidth ?? 0.7,
          profile: (t) => Math.sin(Math.PI * t) * 0.85,
        });
        ctx.restore();
      }

      function drawNaiPressBelly(ctx, marks, alpha, options = {}) {
        if (marks.length < 8 || alpha <= 0) return;

          const index = marks.indexOf(mark);

        };

          const tangent = tangentAt(mark);
          const perpX = -tangent.y;
          const perpY = tangent.x;

            x: mark.x + tangent.x * mark.half * along + perpX * mark.half * side,
            y: mark.y + tangent.y * mark.half * along + perpY * mark.half * side,

          local(press, 0.36, -upperScale * 0.48).x,

          local(belly, 0.3, -upperScale * 0.36).x,
          local(belly, 0.3, -upperScale * 0.36).y,

          local(release, -0.12, -tailScale * 0.25).x,
          local(release, -0.12, -tailScale * 0.25).y,
          local(end, 0.28, -tailScale * 0.16).x,
          local(end, 0.28, -tailScale * 0.16).y,

          tailTip.y,
        );
        body.bezierCurveTo(
          local(end, 0.16, tailScale * 0.26).x,
          local(end, 0.16, tailScale * 0.26).y,
          local(release, 0.34, lowerScale * 0.46).x,

          local(belly, 0.36, lowerScale * 1.12).x,

          bellyLower.y,
          bellyLower.x,
          bellyLower.y,

        body.bezierCurveTo(
          local(press, 0.02, lowerScale * 0.9).x,
          local(press, 0.02, lowerScale * 0.9).y,
          pressLower.x,
          pressLower.y,
          pressLower.x,
          pressLower.y,
        );
        body.bezierCurveTo(
          startHeel.x,
          startHeel.y,
          local(entry, -0.18, lowerScale * 0.08).x,
          local(entry, -0.18, lowerScale * 0.08).y,
          startTip.x,

        );
        body.closePath();

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";

      function drawNaiPlanarPressFace(ctx, marks, alpha, options = {}) {

          at(press, 0.38, -upper * 0.62).x,

      function drawDropletFootprintFace(ctx, marks, alpha, options = {}) {

        const press = markAt(options.dropletPress ?? 0.24);
        const belly = markAt(options.dropletBelly ?? 0.58);
        const release = markAt(options.dropletRelease ?? 0.82);
        const end = markAt(options.dropletEnd ?? 0.98);
        const axis = normalize(end.x - entry.x, end.y - entry.y, options.dropletAxisX ?? 1, options.dropletAxisY ?? 0.35);
        const perpX = -axis.y;
        const perpY = axis.x;

        const lower = options.dropletLower ?? 1.1;
        const bellyAlong = options.dropletBellyAlong ?? 0.2;
        const tailReach = options.dropletTailReach ?? 0.62;
        const tailLower = options.dropletTailLower ?? 0.22;
        const startReach = options.dropletStartReach ?? 0.46;
        const at = (mark, along, side) => ({
          x: mark.x + axis.x * half * along + perpX * half * side,
          y: mark.y + axis.y * half * along + perpY * half * side,
        });

        const startTip = at(entry, -startReach, -upper * 0.08);
        const upperPress = at(press, -0.34, -upper);
        const upperBelly = at(belly, bellyAlong, -upper * 0.58);
        const upperRelease = at(release, 0.14, -upper * 0.24);
        const tailTip = at(end, tailReach, -upper * 0.04);
        const lowerTail = at(release, 0.28, lower * tailLower);
        const lowerBelly = at(belly, -0.06, lower);

        face.moveTo(startTip.x, startTip.y);
        face.bezierCurveTo(
          at(entry, 0.0, -upper * 0.14).x,
          at(entry, 0.0, -upper * 0.14).y,
          at(press, -0.55, -upper * 0.84).x,
          at(press, -0.55, -upper * 0.84).y,

          upperPress.y,

        face.bezierCurveTo(
          at(press, 0.36, -upper * 0.8).x,
          at(press, 0.36, -upper * 0.8).y,
          at(belly, -0.12, -upper * 0.56).x,
          at(belly, -0.12, -upper * 0.56).y,

        face.bezierCurveTo(
          at(release, -0.16, -upper * 0.3).x,
          at(release, -0.16, -upper * 0.3).y,
          upperRelease.x,
          upperRelease.y,
          tailTip.x,
          tailTip.y,

        face.bezierCurveTo(
          at(end, 0.22, lower * 0.06).x,

        face.bezierCurveTo(
          at(belly, 0.34, lower * 1.08).x,

        face.bezierCurveTo(
          at(press, 0.02, lower * 0.86).x,

      function drawPiePressBelly(ctx, marks, alpha, options = {}) {
        if (marks.length < 8 || alpha <= 0) return;
        const markAt = (t) => marks[Math.max(0, Math.min(marks.length - 1, Math.round(t * (marks.length - 1))))];
        const tangentAt = (mark) => {
          const index = marks.indexOf(mark);
          const prev = marks[Math.max(0, index - 2)];
          const next = marks[Math.min(marks.length - 1, index + 2)];
          return normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
        };
        const local = (mark, along, side) => {
          const tangent = tangentAt(mark);
          const perpX = -tangent.y;
          const perpY = tangent.x;
          return {
            x: mark.x + tangent.x * mark.half * along + perpX * mark.half * side,
            y: mark.y + tangent.y * mark.half * along + perpY * mark.half * side,
          };
        };
        const entry = markAt(options.pieBodyEntry ?? 0.03);
        const press = markAt(options.pieBodyPress ?? 0.22);
        const belly = markAt(options.pieBodyBelly ?? 0.48);
        const lift = markAt(options.pieBodyLift ?? 0.78);
        const tail = markAt(options.pieBodyTail ?? 0.99);
        const outer = options.pieBodyOuter ?? 0.96;
        const inner = options.pieBodyInner ?? 0.58;
        const tailScale = options.pieBodyTailScale ?? 0.2;

        const startTip = local(entry, -0.04, -0.24);
        const pressOuter = local(press, -0.18, -outer);
        const bellyOuter = local(belly, 0.04, -outer * 0.58);
        const tailTip = local(tail, 0.42, -tailScale * 0.04);
        const tailInner = local(lift, 0.16, inner * 0.18);
        const bellyInner = local(belly, 0.1, inner * 0.88);
        const pressInner = local(press, -0.14, inner * 0.72);
        const heel = local(entry, 0.2, inner * 0.4);

        const body = new Path2D();
        body.moveTo(startTip.x, startTip.y);
        body.bezierCurveTo(
          local(entry, 0.02, -outer * 0.26).x,
          local(entry, 0.02, -outer * 0.26).y,
          local(press, -0.42, -outer * 1.05).x,
          local(press, -0.42, -outer * 1.05).y,
          pressOuter.x,
          pressOuter.y,
        );
        body.bezierCurveTo(
          local(press, 0.34, -outer * 0.78).x,
          local(press, 0.34, -outer * 0.78).y,
          local(belly, 0.24, -outer * 0.5).x,
          local(belly, 0.24, -outer * 0.5).y,
          bellyOuter.x,
          bellyOuter.y,
        );
        body.bezierCurveTo(
          local(lift, -0.08, -tailScale * 0.5).x,
          local(lift, -0.08, -tailScale * 0.5).y,
          local(tail, 0.1, -tailScale * 0.12).x,
          local(tail, 0.1, -tailScale * 0.12).y,
          tailTip.x,
          tailTip.y,
        );
        body.bezierCurveTo(
          local(tail, -0.14, tailScale * 0.22).x,
          local(tail, -0.14, tailScale * 0.22).y,
          tailInner.x,
          tailInner.y,
          tailInner.x,
          tailInner.y,
        );
        body.bezierCurveTo(
          local(belly, 0.26, inner * 0.92).x,
          local(belly, 0.26, inner * 0.92).y,
          bellyInner.x,
          bellyInner.y,
          bellyInner.x,
          bellyInner.y,
        );
        body.bezierCurveTo(
          local(press, 0.08, inner * 0.78).x,
          local(press, 0.08, inner * 0.78).y,
          pressInner.x,
          pressInner.y,
          pressInner.x,
          pressInner.y,
        );
        body.bezierCurveTo(
          heel.x,
          heel.y,
          local(entry, -0.1, inner * 0.08).x,
          local(entry, -0.1, inner * 0.08).y,
          startTip.x,
          startTip.y,
        );
        body.closePath();

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * (options.pieBodyAlpha ?? 0.68);
        ctx.fill(body);
        const shoulderAlpha = options.pieShoulderAlpha ?? 0;
        if (shoulderAlpha > 0) {
          const tangent = tangentAt(press);
          const angle = Math.atan2(tangent.y, tangent.x);
          ctx.save();
          ctx.translate(press.x, press.y);
          ctx.rotate(angle);
          ctx.globalAlpha = alpha * shoulderAlpha;
          ctx.beginPath();
          ctx.ellipse(
            -press.half * 0.12,
            0,
            press.half * (options.pieShoulderAlong ?? 0.82),
            press.half * (options.pieShoulderSide ?? 0.62),
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.restore();
        }
        const turnAlpha = options.pieTurnPadAlpha ?? 0;
        if (turnAlpha > 0) {
          const turn = markAt(options.pieTurnPadT ?? 0.4);
          const tangent = tangentAt(turn);
          const angle = Math.atan2(tangent.y, tangent.x);
          ctx.save();
          ctx.translate(turn.x, turn.y);
          ctx.rotate(angle);
          ctx.globalAlpha = alpha * turnAlpha;
          ctx.beginPath();
          ctx.ellipse(
            0,
            0,
            turn.half * (options.pieTurnAlong ?? 0.64),
            turn.half * (options.pieTurnSide ?? 0.78),
            0,
            0,
            Math.PI * 2,
          );
          ctx.fill();
          ctx.restore();
        }
        ctx.restore();
      }

      function drawPieAfterTurnBody(ctx, marks, alpha, options = {}) {
        const bodyAlpha = options.pieAfterTurnAlpha ?? 0;
        if (marks.length < 8 || bodyAlpha <= 0 || alpha <= 0) return;
        const startT = options.pieAfterTurnStart ?? 0.42;
        const endT = options.pieAfterTurnEnd ?? 0.98;
        const tailStart = options.pieAfterTurnTailStart ?? 0.86;
        const scale = options.pieAfterTurnScale ?? 0.74;
        const sideBias = clamp(options.pieAfterTurnSideBias ?? -0.08, -0.4, 0.4);
        const lag = clamp(options.pieAfterTurnLag ?? 0.65, 0, 1);
        const lagStart = options.pieAfterTurnLagStart ?? 0.08;
        const lagEnd = options.pieAfterTurnLagEnd ?? 0.74;
        const outerHold = clamp(options.pieAfterTurnOuterHold ?? 0, 0, 0.45);
        const innerFollow = clamp(options.pieAfterTurnInnerFollow ?? 0.78, 0, 1);
        const turnIndex = Math.max(1, Math.min(marks.length - 2, Math.round(startT * (marks.length - 1))));
        const before = marks[Math.max(0, turnIndex - 5)];
        const turn = marks[turnIndex];
        const preTurnTangent = normalize(turn.x - before.x, turn.y - before.y, turn.dirX, turn.dirY);
        const upper = [];
        const lower = [];
        for (let i = 0; i < marks.length; i += 1) {
          const mark = marks[i];
          const t = marks.length === 1 ? 1 : i / (marks.length - 1);
          if (t < startT || t > endT) continue;
          const localT = clamp((t - startT) / Math.max(0.001, endT - startT), 0, 1);
          const prev = marks[Math.max(0, i - 1)];
          const next = marks[Math.min(marks.length - 1, i + 1)];
          const currentTangent = normalize(next.x - prev.x, next.y - prev.y, mark.dirX, mark.dirY);
          const lagAmount = lag * (1 - smoothstep(lagStart, lagEnd, localT));
          const outerLag = clamp(lagAmount + outerHold * (1 - smoothstep(0.28, 0.96, localT)), 0, 1);
          const innerLag = lagAmount * (1 - innerFollow);
          const draggedTangent = normalize(
            lerp(currentTangent.x, preTurnTangent.x, outerLag),
            lerp(currentTangent.y, preTurnTangent.y, outerLag),
            currentTangent.x,
            currentTangent.y,
          );
          const innerTangent = normalize(
            lerp(currentTangent.x, preTurnTangent.x, innerLag),
            lerp(currentTangent.y, preTurnTangent.y, innerLag),
            currentTangent.x,
            currentTangent.y,
          );
          const currentPerpX = -currentTangent.y;
          const currentPerpY = currentTangent.x;
          const innerPerpX = -innerTangent.y;
          const innerPerpY = innerTangent.x;
          const draggedPerpX = -draggedTangent.y;
          const draggedPerpY = draggedTangent.x;
          const pressHold = lerp(1.08, 0.92, smoothstep(0, 0.68, localT));
          const tailLift = lerp(1, 0.12, smoothstep(tailStart, endT, t));
          const half = mark.half * scale * pressHold * tailLift;
          lower.push({
            x: mark.x + draggedPerpX * half * (1.18 - sideBias * 0.2) - draggedTangent.x * half * outerLag * 0.34,
            y: mark.y + draggedPerpY * half * (1.18 - sideBias * 0.2) - draggedTangent.y * half * outerLag * 0.34,
          });
          upper.push({
            x: mark.x - innerPerpX * half * (0.56 + sideBias),
            y: mark.y - innerPerpY * half * (0.56 + sideBias),
          });
        }
        if (upper.length < 3 || lower.length < 3) return;
        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * bodyAlpha;
        ctx.beginPath();
        ctx.moveTo(upper[0].x, upper[0].y);
        for (let i = 1; i < upper.length; i += 1) {
          const prev = upper[i - 1];
          const cur = upper[i];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        for (let i = lower.length - 1; i >= 0; i -= 1) {
          const prev = lower[Math.min(lower.length - 1, i + 1)];
          const cur = lower[i];
          ctx.quadraticCurveTo(prev.x, prev.y, (prev.x + cur.x) * 0.5, (prev.y + cur.y) * 0.5);
        }
        ctx.closePath();
        ctx.fill();
        if ((options.pieEntryCutAlpha ?? 0) > 0) {
          ctx.globalCompositeOperation = "destination-out";
          ctx.globalAlpha = alpha * options.pieEntryCutAlpha;
          ctx.beginPath();
          ctx.moveTo(
            entryTip.x - tangent.x * half * 0.18 - perpX * half * 0.78,
            entryTip.y - tangent.y * half * 0.18 - perpY * half * 0.78,
          );
          ctx.lineTo(
            start.x + runTangent.x * half * 0.78 - runPerpX * half * 0.52,
            start.y + runTangent.y * half * 0.78 - runPerpY * half * 0.52,
          );
          ctx.lineTo(
            start.x - runTangent.x * half * 0.12 + runPerpX * half * 0.18,
            start.y - runTangent.y * half * 0.12 + runPerpY * half * 0.18,
          );
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawPieTurnCompression(ctx, marks, alpha, options = {}) {
        const turnAlpha = options.pieTurnCompressionAlpha ?? 0;
        if (marks.length < 8 || turnAlpha <= 0 || alpha <= 0) return;
        const turnT = options.pieTurnCompressionT ?? options.pieAfterTurnStart ?? 0.42;
        const turnIndex = Math.max(2, Math.min(marks.length - 3, Math.round(turnT * (marks.length - 1))));
        const before = marks[Math.max(0, turnIndex - 5)];
        const turn = marks[turnIndex];
        const after = marks[Math.min(marks.length - 1, turnIndex + 5)];
        const preTangent = normalize(turn.x - before.x, turn.y - before.y, turn.dirX, turn.dirY);
        const postTangent = normalize(after.x - turn.x, after.y - turn.y, turn.dirX, turn.dirY);
        const prePerp = { x: -preTangent.y, y: preTangent.x };
        const postPerp = { x: -postTangent.y, y: postTangent.x };
        const half = turn.half * (options.pieTurnCompressionScale ?? 1.04);
        const preReach = half * (options.pieTurnCompressionPre ?? 0.92);
        const postReach = half * (options.pieTurnCompressionPost ?? 0.74);
        const spread = half * (options.pieTurnCompressionSpread ?? 0.82);

        const p0 = {
          x: turn.x - preTangent.x * preReach - prePerp.x * spread * 0.16,
          y: turn.y - preTangent.y * preReach - prePerp.y * spread * 0.16,
        };
        const p1 = {
          x: turn.x + prePerp.x * spread * 0.88 - preTangent.x * preReach * 0.12,
          y: turn.y + prePerp.y * spread * 0.88 - preTangent.y * preReach * 0.12,
        };
        const p2 = {
          x: turn.x + postTangent.x * postReach + postPerp.x * spread * 0.68,
          y: turn.y + postTangent.y * postReach + postPerp.y * spread * 0.68,
        };
        const p3 = {
          x: turn.x + postTangent.x * postReach * 0.76 - postPerp.x * spread * 0.54,
          y: turn.y + postTangent.y * postReach * 0.76 - postPerp.y * spread * 0.54,
        };
        const p4 = {
          x: turn.x - prePerp.x * spread * 0.64 - preTangent.x * preReach * 0.24,
          y: turn.y - prePerp.y * spread * 0.64 - preTangent.y * preReach * 0.24,
        };

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * turnAlpha;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        ctx.bezierCurveTo(
          turn.x - preTangent.x * preReach * 0.46 + prePerp.x * spread * 0.72,
          turn.y - preTangent.y * preReach * 0.46 + prePerp.y * spread * 0.72,
          p1.x,
          p1.y,
          p1.x,
          p1.y,
        );
        ctx.bezierCurveTo(
          turn.x + postTangent.x * postReach * 0.18 + postPerp.x * spread * 0.96,
          turn.y + postTangent.y * postReach * 0.18 + postPerp.y * spread * 0.96,
          p2.x,
          p2.y,
          p2.x,
          p2.y,
        );
        ctx.bezierCurveTo(
          turn.x + postTangent.x * postReach * 0.98 - postPerp.x * spread * 0.16,
          turn.y + postTangent.y * postReach * 0.98 - postPerp.y * spread * 0.16,
          p3.x,
          p3.y,
          p3.x,
          p3.y,
        );
        ctx.bezierCurveTo(
          turn.x - prePerp.x * spread * 0.78,
          turn.y - prePerp.y * spread * 0.78,
          p4.x,
          p4.y,
          p4.x,
          p4.y,
        );
        ctx.bezierCurveTo(
          turn.x - preTangent.x * preReach * 0.7 - prePerp.x * spread * 0.44,
          turn.y - preTangent.y * preReach * 0.7 - prePerp.y * spread * 0.44,
          p0.x,
          p0.y,
          p0.x,
          p0.y,
        );
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      function drawPieFoldPressFace(ctx, marks, alpha, options = {}) {
        const faceAlpha = options.pieFoldFaceAlpha ?? 0;
        if (marks.length < 10 || faceAlpha <= 0 || alpha <= 0) return;
        const turnT = options.pieFoldFaceT ?? options.pieTurnCompressionT ?? options.pieAfterTurnStart ?? 0.42;
        const turnIndex = Math.max(3, Math.min(marks.length - 4, Math.round(turnT * (marks.length - 1))));
        const before = marks[Math.max(0, turnIndex - 6)];
        const turn = marks[turnIndex];
        const after = marks[Math.min(marks.length - 1, turnIndex + 8)];
        const preTangent = normalize(turn.x - before.x, turn.y - before.y, turn.dirX, turn.dirY);
        const postTangent = normalize(after.x - turn.x, after.y - turn.y, turn.dirX, turn.dirY);
        const prePerp = { x: -preTangent.y, y: preTangent.x };
        const postPerp = { x: -postTangent.y, y: postTangent.x };
        const half = turn.half * (options.pieFoldFaceScale ?? 1.18);
        const preReach = half * (options.pieFoldFacePre ?? 0.88);
        const postReach = half * (options.pieFoldFacePost ?? 1.42);
        const spread = half * (options.pieFoldFaceSpread ?? 1.06);
        const root = {
          x: turn.x - preTangent.x * preReach * 0.42 - prePerp.x * spread * 0.18,
          y: turn.y - preTangent.y * preReach * 0.42 - prePerp.y * spread * 0.18,
        };
        const upperShoulder = {
          x: turn.x + prePerp.x * spread * 0.82 - preTangent.x * preReach * 0.18,
          y: turn.y + prePerp.y * spread * 0.82 - preTangent.y * preReach * 0.18,
        };
        const outerBelly = {
          x: turn.x + postTangent.x * postReach * 0.62 + postPerp.x * spread * 0.86,
          y: turn.y + postTangent.y * postReach * 0.62 + postPerp.y * spread * 0.86,
        };
        const lowerDrag = {
          x: turn.x + postTangent.x * postReach - postPerp.x * spread * 0.28,
          y: turn.y + postTangent.y * postReach - postPerp.y * spread * 0.28,
        };
        const innerFold = {
          x: turn.x - postPerp.x * spread * 0.5 - preTangent.x * preReach * 0.1,
          y: turn.y - postPerp.y * spread * 0.5 - preTangent.y * preReach * 0.1,
        };

        ctx.save();
        ctx.fillStyle = "#111411";
        ctx.globalCompositeOperation = "source-over";
        ctx.globalAlpha = alpha * faceAlpha;
        ctx.beginPath();
        ctx.moveTo(root.x, root.y);
        ctx.bezierCurveTo(
          turn.x - preTangent.x * preReach * 0.24 + prePerp.x * spread * 0.72,

      function drawPieEntryRunFace(ctx, marks, alpha, options = {}) {
        const faceAlpha = options.pieEntryRunAlpha ?? 0;
        if (marks.length < 8 || faceAlpha <= 0 || alpha <= 0) return;

        const endIndex = Math.max(startIndex + 2, Math.min(marks.length - 2, Math.round((options.pieEntryRunEnd ?? 0.36) * (marks.length - 1))));
        const start = marks[startIndex];

          lerp(runTangent.x, entryTangent.x, options.pieEntryRunAxisBlend ?? 0.72),
          lerp(runTangent.y, entryTangent.y, options.pieEntryRunAxisBlend ?? 0.72),
          runTangent.x,

        const perpY = tangent.x;

          x: start.x - tangent.x * half * 1.02 + perpX * half * 0.04,
          y: start.y - tangent.y * half * 1.02 + perpY * half * 0.04,

        const upperStart = {
          x: start.x - tangent.x * half * 0.16 - perpX * half * 0.52,
          y: start.y - tangent.y * half * 0.16 - perpY * half * 0.52,

        const runPerpY = runTangent.x;

          x: mid.x - runPerpX * half * (options.pieEntryRunUpper ?? 0.7),

          x: end.x + runTangent.x * half * 0.22 - runPerpX * half * 0.46,

          upperStart.y,
          upperStart.x,
          upperStart.y,

          end.x + tangent.x * half * 0.42 + perpX * half * 0.18,

          lowerEnd.y,
          lowerEnd.x,

          lowerMid.x,
          lowerMid.y,
          lowerStart.x,
          lowerStart.y,
          lowerStart.x,
          lowerStart.y,

        ctx.bezierCurveTo(
          start.x - tangent.x * half * 0.36 + perpX * half * 0.24,
          start.y - tangent.y * half * 0.36 + perpY * half * 0.24,

          entryTip.y,
          entryTip.x,
