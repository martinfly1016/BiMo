<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>笔墨 · iPad 输入探针</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #111418; color: #e8e8e8; }
  body {
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; }
  h1 small { font-weight: 400; color: #9aa4b2; font-size: 14px; margin-left: 6px; }
  #padWrap { position: relative; }
  #pad {
    display: block; width: 100%; height: 44vh; min-height: 260px;
    background: #1a1f27; border: 1px solid #333a45; border-radius: 12px;
    touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    cursor: crosshair;
  }
  #padHint {
    position: absolute; left: 12px; top: 10px; right: 12px; pointer-events: none;
    color: #9aa4b2; font-size: 14px; line-height: 1.4;
  }
  #padHint b { color: #ffd479; font-weight: 600; }
  #controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 12px 0 8px; }
  button {
    min-height: 46px; padding: 8px 16px; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 10px; color: #fff; background: #2d6cdf; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.secondary { background: #3a4250; }
  button.warn { background: #b4552d; }
  button:disabled { opacity: .5; }
  #status {
    min-height: 26px; padding: 6px 10px; border-radius: 8px; background: #1a1f27;
    color: #ffd479; font-size: 15px; margin-bottom: 10px;
  }
  #stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; }
  .card { background: #1a1f27; border: 1px solid #2a313c; border-radius: 12px; padding: 10px 12px; }
  .card h2 { font-size: 15px; margin: 0 0 6px; color: #9fc5ff; font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; border-top: 1px dashed #2a313c; font-size: 14px; }
  .row:first-of-type { border-top: 0; }
  .row .k { color: #b8c0cc; flex: 0 1 58%; }
  .row .v { color: #fff; text-align: right; font-variant-numeric: tabular-nums; word-break: break-all; }
  .v.ok { color: #7ee2a8; } .v.bad { color: #ff8a80; } .v.dim { color: #8b94a3; }
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 46px; margin: 6px 0 2px; }
  .hist div { flex: 1; background: #2d6cdf; min-height: 1px; border-radius: 2px 2px 0 0; }
  .hist.lat div { background: #b4552d; }
  .histLabel { display: flex; justify-content: space-between; font-size: 12px; color: #8b94a3; }
  .ua { font-size: 12px; color: #8b94a3; word-break: break-all; margin-top: 4px; }
  #exportBox { margin-top: 12px; }
  #exportMsg { font-size: 15px; margin: 6px 0; min-height: 22px; }
  #jsonOut {
    width: 100%; height: 160px; background: #0d1015; color: #cfd6e0; border: 1px solid #2a313c;
    border-radius: 8px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px; resize: vertical;
  }
  details summary { cursor: pointer; color: #9aa4b2; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>笔墨 · iPad 输入探针 <small>probe.html · 不依赖 js/ 模块</small></h1>
</header>

<div id="padWrap">
  <canvas id="pad"></canvas>
  <div id="padHint">书写区（touch-action:none）。<b>用 Apple Pencil 按平常姿势写 10 笔横竖</b>，倾角分布持续统计；点「开始 10 秒采样」得到干净的窗口数据。</div>
</div>

<div id="controls">
  <button id="btnWindow">开始 10 秒采样</button>
  <button id="btnPosture" class="secondary">静握 2 秒</button>
  <button id="btnReset" class="secondary">清零并连续采集</button>
  <button id="btnClear" class="secondary">清空画布</button>
  <button id="btnExport" class="warn">导出结果</button>
</div>
<div id="status">连续采集中。先随手写几笔看统计是否跳动，再点「开始 10 秒采样」。</div>

<main id="stats"></main>

<section id="exportBox">
  <div id="exportMsg"></div>
  <details>
    <summary>查看 / 手动复制 JSON</summary>
    <textarea id="jsonOut" readonly spellcheck="false"></textarea>
    <div style="margin-top:6px"><button id="btnCopy" class="secondary">复制 JSON</button></div>
  </details>
</section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const DEG = 180 / Math.PI;
const now = () => performance.now();

// ---------- 统计小工具 ----------
function quantile(sorted, p) {
  const n = sorted.length; if (!n) return null;
  const i = (n - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}
function sortedCopy(a) { return a.slice().sort((x, y) => x - y); }
function mean(a) { return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; }
function std(a) { if (a.length < 2) return null; const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / (a.length - 1)); }
// 方位角是圆量：用平均合向量 R 算圆均值与圆标准差 sqrt(-2 ln R)
function circStats(rad) {
  if (!rad.length) return { mean: null, std: null };
  let c = 0, s = 0; for (const r of rad) { c += Math.cos(r); s += Math.sin(r); }
  c /= rad.length; s /= rad.length;
  const R = Math.min(1, Math.hypot(c, s));
  return { mean: Math.atan2(s, c), std: R > 0 ? Math.sqrt(-2 * Math.log(R)) : null };
}
function summary(a, scale) {
  if (!a.length) return { n: 0 };
  const s = sortedCopy(a), k = scale || 1;
  return { n: s.length, min: s[0] * k, q1: quantile(s, .25) * k, median: quantile(s, .5) * k, q3: quantile(s, .75) * k, max: s[s.length - 1] * k, mean: mean(s) * k };
}
// 有上限的样本池：满了随机替换（reservoir），保持无偏
function pool(cap) {
  return { a: [], seen: 0, cap, push(v) { this.seen++; if (this.a.length < this.cap) this.a.push(v); else { const j = Math.floor(Math.random() * this.seen); if (j < this.cap) this.a[j] = v; } } };
}
const fmt = (v, d = 2) => v == null || Number.isNaN(v) ? '—' : (typeof v === 'number' ? v.toFixed(d) : String(v));
const yn = v => v == null ? '—' : v ? '是' : '否';

// ---------- 画布 ----------
const pad = $('pad');
const ctx = pad.getContext('2d');
function fitCanvas() {
  const r = pad.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  pad.width = Math.max(1, Math.round(r.width * dpr));
  pad.height = Math.max(1, Math.round(r.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
fitCanvas();
window.addEventListener('resize', fitCanvas);
function localPos(ev) { const r = pad.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }

// ---------- 结果容器 ----------
const feat = {
  PointerEvent: 'PointerEvent' in window,
  getCoalescedEvents: !!(window.PointerEvent && 'getCoalescedEvents' in PointerEvent.prototype),
  getPredictedEvents: !!(window.PointerEvent && 'getPredictedEvents' in PointerEvent.prototype),
  altitudeAngle: !!(window.PointerEvent && 'altitudeAngle' in PointerEvent.prototype),
  azimuthAngle: !!(window.PointerEvent && 'azimuthAngle' in PointerEvent.prototype),
  pointerrawupdate: 'onpointerrawupdate' in window,
  TouchEvent: 'TouchEvent' in window,
  touchAltitudeAngle: !!(window.Touch && 'altitudeAngle' in Touch.prototype),
  touchAzimuthAngle: !!(window.Touch && 'azimuthAngle' in Touch.prototype),
  touchType: !!(window.Touch && 'touchType' in Touch.prototype),
  touchForce: !!(window.Touch && 'force' in Touch.prototype),
  canvasFilter: 'filter' in ctx,
  OffscreenCanvas: 'OffscreenCanvas' in window,
  mediaHover: matchMedia('(hover: hover)').matches,
  mediaPointerFine: matchMedia('(pointer: fine)').matches,
  mediaAnyPointerFine: matchMedia('(any-pointer: fine)').matches,
};
const env = () => ({
  userAgent: navigator.userAgent,
  platform: navigator.platform,
  maxTouchPoints: navigator.maxTouchPoints,
  screen: { width: screen.width, height: screen.height, orientation: screen.orientation && screen.orientation.type },
  inner: { width: window.innerWidth, height: window.innerHeight },
  devicePixelRatio: window.devicePixelRatio,
  visualViewportScale: window.visualViewport ? window.visualViewport.scale : null,
  standalone: !!navigator.standalone,
  timeOrigin: performance.timeOrigin,
});

function freshWindow() {
  return {
    active: false, frozen: false, startedAt: null, seconds: 0,
    frames: 0, frameIntervals: pool(2000),
    events: { down: 0, move: 0, up: 0, cancel: 0 },
    pointerTypes: {},
    penMovesInContact: 0, penMoves: 0, contactSeconds: 0, strokes: 0,
    coalesced: { supported: null, events: 0, sumLen: 0, empty: 0, maxLen: 0, intervals: pool(4000) },
    predicted: { supported: null, events: 0, sumLen: 0, empty: 0, maxLen: 0 },
    firstPenDownPressure: null, firstPenDown: null,
    samples: 0, zeroPressure: 0, pressureHist: new Array(10).fill(0), pressureVals: pool(4000),
    clientX: { fractional: 0, total: 0 },
    altAz: { present: null, altitude: pool(4000), azimuth: pool(4000) },
    tilt: { present: null, tiltX: pool(2000), tiltY: pool(2000) },
    twist: { present: null, nonzero: 0, max: 0 },
    tangentialPressure: { present: null, min: null, max: null },
    contact: { widthMin: null, widthMax: null, heightMin: null, heightMax: null },
    buttonsSeen: {}, buttonSeen: {},
    latency: { vals: pool(4000), hist: new Array(10).fill(0), negative: 0 },
    hover: { moves: 0, ids: {}, enterLeave: 0 },
    pointerIds: { down: [], contact: {}, distinct: 0 },
    palm: { touchEventsDuringPen: 0, nonStylusTouchesDuringPen: 0, touchPointerDownsDuringPen: 0, touchPointerMovesDuringPen: 0 },
    touchExt: { touchstarts: 0, touchmoves: 0, hasAltitude: null, hasAzimuth: null, hasTouchType: null, hasForce: null, touchTypes: {}, altitudeSample: null },
  };
}
const R = {
  win: freshWindow(),
  continuous: true,
  grip: { altitude: pool(20000), azimuth: pool(20000), tiltX: pool(20000), tiltY: pool(20000), pressure: pool(20000), strokes: 0 },
  posture: null,
  rafLive: { stamps: [], hz: null },
};
const recording = () => R.win.active || R.continuous;

// ---------- 指针状态 ----------
let penDown = false, penDownAt = 0, penDownId = null, penLast = null;
let anyDrawing = false, drawLast = null;
let postureCollector = null; // {alt:[], az:[], tiltX:[], tiltY:[], pressure:[], n}

function bump(o, k) { o[k] = (o[k] || 0) + 1; }
function minmax(o, kmin, kmax, v) { if (typeof v !== 'number' || Number.isNaN(v)) return; if (o[kmin] == null || v < o[kmin]) o[kmin] = v; if (o[kmax] == null || v > o[kmax]) o[kmax] = v; }

function ingestPenSample(s, inContact) {
  const W = R.win;
  W.samples++;
  if (inContact) {
    if (s.pressure === 0) W.zeroPressure++;
    const b = Math.min(9, Math.max(0, Math.floor(s.pressure * 10)));
    W.pressureHist[b]++;
    W.pressureVals.push(s.pressure);
    R.grip.pressure.push(s.pressure);
  }
  W.clientX.total++;
  if (!Number.isInteger(s.clientX) || !Number.isInteger(s.clientY)) W.clientX.fractional++;

  const hasAlt = typeof s.altitudeAngle === 'number' && typeof s.azimuthAngle === 'number';
  if (W.altAz.present === null) W.altAz.present = hasAlt;
  if (hasAlt) {
    W.altAz.altitude.push(s.altitudeAngle); W.altAz.azimuth.push(s.azimuthAngle);
    if (inContact) { R.grip.altitude.push(s.altitudeAngle); R.grip.azimuth.push(s.azimuthAngle); }
  }
  const hasTilt = typeof s.tiltX === 'number' && typeof s.tiltY === 'number';
  if (W.tilt.present === null) W.tilt.present = hasTilt;
  if (hasTilt) {
    W.tilt.tiltX.push(s.tiltX); W.tilt.tiltY.push(s.tiltY);
    if (inContact) { R.grip.tiltX.push(s.tiltX); R.grip.tiltY.push(s.tiltY); }
  }
  if (W.twist.present === null) W.twist.present = typeof s.twist === 'number';
  if (typeof s.twist === 'number' && s.twist !== 0) { W.twist.nonzero++; W.twist.max = Math.max(W.twist.max, Math.abs(s.twist)); }
  if (W.tangentialPressure.present === null) W.tangentialPressure.present = typeof s.tangentialPressure === 'number';
  minmax(W.tangentialPressure, 'min', 'max', s.tangentialPressure);
  minmax(W.contact, 'widthMin', 'widthMax', s.width);
  minmax(W.contact, 'heightMin', 'heightMax', s.height);
  bump(W.buttonsSeen, String(s.buttons));

  if (postureCollector) {
    postureCollector.n++;
    if (hasAlt) { postureCollector.alt.push(s.altitudeAngle); postureCollector.az.push(s.azimuthAngle); }
    if (hasTilt) { postureCollector.tiltX.push(s.tiltX); postureCollector.tiltY.push(s.tiltY); }
    if (inContact) postureCollector.pressure.push(s.pressure);
  }
}

// getCoalescedEvents 在合成（untrusted）事件上返回空数组：空则回退为 [e]
function coalescedOf(e) {
  const W = R.win.coalesced;
  if (typeof e.getCoalescedEvents !== 'function') { if (W.supported === null) W.supported = false; return [e]; }
  if (W.supported === null) W.supported = true;
  let list; try { list = e.getCoalescedEvents(); } catch (err) { list = []; }
  W.events++; W.sumLen += list.length; W.maxLen = Math.max(W.maxLen, list.length);
  if (!list.length) { W.empty++; return [e]; }
  for (let i = 1; i < list.length; i++) W.intervals.push(list[i].timeStamp - list[i - 1].timeStamp);
  return list;
}
function predictedOf(e) {
  const P = R.win.predicted;
  if (typeof e.getPredictedEvents !== 'function') { if (P.supported === null) P.supported = false; return; }
  if (P.supported === null) P.supported = true;
  let list; try { list = e.getPredictedEvents(); } catch (err) { list = []; }
  P.events++; P.sumLen += list.length; P.maxLen = Math.max(P.maxLen, list.length);
  if (!list.length) P.empty++;
}

function drawSegment(from, to, pressure) {
  ctx.strokeStyle = 'rgba(230,236,245,0.95)';
  ctx.lineWidth = 0.8 + 3 * (pressure || 0.3);
  ctx.beginPath(); ctx.moveTo(from.x, from.y); ctx.lineTo(to.x, to.y); ctx.stroke();
}

pad.addEventListener('pointerdown', e => {
  const W = R.win, rec = recording();
  if (rec) { W.events.down++; bump(W.pointerTypes, e.pointerType); bump(W.buttonSeen, String(e.button)); }
  try { pad.setPointerCapture(e.pointerId); } catch (err) {}
  if (e.pointerType === 'pen') {
    penDown = true; penDownAt = now(); penDownId = e.pointerId;
    if (rec) {
      if (W.firstPenDownPressure === null) {
        W.firstPenDownPressure = e.pressure;
        W.firstPenDown = { pressure: e.pressure, buttons: e.buttons, altitudeAngle: e.altitudeAngle, azimuthAngle: e.azimuthAngle, tiltX: e.tiltX, tiltY: e.tiltY, twist: e.twist, width: e.width, height: e.height, isPrimary: e.isPrimary };
      }
      if (W.pointerIds.down.length < 60) W.pointerIds.down.push(e.pointerId);
      bump(W.pointerIds.contact, String(e.pointerId));
      W.pointerIds.distinct = Object.keys(W.pointerIds.contact).length;
      ingestPenSample(e, true);
    }
  } else if (e.pointerType === 'touch' && penDown && rec) {
    W.palm.touchPointerDownsDuringPen++;
  }
  if (e.buttons & 1 || e.pointerType === 'touch') { anyDrawing = true; drawLast = localPos(e); }
});

pad.addEventListener('pointermove', e => {
  const W = R.win, rec = recording(), t = now();
  if (rec) { W.events.move++; bump(W.pointerTypes, e.pointerType); }
  if (e.pointerType === 'pen') {
    const inContact = (e.buttons & 1) !== 0;
    R.rafLive.penMoveStamps = R.rafLive.penMoveStamps || [];
    R.rafLive.penMoveStamps.push(t);
    if (rec) {
      W.penMoves++;
      const lat = t - e.timeStamp;
      if (lat < 0) W.latency.negative++;
      W.latency.vals.push(lat);
      W.latency.hist[Math.min(9, Math.max(0, Math.floor(Math.max(0, lat) / 2)))]++;
      predictedOf(e);
      const samples = coalescedOf(e);
      if (inContact) W.penMovesInContact++;
      else { W.hover.moves++; bump(W.hover.ids, String(e.pointerId)); }
      for (const s of samples) ingestPenSample(s, (s.buttons & 1) !== 0);
    } else if (postureCollector) {
      // 冻结期间仍允许「静握」任务收样本
      for (const s of coalescedOf(e)) { const c = (s.buttons & 1) !== 0; postureCollector.n++;
        if (typeof s.altitudeAngle === 'number') { postureCollector.alt.push(s.altitudeAngle); postureCollector.az.push(s.azimuthAngle); }
        if (typeof s.tiltX === 'number') { postureCollector.tiltX.push(s.tiltX); postureCollector.tiltY.push(s.tiltY); }
        if (c) postureCollector.pressure.push(s.pressure); }
    }
    if (inContact && anyDrawing) {
      const list = (typeof e.getCoalescedEvents === 'function' && e.getCoalescedEvents()) || [];
      const pts = list.length ? list : [e];
      for (const s of pts) { const p = localPos(s); if (drawLast) drawSegment(drawLast, p, s.pressure); drawLast = p; }
    }
  } else {
    if (e.pointerType === 'touch' && penDown && rec) W.palm.touchPointerMovesDuringPen++;
    if (anyDrawing && (e.buttons & 1 || e.pointerType === 'touch')) { const p = localPos(e); if (drawLast) drawSegment(drawLast, p, e.pressure || 0.3); drawLast = p; }
  }
});

function endPointer(e, cancelled) {
  const W = R.win, rec = recording();
  if (rec) { if (cancelled) W.events.cancel++; else W.events.up++; bump(W.pointerTypes, e.pointerType); bump(W.buttonsSeen, String(e.buttons)); }
  if (e.pointerType === 'pen' && penDown && e.pointerId === penDownId) {
    penDown = false;
    if (rec) { W.contactSeconds += (now() - penDownAt) / 1000; W.strokes++; }
    R.grip.strokes++;
  }
  anyDrawing = false; drawLast = null;
}
pad.addEventListener('pointerup', e => endPointer(e, false));
pad.addEventListener('pointercancel', e => endPointer(e, true));
pad.addEventListener('pointerleave', e => { if (e.pointerType === 'pen' && recording()) R.win.hover.enterLeave++; });

// Touch Events（WebKit 私有扩展：Touch.altitudeAngle / azimuthAngle / touchType）
function onTouch(kind, e) {
  if (!recording()) return;
  const T = R.win.touchExt;
  if (kind === 'start') T.touchstarts++; else T.touchmoves++;
  const t = e.changedTouches && e.changedTouches[0];
  if (!t) return;
  if (T.hasAltitude === null) {
    T.hasAltitude = 'altitudeAngle' in t; T.hasAzimuth = 'azimuthAngle' in t; T.hasTouchType = 'touchType' in t; T.hasForce = 'force' in t;
  }
  if ('touchType' in t) bump(T.touchTypes, String(t.touchType)); else bump(T.touchTypes, 'n/a');
  if (T.altitudeSample === null && typeof t.altitudeAngle === 'number') T.altitudeSample = { altitudeAngle: t.altitudeAngle, azimuthAngle: t.azimuthAngle, force: t.force, touchType: t.touchType };
  if (penDown) {
    R.win.palm.touchEventsDuringPen++;
    for (const c of e.changedTouches) if (c.touchType !== 'stylus') R.win.palm.nonStylusTouchesDuringPen++;
  }
}
pad.addEventListener('touchstart', e => onTouch('start', e), { passive: true });
pad.addEventListener('touchmove', e => onTouch('move', e), { passive: true });

// ---------- rAF 频率 ----------
let lastFrame = null;
function frame(ts) {
  const st = R.rafLive.stamps; st.push(ts);
  while (st.length && ts - st[0] > 1000) st.shift();
  R.rafLive.hz = st.length > 1 ? (st.length - 1) / ((ts - st[0]) / 1000) : null;
  if (recording()) { R.win.frames++; if (lastFrame != null) R.win.frameIntervals.push(ts - lastFrame); }
  lastFrame = ts;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- 任务：10 秒窗口 / 静握 / 清零 ----------
const status = $('status');
let windowTimer = null, windowTick = null;
function startWindow() {
  clearTimeout(windowTimer); clearInterval(windowTick);
  R.win = freshWindow(); R.win.active = true; R.win.startedAt = now(); R.continuous = false; lastFrame = null;
  $('btnWindow').disabled = true;
  const t0 = now();
  windowTick = setInterval(() => { status.textContent = `采样中… 剩余 ${Math.max(0, 10 - (now() - t0) / 1000).toFixed(1)} s。请用 Pencil 持续书写横竖。`; }, 100);
  windowTimer = setTimeout(() => {
    clearInterval(windowTick);
    const W = R.win;
    if (penDown) { W.contactSeconds += (now() - penDownAt) / 1000; penDownAt = now(); }
    W.seconds = (now() - W.startedAt) / 1000; W.active = false; W.frozen = true;
    $('btnWindow').disabled = false;
    status.textContent = `10 秒窗口结束（已冻结）。pen 接触 ${W.contactSeconds.toFixed(1)} s / ${W.strokes} 笔。可继续「静握 2 秒」或「导出结果」；「清零并连续采集」恢复实时。`;
    render();
  }, 10000);
}
$('btnWindow').addEventListener('click', startWindow);

$('btnReset').addEventListener('click', () => {
  clearTimeout(windowTimer); clearInterval(windowTick);
  R.win = freshWindow(); R.continuous = true; lastFrame = null;
  R.grip = { altitude: pool(20000), azimuth: pool(20000), tiltX: pool(20000), tiltY: pool(20000), pressure: pool(20000), strokes: 0 };
  R.posture = null; $('btnWindow').disabled = false;
  status.textContent = '已清零，连续采集中。';

$('btnPosture').addEventListener('click', () => {

    clearInterval(prepTimer);

    status.textContent = '记录中（2 秒）… 保持不动。';
    setTimeout(() => {
      const c = postureCollector; postureCollector = null; btn.disabled = false;
      const az = circStats(c.az);
      R.posture = {
        samples: c.n, seconds: (now() - c.startedAt) / 1000,
        altitudeStdDeg: std(c.alt) != null ? std(c.alt) * DEG : null,

// ---------- 导出（回退链，与 js/export-fallback.js 同步；本页是独立非模块页面，故内联一份等价实现） ----------
// (a) POST 页面相对 save-json?name=probe（Mac 上 node server.js；页面在 / 或 /bimo/ 下都对）→ exports/ 路径
// (b) navigator.share({files})：iPad Safari 15+，AirDrop 到 Mac 或存到「文件」（GitHub Pages 上没有服务器时的主路径）
// (c) <a download>：iPad 进「文件」App 的「下载」，桌面进「下载」文件夹  (d) 剪贴板 / 展开下方文本框手动复制
// 端点判定（serverSays，与模块版同一套）：2xx 成功；400/413 且响应体是 server.js 原话 → 服务器在拒绝，如实报告不回退；
// 探测确认过有服务器后再遇非 2xx 也如实报告；其余非 2xx（404/405/501，以及 CDN/反代对 POST 的 403/400/502…）→ 视作无端点，回退。
// share 必须在用户手势的同步链路里：页面加载时先探测端点（POST 空体：server.js 回 400 不落盘），点击时已知无服务器就直接 share。
// share 只在触屏设备（iPad）上参与（shareable）：桌面 Safari/Chrome 也有 navigator.share，但桌面要的是直接下载，也不探测。
let serverKnown = null;   // true / false / null(未知)
const SERVER_REJECT = /^(Bad name\b|Body is not valid JSON\b|Payload Too Large\b|Bad URL\b|Bad percent-encoding\b|Null byte in path\b|Bad path\b)/;
const ABSENT_USUAL = new Set([404, 405, 501]);
const serverSays = (status, text = '') => (status >= 200 && status < 300) ? 'ok'
  : ((status === 400 || status === 413) && SERVER_REJECT.test(String(text).trimStart())) ? 'reject' : 'absent';
const isTouchDevice = () => (navigator.maxTouchPoints > 0) || (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches);
const shareable = () => !!(navigator.share && navigator.canShare) && isTouchDevice();
const probeServer = () => shareable() ? fetch('save-json', { method: 'POST', cache: 'no-store' })
  .then(async r => serverSays(r.status, await r.text().catch(() => '')) !== 'absent', () => false)
  .then(v => (serverKnown = v)) : Promise.resolve(null);
probeServer();
const noServerReason = (r) => r.serverStatus === 0 ? '连不上导出服务器'
  : (typeof r.serverStatus === 'number' && !ABSENT_USUAL.has(r.serverStatus)) ? `端点返回 HTTP ${r.serverStatus}` : '无导出服务器';
const kb = n => (n / 1024).toFixed(1) + ' KB';
async function exportBlob({ blob, name, endpoint, serverBody, serverHeaders, title, clipboardText, onStatus }) {
  const bytes = blob.size, st = onStatus || (() => {});
  const extra = {};   // 回退结果附带 serverStatus（POST 的状态码；0 = 网络错误；跳过 POST 时没有）
  if (!(shareable() && serverKnown === false)) {
    st(`上传 ${name}（${kb(bytes)}）…`);
    try {
      const r = await fetch(endpoint, { method: 'POST', headers: serverHeaders, body: serverBody });
      const text = await r.text();
      const verdict = serverKnown === true && !r.ok ? 'reject' : serverSays(r.status, text);
      if (verdict === 'ok') { serverKnown = true; return { ok: true, mode: 'server', status: r.status, text, bytes, name }; }
      if (verdict === 'reject') { serverKnown = true; return { ok: false, mode: 'server', status: r.status, text, bytes, name }; }
      serverKnown = false; extra.serverStatus = r.status;
      st(`${noServerReason(extra)}，改用系统共享 / 下载…`);
    } catch (err) { extra.serverStatus = 0; st('连不上导出服务器，改用系统共享 / 下载…'); }
  }
  const file = new File([blob], name, { type: blob.type });
  const active = navigator.userActivation ? navigator.userActivation.isActive : true;
  if (active && shareable() && navigator.canShare({ files: [file] })) {
    st('打开系统共享…');
    try { await navigator.share({ files: [file], title }); return { ok: true, mode: 'share', bytes, name, ...extra }; }
    catch (err) { if (err && err.name === 'AbortError') return { ok: false, mode: 'share', text: 'cancelled', bytes, name, ...extra }; }
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener'; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return { ok: true, mode: 'download', bytes, name, ...extra };
  } catch (err) { /* 继续 */ }
  try {
    if (clipboardText != null && navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(clipboardText);
      return { ok: true, mode: 'clipboard', bytes, name, text: clipboardText, ...extra };
    }
  } catch (err) { /* 继续 */ }
  return { ok: false, mode: 'text', bytes, name, text: clipboardText, ...extra };
}

const exportMsg = $('exportMsg'), jsonOut = $('jsonOut');
$('btnExport').addEventListener('click', async () => {

  const size = kb(json.length);

  // exportBlob 到 navigator.share 之前没有 await：保住点击手势链路
  const r = await exportBlob({
    blob: new Blob([json], { type: 'application/json' }), name, title: 'bimo 探针结果',
    endpoint: 'save-json?name=probe', serverBody: json, serverHeaders: { 'Content-Type': 'application/json' },
    clipboardText: json, onStatus: setMsg,
  });
  const ok = (html) => { exportMsg.innerHTML = `<span style="color:#7ee2a8">${html}</span>`; };
  const bad = (html) => { exportMsg.innerHTML = `<span style="color:#ff8a80">${html}</span>`; };
  const why = esc(noServerReason(r));   // 无导出服务器 / 端点返回 HTTP 403 / 连不上导出服务器
  const where = isTouchDevice() ? 'iPad 在「文件」App 的「下载」里' : '在浏览器的「下载」文件夹';
  if (r.mode === 'server' && r.ok) exportMsg.innerHTML = `已保存到 Mac：<b style="color:#7ee2a8">${esc(r.text)}</b>（${size}）`;
  else if (r.mode === 'server') bad(`服务器拒绝 HTTP ${r.status}：${esc(r.text)}`);
  else if (r.mode === 'share' && r.ok) ok(`${why}（GitHub Pages / 静态站），已用系统共享发送 <b>${esc(name)}</b>（${size}）——AirDrop 到 Mac 或存到「文件」。`);
  else if (r.mode === 'share') bad('已取消共享；可再点一次，或展开下方手动复制 JSON。');
  else if (r.mode === 'download') ok(`${why}，已改为下载 <b>${esc(name)}</b>（${size}）——${where}。`);
  else if (r.mode === 'clipboard') ok(`${why}，已复制 JSON 到剪贴板（${size}）——通用剪贴板可直接在 Mac 粘贴。`);
  else bad(`${why}，且无可用导出通道：请展开下方「查看 / 手动复制 JSON」全选复制（通用剪贴板可直接在 Mac 粘贴）。局域网联调请确认 Mac 上以 <code>node server.js 8642 --lan</code> 启动。`);
});
$('btnCopy').addEventListener('click', async () => {
  if (!jsonOut.value) jsonOut.value = JSON.stringify(snapshot(), null, 2);
  try { await navigator.clipboard.writeText(jsonOut.value); exportMsg.textContent = '已复制到剪贴板。'; }
  catch (err) { jsonOut.focus(); jsonOut.select(); exportMsg.textContent = '已全选，请手动复制。'; }
});

window.__probe = { snapshot, R, feat };
})();
</script>
</body>
</html>
